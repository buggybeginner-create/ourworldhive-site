plugins { id 'com.android.application' }
android {
    namespace 'com.ourworldhive.expense'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ourworldhive.expense'
        minSdk 24
        targetSdk 34
        versionCode(1000 + ((System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int) * 10 + ((System.getenv('GITHUB_RUN_ATTEMPT') ?: '1') as int))
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    /* one fixed key, kept in the repository, so every new build installs over the old one without losing data */
    signingConfigs {
        debug { storeFile file('../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        /* Play Store upload key (same as the other apps); its password comes from the GitHub secret DIARY_KEY_PASS */
        upload { storeFile file('../../android-diary/upload.keystore'); storePassword System.getenv('DIARY_KEY_PASS') ?: ''; keyAlias 'upload'; keyPassword System.getenv('DIARY_KEY_PASS') ?: ''; storeType 'pkcs12' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { signingConfig signingConfigs.upload; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
