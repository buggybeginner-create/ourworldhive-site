<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Magic Math | Ourworldhive Kids</title>
<meta name="description" content="Count, add, subtract and multiply with fun bubbles. A free kids game.">
<link rel="stylesheet" href="kidkit.css">
<style>#q{position:fixed;left:0;right:0;top:120px;text-align:center;font-size:clamp(34px,10vw,64px);font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);padding:0 16px}
#objs{font-size:clamp(28px,8vw,44px);line-height:1.3;word-break:break-all}
#ans{position:fixed;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 16px;max-width:460px;margin:auto}
#ans .btn{font-size:clamp(28px,8vw,40px);padding:22px 0}</style></head><body>
<div id="q"></div><div id="ans"></div>
<div class="panel on" id="start"><div class="big">🔢</div><h1>Magic Math</h1><p>Pick a level!</p><div class="menu"><button class="btn g" data-l="1">🍎 Counting</button><button class="btn p" data-l="2">➕ Adding</button><button class="btn y" data-l="3">➖ Subtracting</button><button class="btn" data-l="4">✖️ Times</button></div></div>
<div class="panel" id="win"><div class="big">🏆</div><h1>Super!</h1><p>10 right answers!</p><div class="menu"><button class="btn g" id="more">Keep going</button><button class="btn" id="menu">Change level</button></div></div>
<script src="kidkit.js"></script>
<script>
KK.top('Magic Math','🔢');
var lvl=1,right=0,ans=0,E=['🍎','⭐','🐟','🎈','🍪','🐥'];
function make(){var a,b,t,s;
 if(lvl===1){a=KK.rnd(1,10);ans=a;var e=KK.pick(E);t='<div id="objs">'+Array(a+1).join(e)+'</div>How many?';s='How many?'}
 else if(lvl===2){a=KK.rnd(1,10);b=KK.rnd(1,10);ans=a+b;t=a+' + '+b+' = ?';s=a+' plus '+b}
 else if(lvl===3){a=KK.rnd(5,15);b=KK.rnd(1,a);ans=a-b;t=a+' − '+b+' = ?';s=a+' minus '+b}
 else{a=KK.rnd(2,9);b=KK.rnd(2,9);ans=a*b;t=a+' × '+b+' = ?';s=a+' times '+b}
 document.getElementById('q').innerHTML=t;KK.say(s);
 var o=[ans];while(o.length<4){var v=Math.max(0,ans+KK.rnd(-4,4));if(o.indexOf(v)<0)o.push(v)}
 var h=document.getElementById('ans');h.innerHTML='';KK.shuffle(o).forEach(function(v){var b=document.createElement('button');b.className='btn '+KK.pick(['g','p','y']);b.textContent=v;b.onclick=function(){pick(v,b)};h.appendChild(b)})}
function pick(v,b){if(v===ans){KK.sfx.ding();KK.addStars(1);right++;if(right%10===0){KK.sfx.win();KK.confetti(40);document.getElementById('win').classList.add('on');KK.say('Super!')}else make()}
 else{KK.sfx.oops();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.style.opacity=.35}}
document.querySelectorAll('#start .btn').forEach(function(b){b.onclick=function(){lvl=+b.dataset.l;right=0;document.getElementById('start').classList.remove('on');KK.sfx.tap();make()}});
document.getElementById('more').onclick=function(){document.getElementById('win').classList.remove('on');make()};
document.getElementById('menu').onclick=function(){document.getElementById('win').classList.remove('on');document.getElementById('start').classList.add('on')};
</script></body></html>
