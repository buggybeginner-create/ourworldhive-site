<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My Diary | Ourworldhive</title><meta name="description" content="Your private diary with handwriting, notes and tasks. Sign in and it syncs to every device."><meta name="theme-color" content="#050918"><link rel="canonical" href="https://ourworldhive.com/diary.html"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050918'/%3E%3Cpath d='M16 3.5 27 9.8v12.4L16 28.5 5 22.2V9.8z' fill='none' stroke='%23ffc857' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23eaf1ff' stroke-width='1.6'/%3E%3C/svg%3E"><meta property="og:type" content="website"><meta property="og:site_name" content="Ourworldhive"><meta property="og:title" content="My Diary | Ourworldhive"><meta property="og:description" content="Your private diary with handwriting, notes and tasks. Sign in and it syncs to every device."><meta property="og:url" content="https://ourworldhive.com/diary.html"><meta name="twitter:card" content="summary"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{ --sx-space:#050918; --sx-ink:#eaf1ff; --sx-soft:#cdd8f5; --sx-muted:#93a4cc; --sx-line:rgba(255,255,255,.14); --sx-gold:#ffc857;
  --sx-d:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --sx-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hh:calc(56px + env(safe-area-inset-top,0px)); --fh:calc(38px + env(safe-area-inset-bottom,0px)); }
.sx-head{ position:sticky; top:0; z-index:100; height:var(--hh); padding-top:env(safe-area-inset-top,0px); background:rgba(5,9,24,.9);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--sx-line); font-family:var(--sx-b); }
.sx-head.fixed{ position:fixed; left:0; right:0; top:0; }
.sx-in{ max-width:1180px; height:56px; margin:0 auto; padding:0 18px; display:flex; align-items:center; gap:20px; }
.sx-brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--sx-ink); flex:none; }
.sx-brand span{ font-family:var(--sx-d); font-weight:700; font-size:21px; letter-spacing:-.025em; }
.sx-head nav{ margin-left:auto; }
.sx-nav{ display:flex; gap:2px; margin:0; padding:0; list-style:none; }
.sx-nav a{ position:relative; display:flex; align-items:center; gap:5px; height:56px; padding:0 12px; color:var(--sx-muted); text-decoration:none; font-weight:500; font-size:15px; transition:color .15s; }
.sx-nav a:hover{ color:var(--sx-ink); }
.sx-nav a[aria-current="page"]{ color:var(--sx-ink); font-weight:600; }
.sx-nav a[aria-current="page"]::after{ content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:3px; border-radius:3px 3px 0 0; background:var(--sx-gold); }
.sx-ext{ opacity:.7; }
.sx-head a:focus-visible,.sx-foot a:focus-visible,.sx-burger:focus-visible{ outline:2px solid var(--sx-gold); outline-offset:-2px; border-radius:6px; }
.sx-burger{ display:none; margin-left:auto; width:44px; height:44px; border:0; background:transparent; border-radius:10px; position:relative; }
.sx-burger span{ position:absolute; left:11px; right:11px; height:2px; border-radius:2px; background:var(--sx-ink); transition:transform .2s, opacity .2s; }
.sx-burger span:nth-child(1){ top:15px; } .sx-burger span:nth-child(2){ top:21px; } .sx-burger span:nth-child(3){ top:27px; }
.sx-head.open .sx-burger span:nth-child(1){ transform:translateY(6px) rotate(45deg); }
.sx-head.open .sx-burger span:nth-child(2){ opacity:0; }
.sx-head.open .sx-burger span:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }
@media (max-width:900px){
  .sx-burger{ display:block; }
  .sx-head nav{ position:absolute; left:0; right:0; top:100%; margin:0; background:#050918; border-bottom:1px solid var(--sx-line); display:none; max-height:calc(100vh - var(--hh)); overflow:auto; }
  .sx-head.open nav{ display:block; }
  .sx-nav{ flex-direction:column; gap:0; padding:4px 18px 14px; }
  .sx-nav li + li{ border-top:1px solid var(--sx-line); }
  .sx-nav a{ height:50px; padding:0; font-size:17px; }
  .sx-nav a[aria-current="page"]{ color:var(--sx-gold); }
  .sx-nav a[aria-current="page"]::after{ display:none; }
}
.sx-foot{ font-family:var(--sx-b); color:var(--sx-muted); font-size:14px; }
.sx-foot a{ color:var(--sx-soft); text-decoration:none; }
.sx-foot a:hover{ color:var(--sx-gold); text-decoration:underline; text-underline-offset:3px; }
.sx-foot:not(.mini){ margin-top:96px; background:#040714; border-top:1px solid var(--sx-line); }
.sx-fin{ max-width:1180px; margin:0 auto; padding:52px 18px 0; }
.sx-fgrid{ display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr); gap:40px; }
.sx-fbrand p{ margin:14px 0 0; max-width:36ch; line-height:1.6; }
.sx-foot h2{ margin:0 0 14px; font-family:var(--sx-d); font-weight:500; font-size:17px; color:var(--sx-ink); letter-spacing:-.01em; }
.sx-foot ul{ margin:0; padding:0; list-style:none; display:grid; gap:10px; }
.sx-fbar{ margin-top:44px; padding:20px 0 calc(22px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--sx-line); display:flex; justify-content:space-between; gap:8px 24px; flex-wrap:wrap; font-size:13.5px; }
.sx-fbar p{ margin:0; }
.sx-fbar p:first-child{ color:var(--sx-ink); }
@media (max-width:720px){ .sx-fgrid{ grid-template-columns:1fr 1fr; gap:32px 20px; } .sx-fbrand{ grid-column:1/-1; } }
.sx-foot.mini{ position:fixed; left:0; right:0; bottom:0; z-index:100; height:var(--fh); padding:0 16px env(safe-area-inset-bottom,0px); display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:rgba(5,9,24,.94); border-top:1px solid var(--sx-line); font-size:12.5px; white-space:nowrap; }
.sx-foot.mini p{ margin:0; color:var(--sx-ink); overflow:hidden; text-overflow:ellipsis; }
.sx-foot.mini nav{ display:flex; gap:14px; flex:none; }
@media (max-width:460px){ .sx-foot.mini{ font-size:12px; padding-left:12px; padding-right:12px; } .sx-foot.mini nav{ gap:11px; } .sx-foot.mini nav a:nth-child(3){ display:none; } }

*,*::before,*::after{ box-sizing:border-box; }
html{ background:var(--sx-space); color-scheme:dark; }
body{ margin:0; min-height:100vh; display:flex; flex-direction:column; color:var(--sx-ink); font-family:var(--sx-b); -webkit-font-smoothing:antialiased; font-size:17px; line-height:1.6;
  background:radial-gradient(1000px 560px at 85% -8%,#1a2461 0%,transparent 62%),radial-gradient(800px 460px at -8% 8%,#2a1a55 0%,transparent 58%),var(--sx-space); }
main{ flex:1 0 auto; }
a{ color:#7cc4ff; }
h1,h2,h3{ font-family:var(--sx-d); letter-spacing:-.025em; margin:0; }
.btn{ display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 24px; border-radius:999px; font-weight:600; font-size:16px; text-decoration:none; border:1px solid var(--sx-line); color:var(--sx-ink); background:rgba(255,255,255,.06); transition:background .15s, filter .15s; }
.btn:hover{ background:rgba(255,255,255,.12); }
.btn.gold{ border:0; color:#1a1030; background:linear-gradient(135deg,#ffc857,#ff9f5a); }
.btn.gold:hover{ filter:brightness(1.07); }
.btn:focus-visible{ outline:2px solid var(--sx-gold); outline-offset:3px; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 18px; }

/* home hero */
.hero{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:32px; align-items:center; padding:clamp(40px,8vw,96px) 0 clamp(24px,5vw,56px); }
.hero h1{ font-size:clamp(42px,6.6vw,88px); font-weight:700; line-height:.98; letter-spacing:-.04em; max-width:12ch; }
.hero p{ margin:24px 0 0; max-width:50ch; font-size:clamp(17px,1.7vw,20px); color:var(--sx-soft); line-height:1.6; }
.hero .cta{ margin-top:32px; display:flex; flex-wrap:wrap; gap:12px; }
.orb{ width:100%; max-width:480px; justify-self:center; display:block; }
a.orblink{ display:block; border-radius:50%; }
a.orblink:focus-visible{ outline:2px solid var(--sx-gold); outline-offset:6px; }
@media (max-width:820px){ .hero{ grid-template-columns:1fr; } .orb{ max-width:340px; } .hero h1{ max-width:14ch; } }

/* index rows */
.sec{ padding:clamp(40px,7vw,80px) 0 0; }
.sec > h2{ font-size:clamp(28px,3.6vw,44px); font-weight:700; }
.sec > .lede{ margin:12px 0 0; max-width:56ch; color:var(--sx-muted); }
.rows{ margin-top:32px; border-bottom:1px solid var(--sx-line); }
.row{ display:grid; grid-template-columns:minmax(150px,.7fr) minmax(0,1.6fr) 124px; gap:8px 28px; align-items:center; padding:26px 6px; border-top:1px solid var(--sx-line); text-decoration:none; color:var(--sx-ink); transition:background .2s; }
.row:hover{ background:rgba(255,255,255,.04); }
.row:focus-visible{ outline:2px solid var(--sx-gold); outline-offset:-2px; }
.row h3{ font-size:clamp(26px,3.2vw,38px); font-weight:700; transition:color .2s; }
.row:hover h3{ color:var(--sx-gold); }
.row p{ margin:0; color:var(--sx-soft); font-size:16.5px; max-width:58ch; }
.tag{ justify-self:end; padding:5px 13px; border-radius:999px; font-size:13.5px; font-weight:600; border:1px solid var(--sx-gold); color:var(--sx-gold); white-space:nowrap; }
.tag.soon{ border-color:var(--sx-line); color:var(--sx-muted); }
@media (max-width:700px){ .row{ grid-template-columns:minmax(0,1fr) auto; padding:22px 2px; } .row p{ grid-column:1/-1; grid-row:2; } }

/* globe abilities */
.abil{ margin:32px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:0 56px; }
.abil div{ padding:20px 0; border-top:1px solid var(--sx-line); }
.abil dt{ font-family:var(--sx-d); font-weight:700; font-size:21px; letter-spacing:-.015em; }
.abil dd{ margin:6px 0 0; color:var(--sx-soft); font-size:16.5px; max-width:52ch; }
@media (max-width:760px){ .abil{ grid-template-columns:1fr; } }
.closer{ margin-top:clamp(40px,6vw,72px); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px 32px; padding:32px 0 0; border-top:1px solid var(--sx-line); }
.closer h2{ font-size:clamp(26px,3.4vw,40px); max-width:20ch; }

/* text pages */
.page{ max-width:760px; margin:0 auto; padding:clamp(40px,7vw,80px) 18px 0; }
.page h1{ font-size:clamp(38px,5.6vw,64px); font-weight:700; line-height:1.02; letter-spacing:-.035em; }
.page .lede{ margin:18px 0 0; font-size:clamp(18px,2vw,21px); color:var(--sx-soft); line-height:1.55; }
.page h2{ margin:44px 0 10px; font-size:26px; font-weight:700; }
.page p,.page li{ color:var(--sx-soft); line-height:1.72; }
.page p{ margin:0 0 14px; }
.page ul{ padding-left:22px; margin:0 0 14px; }
.page li{ margin-bottom:6px; }
.page .upd{ color:var(--sx-muted); font-size:14.5px; margin-top:14px; }
.page .cta{ margin-top:30px; display:flex; flex-wrap:wrap; gap:12px; }
.page :target{ scroll-margin-top:84px; }

html,body{ height:100%; }
body{ overflow:hidden; }
.dwrap{ position:fixed; left:0; right:0; top:var(--hh); bottom:var(--fh); }
.dwrap iframe{ display:block; width:100%; height:100%; border:0; background:#c9d0cb; }
</style></head>

  var h=document.querySelector('.sx-head'), b=document.getElementById('sxburger');
  if(h&&b){
    function set(o){ h.classList.toggle('open',o); b.setAttribute('aria-expanded',o?'true':'false'); b.setAttribute('aria-label',o?'Close menu':'Open menu'); }
    b.addEventListener('click',function(e){ e.stopPropagation(); set(!h.classList.contains('open')); });
