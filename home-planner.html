function applyField(el,live){const k=el.dataset.k,ty=el.dataset.ty;if(k==null)return;let o=getObj(sel);let v;
 if(k==='M.s.h'){const L=parseLen(el.value);if(!(L>=.5&&L<=10)){renderEdit();return}M.s.h=L;commit();return}
 if(!o)return;
 if(ty==='len'){v=parseLen(el.value);if(!(v>=0&&isFinite(v))){renderEdit();return}if(k==='w'||k==='d'&&sel.t==='item'||k==='s'||k==='t'||k==='h'){v=Math.max(.02,v)}
  if(sel.t==='op'&&k==='d'){const q=opGeo(o);v=clamp(v+o.w/2,o.w/2+.02,q.L-o.w/2-.02)}
  if(sel.t==='op'&&k==='w'){const q=opGeo(o);v=Math.min(v,q.L-.1)}
  o[k]=v;if(sel.t==='op'&&k==='w'){const q=opGeo(o);o.d=clamp(o.d,o.w/2+.02,q.L-o.w/2-.02)}if(sel.t==='wall'&&k==='h'){}}
 else if(ty==='wlen'){v=parseLen(el.value);if(!(v>.05)){renderEdit();return}const L=wLen(o),ux=(o.b.x-o.a.x)/L,uy=(o.b.y-o.a.y)/L;const ob={...o.b};o.b.x=o.a.x+ux*v;o.b.y=o.a.y+uy*v;for(const w of M.walls){if(w.id===o.id)continue;for(const e of['a','b'])if(Math.hypot(w[e].x-ob.x,w[e].y-ob.y)<.03){w[e].x=o.b.x;w[e].y=o.b.y}}for(const op of M.ops)if(op.wall===o.id){op.d=clamp(op.d,op.w/2+.02,Math.max(op.w/2+.02,v-op.w/2-.02))}}
 else if(ty==='rw'||ty==='rh'){v=parseLen(el.value);if(!(v>.5)){renderEdit();return}const b=roomBox(o);transformRoom(o,{x0:b.x0,y0:b.y0,x1:ty==='rw'?b.x0+v:b.x1,y1:ty==='rh'?b.y0+v:b.y1,w:ty==='rw'?v:b.w,h:ty==='rh'?v:b.h},false)}
 else if(ty==='num'){v=+el.value;o[k]=v}
 else if(ty==='deg'){o.r=(+el.value)*PI/180;if(live){onChange(true);const sp=el.nextElementSibling;if(sp)sp.textContent=el.value+'°';return}}

 else{o[k]=el.value;if(sel.t==='op'&&k==='type'){const D=OPD[o.type];o.w=Math.min(D.w,Math.max(.3,opGeo(o).L-.1));o.h=D.h;o.sill=D.sill;const q=opGeo(o);o.d=clamp(o.d,o.w/2+.02,q.L-o.w/2-.02)}}
 commit()}

function insideWalls(room,col){const pts=room.pts;for(const w of M.walls){const mx=(w.a.x+w.b.x)/2,my=(w.a.y+w.b.y)/2;const L=wLen(w);const nx=-(w.b.y-w.a.y)/L,ny=(w.b.x-w.a.x)/L;const b=roomBox(room);const onEdge=(Math.abs(mx-b.x0)<.08||Math.abs(mx-b.x1)<.08||Math.abs(my-b.y0)<.08||Math.abs(my-b.y1)<.08)&&mx>=b.x0-.08&&mx<=b.x1+.08&&my>=b.y0-.08&&my<=b.y1+.08;if(!onEdge)continue;if(inPoly({x:mx+nx*.25,y:my+ny*.25},pts))w.c1=col;else if(inPoly({x:mx-nx*.25,y:my-ny*.25},pts))w.c2=col}}

function mkBoxOf(parts){let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,h=0;for(const p of parts){if(p.t==='P'){for(const q of p.pts){x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);z0=Math.min(z0,q.z);z1=Math.max(z1,q.z)}h=Math.max(h,p.y+p.h);continue}const ca=Math.abs(Math.cos(p.a||0)),sa=Math.abs(Math.sin(p.a||0));const hx=ca*p.w/2+sa*p.d/2,hz=sa*p.w/2+ca*p.d/2;x0=Math.min(x0,p.x-hx);x1=Math.max(x1,p.x+hx);z0=Math.min(z0,p.z-hz);z1=Math.max(z1,p.z+hz);h=Math.max(h,p.y+p.h)}if(x0>x1)return{cx:0,cz:0,W:1,D:1,H:1};return{cx:(x0+x1)/2,cz:(z0+z1)/2,W:Math.max(.05,x1-x0),D:Math.max(.05,z1-z0),H:Math.max(.05,h)}}

function mkQuick(k){const d=MK.d,{L,W,H,N}=MKG,P=d.parts,A=(q)=>P.push(q);const n=clamp(Math.round(N),2,40);
 if(d.parts.length===1&&d.parts[0].w===1&&d.parts[0].d===1&&d.parts[0].h===.5&&d.parts[0].c==='m'&&!d.__u){P.length=0}d.__u=1;

 else if(k==='rail'){A(newPart('b',{x:0,z:0,y:H-.05,w:L,d:.05,h:.05,c:'#5a4636'}));A(newPart('b',{x:0,z:0,y:.1,w:L,d:.03,h:.03,c:'#5a4636'}));const np=Math.max(2,Math.floor(L/.9)+1);for(let i=0;i<np;i++)A(newPart('b',{x:-L/2+.025+i*(L-.05)/(np-1),z:0,y:0,w:.05,d:.05,h:H,c:'#5a4636'}));const ns=Math.floor(L/.12);for(let i=1;i<ns;i++)A(newPart('c',{x:-L/2+i*L/ns,z:0,y:.1,w:.015,d:.015,h:H-.15,c:'#8a8f96'}))}

function drawPen(){const cv=$('#penPad');if(!cv)return;const g=cv.getContext('2d');g.fillStyle='#fffdf6';g.fillRect(0,0,600,360);g.strokeStyle='rgba(60,70,110,.14)';g.lineWidth=1;g.beginPath();for(let x=0;x<=600;x+=50){g.moveTo(x,0);g.lineTo(x,360)}for(let y=0;y<=360;y+=50){g.moveTo(0,y);g.lineTo(600,y)}g.stroke();g.strokeStyle='rgba(60,70,110,.35)';g.beginPath();g.moveTo(300,0);g.lineTo(300,360);g.moveTo(0,180);g.lineTo(600,180);g.stroke();g.strokeStyle='#1b2240';g.lineWidth=3.5;g.lineJoin=g.lineCap='round';for(const s of MKP.strokes){g.beginPath();s.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.stroke()}}
(()=>{let cur=null;const pos=(e,cv)=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*360/r.height}};
 document.addEventListener('pointerdown',e=>{const cv=e.target.id==='penPad'?e.target:null;if(!cv)return;cv.setPointerCapture(e.pointerId);cur=[pos(e,cv)];MKP.strokes.push(cur);drawPen()});

function penRecog(){const d=MK.d;if(!d)return 0;const P=d.parts;const H=Math.max(.02,MKP.H),T=Math.max(.02,MKP.T);let n=0;const toM=q=>({x:(q.x-300)/100,y:(q.y-180)/100});
 for(const st of MKP.strokes){if(st.length<3)continue;const pts=st.map(toM);let per=0;for(let i=1;i<pts.length;i++)per+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);if(per<.15)continue;const f=pts[0],l=pts[pts.length-1];const closed=Math.hypot(f.x-l.x,f.y-l.y)<Math.max(.25,per*.15);
  if(closed){const cx=pts.reduce((s,q)=>s+q.x,0)/pts.length,cy=pts.reduce((s,q)=>s+q.y,0)/pts.length;const rs=pts.map(q=>Math.hypot(q.x-cx,q.y-cy));const mr=rs.reduce((s,v)=>s+v,0)/rs.length;const sd=Math.sqrt(rs.reduce((s,v)=>s+(v-mr)*(v-mr),0)/rs.length);
   if(mr>.08&&sd/mr<.17){P.push(newPart('c',{x:cx,z:cy,w:mr*2,d:mr*2,h:H}));n++;continue}
   let sp=simplifyPts(pts,.12);if(sp.length>3&&Math.hypot(sp[0].x-sp[sp.length-1].x,sp[0].y-sp[sp.length-1].y)<.3)sp=sp.slice(0,-1);
   const bx0=Math.min(...pts.map(q=>q.x)),bx1=Math.max(...pts.map(q=>q.x)),by0=Math.min(...pts.map(q=>q.y)),by1=Math.max(...pts.map(q=>q.y));
   let ar=0;for(let i=0;i<sp.length;i++){const q=sp[(i+1)%sp.length];ar+=sp[i].x*q.y-q.x*sp[i].y}ar=Math.abs(ar)/2;
   if(sp.length<=4&&ar/((bx1-bx0)*(by1-by0)||1)>.8){P.push(newPart('b',{x:(bx0+bx1)/2,z:(by0+by1)/2,w:bx1-bx0,d:by1-by0,h:H}));n++;continue}
   if(sp.length>=3){P.push({t:'P',pts:sp.map(q=>({x:q.x,z:q.y})),x:0,z:0,y:0,w:1,d:1,h:H,c:'m',a:0});n++}}
  else{const sp=simplifyPts(pts,.1);for(let i=0;i<sp.length-1;i++){const A=sp[i],Bq=sp[i+1],len=Math.hypot(Bq.x-A.x,Bq.y-A.y);if(len<.04)continue;P.push(newPart('b',{x:(A.x+Bq.x)/2,z:(A.y+Bq.y)/2,w:len,d:T,h:H,a:Math.atan2(Bq.y-A.y,Bq.x-A.x)}));n++}}}
 return n}

function lineScan(dark,w,h){const segs=[];const minLen=Math.max(12,Math.round(Math.min(w,h)*.05));for(let y=0;y<h;y++){let x=0;while(x<w){if(dark[y*w+x]){const s=x;while(x<w&&dark[y*w+x])x++;if(x-s>=minLen)segs.push({y,x0:s,x1:x-1})}else x++}}
 const lines=[];let open=[];let ly=-1;for(const s of segs){if(s.y!==ly){open=open.filter(L=>L.y1>=s.y-3);ly=s.y}let m=null;for(const L of open){if(Math.min(L.x1,s.x1)-Math.max(L.x0,s.x0)>Math.min(L.x1-L.x0,s.x1-s.x0)*.5){m=L;break}}if(m){m.y1=s.y;m.x0=Math.min(m.x0,s.x0);m.x1=Math.max(m.x1,s.x1)}else{const L={y0:s.y,y1:s.y,x0:s.x0,x1:s.x1};open.push(L);lines.push(L)}}return lines}
function analyzePhoto(img,realW,mode){const mx=760,sc=Math.min(1,mx/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,w,h);const id=g.getImageData(0,0,w,h).data;const gray=new Float32Array(w*h);for(let i=0;i<w*h;i++)gray[i]=.299*id[i*4]+.587*id[i*4+1]+.114*id[i*4+2];
 const I=new Float64Array((w+1)*(h+1));for(let y=0;y<h;y++){let r=0;for(let x=0;x<w;x++){r+=gray[y*w+x];I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+r}}const R=Math.max(8,Math.round(Math.min(w,h)/28));const dark=new Uint8Array(w*h);
 for(let y=0;y<h;y++){const y0=Math.max(0,y-R),y1=Math.min(h,y+R+1);for(let x=0;x<w;x++){const x0=Math.max(0,x-R),x1=Math.min(w,x+R+1);const area=(x1-x0)*(y1-y0);const s=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0];const mean=s/area;dark[y*w+x]=(gray[y*w+x]<mean*.8&&gray[y*w+x]<190)?1:0}}
 if(mode==='trace')return{trace:1,w,h,scale:realW/w};
 const T=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++)T[x*h+y]=dark[y*w+x];
 let H=lineScan(dark,w,h).map(L=>({k:'h',a:L.x0,b:L.x1,c:(L.y0+L.y1)/2,t:L.y1-L.y0+1}));let Vv=lineScan(T,h,w).map(L=>({k:'v',a:L.x0,b:L.x1,c:(L.y0+L.y1)/2,t:L.y1-L.y0+1}));
 let all=[...H,...Vv];if(!all.length)return null;const top=all.slice().sort((p,q)=>(q.b-q.a)-(p.b-p.a)).slice(0,8).map(l=>l.t).sort((p,q)=>p-q);const med=top[top.length>>1];const keep=l=>l.t>=Math.max(2,med*.45);H=H.filter(keep);Vv=Vv.filter(keep);all=[...H,...Vv];if(!all.length)return null;
 const tol=Math.max(6,med*1.6);for(const l of H){for(const e of['a','b']){let best=null,bd=tol;for(const v of Vv){if(Math.abs(v.c-l[e])<bd&&l.c>=v.a-tol&&l.c<=v.b+tol){bd=Math.abs(v.c-l[e]);best=v}}if(best)l[e]=best.c}}
 for(const v of Vv){for(const e of['a','b']){let best=null,bd=tol;for(const l of H){if(Math.abs(l.c-v[e])<bd&&v.c>=l.a-tol&&v.c<=l.b+tol){bd=Math.abs(l.c-v[e]);best=l}}if(best)v[e]=best.c}}
 let bx0=1e9,bx1=-1e9,by0=1e9,by1=-1e9;for(const l of H){bx0=Math.min(bx0,l.a);bx1=Math.max(bx1,l.b);by0=Math.min(by0,l.c);by1=Math.max(by1,l.c)}for(const v of Vv){by0=Math.min(by0,v.a);by1=Math.max(by1,v.b);bx0=Math.min(bx0,v.c);bx1=Math.max(bx1,v.c)}
 const bw=Math.max(1,bx1-bx0);const s=realW/bw;const q=v=>Math.round(v/.0254/6)*.0254*6;const walls=[];const maxT=Math.max(...all.map(l=>l.t));
 for(const l of H)walls.push({a:{x:q((l.a-bx0)*s),y:q((l.c-by0)*s)},b:{x:q((l.b-bx0)*s),y:q((l.c-by0)*s)},t:l.t>=maxT*.7?.23:.12});
 for(const v of Vv)walls.push({a:{x:q((v.c-bx0)*s),y:q((v.a-by0)*s)},b:{x:q((v.c-bx0)*s),y:q((v.b-by0)*s)},t:v.t>=maxT*.7?.23:.12});
 const W2_=walls.filter(wl=>Math.hypot(wl.b.x-wl.a.x,wl.b.y-wl.a.y)>=.5);
 /* rooms by flood fill */
 const lw=clamp(Math.round(1.0/s),6,Math.round(w/6));const mk=document.createElement('canvas');mk.width=w;mk.height=h;const mg=mk.getContext('2d',{willReadFrequently:true});mg.fillStyle='#fff';mg.fillRect(0,0,w,h);mg.strokeStyle='#000';mg.lineWidth=lw;mg.lineCap='square';mg.beginPath();for(const l of H){mg.moveTo(l.a,l.c);mg.lineTo(l.b,l.c)}for(const v of Vv){mg.moveTo(v.c,v.a);mg.lineTo(v.c,v.b)}mg.stroke();const md=mg.getImageData(0,0,w,h).data;const lab=new Int32Array(w*h);let nl=0;const rooms=[];const stack=[];
 for(let y0=0;y0<h;y0++)for(let x0=0;x0<w;x0++){const i0=y0*w+x0;if(lab[i0]||md[i0*4]<128)continue;nl++;let minx=x0,maxx=x0,miny=y0,maxy=y0,cnt=0,edge=0;stack.length=0;stack.push(i0);lab[i0]=nl;while(stack.length){const i=stack.pop();const x=i%w,y=(i/w)|0;cnt++;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;if(x===0||y===0||x===w-1||y===h-1)edge=1;for(const j of[i-1,i+1,i-w,i+w]){if(j<0||j>=w*h)continue;if(j===i-1&&x===0)continue;if(j===i+1&&x===w-1)continue;if(!lab[j]&&md[j*4]>=128){lab[j]=nl;stack.push(j)}}}
  if(!edge&&cnt>w*h*.004&&maxx-minx>8&&maxy-miny>8){const e=lw/2;rooms.push({x0:(minx-e-bx0)*s,y0:(miny-e-by0)*s,x1:(maxx+e-bx0)*s,y1:(maxy+e-by0)*s})}}
 return{walls:W2_,rooms,bx0,by0,s}}
$('#photoIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const url=URL.createObjectURL(f);const img=new Image();img.onload=()=>{window.__phImg=img;const defW=U==='ft'?'40 ft':'12 m';openDlg(`<h4>Photo → plan</h4><canvas id="phPrev" style="width:100%;border-radius:10px;background:#fff"></canvas><div class="row"><label style="width:120px">Real width of the whole drawing</label><input type="text" id="phW" value="${defW}"></div><p class="note">Tell me how wide the full plan is in real life (outer wall to outer wall). Best with a clean line drawing or a straight, well-lit top-down photo. It finds straight horizontal and vertical walls and closed rooms. Doors, windows and furniture are not read. Dimension lines and text may add extra walls: delete them afterwards.</p><div class="two"><button class="btn gold" id="phGo">Make plan</button><button class="btn" id="phTr">Trace only</button></div><button class="btn" id="phX" style="width:100%;margin-top:8px">Cancel</button>`);const pv=$('#phPrev'),sc=Math.min(1,380/img.width);pv.width=img.width*sc;pv.height=img.height*sc;pv.getContext('2d').drawImage(img,0,0,pv.width,pv.height);
  const run=mode=>{const rw=parseLen($('#phW').value);if(!(rw>1)){toast('Type the real width, like 40 ft or 12 m');return}closeDlg();setTimeout(()=>{try{const r=analyzePhoto(img,rw,mode);if(!r){toast('No walls found. Try a clearer picture, or use Trace only');return}
   if(r.trace){UL={img,ox:0,oy:0,s:img.width>760?rw/img.width:r.scale*760/img.width*(img.width/760),a:.55};UL.s=rw/img.width;toast('Photo is now a trace background. Draw walls over it.');fit2UL();renderPlan();draw2();return}
   const keepS=M.s;M=blank();M.s=keepS;for(const wl of r.walls)addWall(wl.a,wl.b,wl.t);r.rooms.forEach((rm,i)=>addRoom(rm.x0,rm.y0,rm.x1,rm.y1,'Room '+(i+1),i%2?'tile1':'wood1'));sel=null;
   const sf=img.width>760?760/img.width:1;UL={img,ox:-r.bx0/sf*(r.s*sf)*1,oy:-r.by0/sf*(r.s*sf)*1,s:r.s/sf,a:.0};UL.ox=-r.bx0*r.s;UL.oy=-r.by0*r.s;UL.s=r.s*(sf<1?1/sf:1)/(sf<1?1:1);UL.a=0;commit();fit2();fitCam();toast(r.walls.length+' walls and '+r.rooms.length+' rooms made. Check and fix, then add doors, windows and furniture. Undo goes back.')}catch(err){console.error(err);toast('Could not read this picture')}},60)};
  $('#phGo').onclick=()=>run('plan');$('#phTr').onclick=()=>run('trace');$('#phX').onclick=closeDlg};img.onerror=()=>toast('Could not open that picture');img.src=url});
function fit2UL(){if(!UL)return;V.x=UL.ox+UL.img.width*UL.s/2;V.y=UL.oy+UL.img.height*UL.s/2;V.s=clamp(Math.min(W2/(UL.img.width*UL.s*1.1),H2/(UL.img.height*UL.s*1.1)),1.5,160);draw2()}

function init(){buildTools();buildTabs();$('#bUnit').textContent=U;renderLib();new ResizeObserver(()=>{size2();sizeR()}).observe($('#stage'));
 let loaded=false;const s=ls.get('owh_hp_cur');if(s){try{const o=JSON.parse(s);if(o&&Array.isArray(o.walls)){M=Object.assign(blank(),o);loaded=true}}catch(e){}}
 if(loaded){hist=[snapJ()];hi=0;updUR();size2();fit2();fitCam();onChange()}else{size2();loadTemplate('2bhk',1);hist=[snapJ()];hi=0;updUR()}
 setView(innerWidth<=860?'split':'split');renderHint();setSun(14);applyCam();requestAnimationFrame(loop);
 setTimeout(()=>{size2();sizeR();fit2();fitCam();need=true},120)}
init();
window.__hp={get M(){return M},get sel(){return sel},set sel(v){sel=v},V,CAM,setTool,setView,loadTemplate,commit,placeLib,fit2,rebuild3,get R(){return R},renderer:()=>R,setCamMode,undo,redo,applyField};
