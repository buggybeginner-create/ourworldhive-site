 el.innerHTML=`<h4>Wall style (for new walls)</h4>${chips('wstyle',Object.keys(WSTYLES).map(k=>[k,WSTYLES[k].n]),wstyle||'auto')}<p class="note">Pick a style, then draw walls with the Wall tool or add rooms below. Select an existing wall to change its style in the Edit tab.</p>

$('#pans').addEventListener('change',e=>{if(e.target.id==='bW'){const v=parseLen(e.target.value);if(v>.5)BW=v;e.target.value=fmt(BW)}if(e.target.id==='bD'){const v=parseLen(e.target.value);if(v>.5)BD=v;e.target.value=fmt(BD)}});
function buildAct(k){const st=Math.max(gstep(),.1524),cx=Math.round(V.x/st)*st,cy=Math.round(V.y/st)*st;const sn=v=>Math.round(v/st)*st;const W=BW,D=BD;let x0=sn(cx-W/2),y0=sn(cy-D/2),x1=x0+sn(W),y1=y0+sn(D);const Wl=(a,b,x,y)=>addWallK({x:a,y:b},{x:x,y:y});
 if(k==='bRoom'){const r=addRoom(x0,y0,x1,y1,'Room '+(M.rooms.length+1),'wood1');Wl(x0,y0,x1,y0);Wl(x1,y0,x1,y1);Wl(x1,y1,x0,y1);Wl(x0,y1,x0,y0);sel={t:'room',id:r.id}}
 else if(k==='bL'){const mx=x0+sn(W*.55),my=y0+sn(D*.55);const pts=[{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:my},{x:mx,y:my},{x:mx,y:y1},{x:x0,y:y1}];const r={id:nid(),pts,name:'L room '+(M.rooms.length+1),floor:'wood1'};M.rooms.push(r);pts.forEach((p,i)=>{const q=pts[(i+1)%pts.length];addWallK(p,q)});sel={t:'room',id:r.id}}
 else if(k==='bBalc'){const old=wstyle;const bw=sn(3),bd=sn(1.3);const a0=sn(cx-bw/2),b0=sn(cy-bd/2);const r=addRoom(a0,b0,a0+bw,b0+bd,'Balcony','tile1');wstyle='rail';Wl(a0,b0,a0+bw,b0);Wl(a0+bw,b0,a0+bw,b0+bd);Wl(a0+bw,b0+bd,a0,b0+bd);Wl(a0,b0+bd,a0,b0);wstyle=old;sel={t:'room',id:r.id};toast('Balcony added. Move it so one long side touches your house wall.')}
 else if(k==='bPara'||k==='bFence'){const bb=bounds();if(bb.empty){toast('Draw some walls first');return}const m=k==='bFence'?1.5:0;const X0=bb.x0-m,Y0=bb.y0-m,X1=bb.x1+m,Y1=bb.y1+m;const old=wstyle;wstyle=k==='bPara'?'para':'half';Wl(X0,Y0,X1,Y0);Wl(X1,Y0,X1,Y1);Wl(X1,Y1,X0,Y1);Wl(X0,Y1,X0,Y0);wstyle=old;toast(k==='bPara'?'Parapet added.':'Fence added (half walls).')}
 else if(k==='bPil'){const s=.3;[[x0,y0],[x1,y0],[x1,y1],[x0,y1]].forEach(([x,y])=>M.pil.push({id:nid(),x,y,s,h:M.s.h,c:'#cfcac0',shape:'sq'}))}
 commit();fit2&&0;draw2()}
