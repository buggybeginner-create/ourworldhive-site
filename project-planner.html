<script>
'use strict';
/* ===== Project Planner Pro: single file, no libraries. Data is stored in this browser (localStorage). ===== */
const KEY='ppro_v1',DAY=864e5,MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pd=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])/DAY};
const dn=n=>new Date(n*DAY).toISOString().slice(0,10);
const fmtD=n=>{if(n==null)return'';const d=new Date(n*DAY);return d.getUTCDate()+'-'+MON[d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(2)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const todayLocal=()=>{const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY};

function compute(){
 TD=P.statusDate?(pd(P.statusDate)||todayLocal()):todayLocal();
 const T=P.tasks.slice().sort((a,b)=>(a.ord||0)-(b.ord||0)),by={},kids={};T.forEach(t=>{by[t.id]=t;kids[t.id]=[]});
 const roots=[];T.forEach(t=>{if(t.parent&&by[t.parent]&&t.parent!==t.id)kids[t.parent].push(t);else roots.push(t)});
 C={};ORDER=[];
 (function walk(list,pre,lv){list.forEach((t,i)=>{const w=pre?pre+'.'+(i+1):''+(i+1);C[t.id]={t,wbs:w,lv,kids:kids[t.id],leaf:!kids[t.id].length};ORDER.push(t.id);walk(kids[t.id],w,lv+1)})})(roots,'',0);
 ORDER.forEach(id=>{const c=C[id];if(!c.leaf)return;const t=c.t;c.ms=!!t.ms;c.d=c.ms?0:Math.max(1,+t.days||1);c.s=pd(t.start)||TD;c.e=c.ms?c.s:c.s+c.d-1;c.pct=clamp(+t.pct||0,0,100)});
 const roll=()=>{for(let i=ORDER.length-1;i>=0;i--){const c=C[ORDER[i]];if(c.leaf)continue;let s=1e9,e=-1e9;c.kids.forEach(k=>{const x=C[k.id];s=Math.min(s,x.s);e=Math.max(e,x.e)});c.s=s;c.e=e;c.d=e-s+1}};
 roll();
 if(P.auto){for(let it=0;it<ORDER.length+2;it++){let ch=false;
  ORDER.forEach(id=>{const c=C[id];if(!c.leaf||!c.t.pred||!c.t.pred.length)return;let st=-1e9;
   c.t.pred.forEach(p=>{const pc=C[p.id];if(pc&&pc!==c)st=Math.max(st,pc.e+1+(+p.lag||0))});
   if(st>-1e9&&st!==c.s){c.s=st;c.e=c.ms?st:st+c.d-1;ch=true}});
  roll();if(!ch)break}}
 ORDER.forEach(id=>{const c=C[id];if(!c.leaf)return;const t=c.t;c.as=pd(t.as);c.ae=pd(t.ae);
  if(c.pct>0&&c.as==null)c.as=Math.min(c.s,TD);if(c.pct>=100&&c.ae==null)c.ae=Math.min(c.e,TD);if(c.pct<100)c.ae=null;
  c.w=c.ms?0:c.d;c.exp=c.ms?(TD>=c.s?100:0):TD<c.s?0:TD>=c.e?100:Math.round((TD-c.s+1)/c.d*100)});
 for(let i=ORDER.length-1;i>=0;i--){const c=C[ORDER[i]];if(c.leaf)continue;let w=0,pw=0,ew=0,as=1e9,ae=-1e9,all=true,sp=0,se=0;
  c.kids.forEach(k=>{const x=C[k.id];w+=x.w;pw+=x.w*x.pct;ew+=x.w*x.exp;sp+=x.pct;se+=x.exp;if(x.as!=null)as=Math.min(as,x.as);if(x.pct<100)all=false;if(x.ae!=null)ae=Math.max(ae,x.ae)});
  const n=c.kids.length;c.w=w;c.pct=w?pw/w:sp/n;c.exp=w?ew/w:se/n;c.as=as<1e9?as:null;c.ae=all?(ae>-1e9?ae:Math.min(c.e,TD)):null;c.ms=false}
 ORDER.forEach(id=>{const c=C[id];c.pct=Math.round(c.pct*10)/10;c.exp=Math.round(c.exp);c.var=Math.round(c.pct-c.exp);
  c.status=c.pct>=100?'Completed':(TD<c.s&&c.pct===0)?'Not started':TD>c.e?'Delayed':(c.pct+10<c.exp)?'Behind':'On track'});
 critical();KPI=null}
function critical(){const L=ORDER.filter(id=>C[id].leaf);if(!L.length)return;const PF=Math.max.apply(null,L.map(id=>C[id].e)),succ={};
 L.forEach(id=>{(C[id].t.pred||[]).forEach(p=>{if(C[p.id]&&C[p.id].leaf)(succ[p.id]=succ[p.id]||[]).push({id,lag:+p.lag||0})})});
 const LF={},vis={};const lf=id=>{if(LF[id]!=null)return LF[id];if(vis[id])return C[id].e;vis[id]=1;let v=PF;(succ[id]||[]).forEach(s=>{const sc=C[s.id];const ls=lf(s.id)-(sc.ms?0:sc.d-1);v=Math.min(v,ls-1-s.lag)});vis[id]=0;return LF[id]=v};
 L.forEach(id=>{const c=C[id];c.float=lf(id)-c.e;c.crit=c.float<=0&&!!((succ[id]&&succ[id].length)||(c.t.pred&&c.t.pred.length))&&c.pct<100})}
const secOf=id=>P.secs.find(s=>s.id===id)||{name:'-',color:'#94a3b8',owner:'',email:''};
const predText=t=>(t.pred||[]).map(p=>{const c=C[p.id];if(!c)return'';const l=+p.lag||0;return c.wbs+(l?(l>0?'+':'')+l:'')}).filter(Boolean).join(', ');
function parsePred(txt,selfId){const map={};ORDER.forEach(id=>map[C[id].wbs]=id);const out=[];
 for(const part of String(txt||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean)){const m=/^(\d+(?:\.\d+)*)\s*([+-]\s*\d+)?$/.exec(part);if(!m)return{err:'"'+part+'" is not valid. Use WBS numbers like 2, 3.1+2'};
  const id=map[m[1]];if(!id)return{err:'No task with WBS '+m[1]};if(id===selfId)return{err:'A task cannot depend on itself'};out.push({id,lag:m[2]?+m[2].replace(/\s/g,''):0})}

function hasCycle(){const by={};P.tasks.forEach(t=>by[t.id]=t);const st={};const dfs=id=>{if(st[id]===1)return true;if(st[id]===2)return false;st[id]=1;for(const p of(by[id].pred||[])){if(by[p.id]&&dfs(p.id))return true}st[id]=2;return false};return P.tasks.some(t=>dfs(t.id))}
const descendants=id=>{const out=[];const walk=i=>C[i]&&C[i].kids.forEach(k=>{out.push(k.id);walk(k.id)});walk(id);return out};
const weightedKPI=(scope)=>{if(!scope&&KPI)return KPI;const L=ORDER.filter(id=>C[id].leaf&&(!scope||scope.indexOf(C[id].t.sec)>=0));let w=0,pp=0,ap=0,due=0,dueDone=0,ms=0,msDone=0;
 L.forEach(id=>{const c=C[id];w+=c.w;pp+=c.w*c.exp;ap+=c.w*c.pct;if(c.ms){ms++;if(c.pct>=100)msDone++}if(c.e<=TD){due++;if(c.pct>=100&&c.ae!=null&&c.ae<=c.e)dueDone++}});
 const cnt={};STATUS.forEach(s=>cnt[s]=0);L.forEach(id=>cnt[C[id].status]++);
 const plan=w?pp/w:0,act=w?ap/w:0;const fin=L.length?Math.max.apply(null,L.map(id=>C[id].e)):TD,st=L.length?Math.min.apply(null,L.map(id=>C[id].s)):TD;
 const res={plan,act,spi:plan?act/plan:1,ontime:due?dueDone/due:1,due,dueDone,cnt,ms,msDone,fin,st,n:L.length};if(!scope)KPI=res;return res};

function rscForm(e){const edit=!!e;e=e||{id:uid(),sec:ui.tk.rsc&&canTrack('rsc',ui.tk.rsc)?ui.tk.rsc:trackSecs('rsc')[0],name:'',type:'Equipment',qty:1,from:dn(TD),to:dn(TD+7),task:'',status:'Required',rate:'',note:''};if(!canTrack('rsc',e.sec)){toast('You can edit only your own sections');return}
 openForm((edit?'Edit ':'Add ')+'resource','<div class="fg">'+fl('fr_sec','Section',fsel('fr_sec',secOptsK('rsc',e.sec),e.sec))+fl('fr_type','Type',fsel('fr_type',RTYPES,e.type))+fl('fr_name','Resource name',finp('fr_name','text',e.name,'placeholder="Crane 100 T, welding set, scaffolding gang"'),1)+fl('fr_qty','Quantity',finp('fr_qty','number',e.qty,'min="1" step="any"'))+fl('fr_st','Status',fsel('fr_st',RST,e.status))+fl('fr_a','Needed from',finp('fr_a','date',e.from))+fl('fr_b','Needed until',finp('fr_b','date',e.to))+fl('fr_rate','Rate per day, per unit ('+esc(P.currency)+', optional)',finp('fr_rate','number',e.rate,'min="0" step="any"'))+fl('fr_t','Task (optional)',fsel('fr_t',taskOpts(''),e.task))+fl('fr_nt','Note',finp('fr_nt','text',e.note||''),1)+'</div>',()=>{
  const sec=$('fr_sec').value,nm=$('fr_name').value.trim();if(!nm){toast('Enter the resource name');return false}if(!canTrack('rsc',sec)){toast('Not your section');return false}const a=$('fr_a').value,b=$('fr_b').value;if(pd(a)==null||pd(b)==null||pd(b)<pd(a)){toast('Check the dates');return false}
  const o=Object.assign({},e,{sec,name:nm,type:$('fr_type').value,qty:+$('fr_qty').value||1,status:$('fr_st').value,from:a,to:b,rate:+$('fr_rate').value||0,task:$('fr_t').value,note:$('fr_nt').value.trim(),by:ME().name||''});
  mut(()=>{if(edit)P.rsc[P.rsc.findIndex(x=>x.id===e.id)]=o;else P.rsc.push(o)})},edit?()=>mut(()=>{P.rsc=P.rsc.filter(x=>x.id!==e.id)}):null)}

function aprCell(e,kind){if(e.st==='p')return'<span class="bdg w">Pending</span>'+(canApprove()&&!LOCKED()?'<button class="btn sm a" data-a="'+kind+'ok" data-id="'+e.id+'">Approve</button><button class="btn sm d" data-a="'+kind+'rej" data-id="'+e.id+'">Reject</button>':'');if(e.st==='r')return'<span class="bdg r">Rejected</span>'+(e.apby?'<br><small class="mut">'+esc(e.apby)+'</small>':'');return e.apby?'<span class="bdg g">Approved</span><br><small class="mut">'+esc(e.apby)+'</small>':'<span class="bdg g">OK</span>'}
const setSt=(arr,id,st)=>{if(!canApprove()||LOCKED())return;const e=arr.find(x=>x.id===id);if(!e)return;mut(()=>{e.st=st;e.apby=ME().name||'';e.apts=Date.now()})};

H.xok=d=>{setSt(P.xtr,d.id,'a');if(ui.calDay)H.calday({d:ui.calDay})};H.xrej=d=>{setSt(P.xtr,d.id,'r');if(ui.calDay)H.calday({d:ui.calDay})};
H.xall=()=>{if(!canApprove())return;mut(()=>P.xtr.forEach(e=>{if(e.st==='p'){e.st='a';e.apby=ME().name||'';e.apts=Date.now()}}))};
H.xdel=d=>{const e=P.xtr.find(x=>x.id===d.id);if(!e||!(isPlanner()||(canTrack('xtr',e.sec)&&e.uid===ME().id))){toast('Not allowed');return}if(!confirm('Delete this entry?'))return;mut(()=>{P.xtr=P.xtr.filter(x=>x.id!==d.id)});if(ui.calDay)H.calday({d:ui.calDay})};

/* ================= calendar: planned and actual ================= */
ui.cal={y:0,m:-1,sec:''};ui.calDay=0;
const IC={ok:'✅',miss:'❌',add:'➕'};
function dayInfo(d,sec){const o={ok:[],miss:[],add:[],fut:[],ext:[],extP:[],heads:0,spend:0};
 ORDER.forEach(id=>{const c=C[id];if(!c.leaf||(sec&&c.t.sec!==sec))return;
  const end=c.as!=null?(c.ae!=null?c.ae:(c.pct>0?TD:null)):null;
  if(c.ms){const pl=d===c.s;if(d>TD){if(pl)o.fut.push(c);return}const done=c.ae!=null&&c.ae<=d;if(pl){(done?o.ok:o.miss).push(c)}else if(c.ae===d)o.add.push(c);return}
  const pl=d>=c.s&&d<=c.e;if(d>TD){if(pl)o.fut.push(c);return}
  const wk=c.as!=null&&end!=null&&d>=c.as&&d<=end;
  if(pl&&wk)o.ok.push(c);else if(pl){if(c.ae!=null&&d>c.ae)o.ok.push(c);else o.miss.push(c)}else if(wk)o.add.push(c)});
 P.xtr.forEach(e=>{if(pd(e.date)!==d||(sec&&e.sec!==sec)||hiddenFor('xtr',e.sec))return;if(e.st==='p')o.extP.push(e);else if(e.st!=='r')o.ext.push(e)});
 P.man.forEach(e=>{if(e.k==='a'&&pd(e.date)===d&&okE(e)&&!hiddenFor('man',e.sec)&&(!sec||e.sec===sec))o.heads+=e.n});
 P.bud.forEach(e=>{if(e.k==='e'&&pd(e.date)===d&&!hiddenFor('bud',e.sec)&&(!sec||e.sec===sec))o.spend+=e.amt});
 o.n1=o.ok.length;o.n2=o.miss.length;o.n3=o.add.length+o.ext.length+o.extP.length;return o}
function vCal(){const now=new Date(TD*DAY);if(ui.cal.m<0){ui.cal.y=now.getUTCFullYear();ui.cal.m=now.getUTCMonth()}const y=ui.cal.y,m=ui.cal.m,first=Date.UTC(y,m,1)/DAY,dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(),lead=(new Date(first*DAY).getUTCDay()+6)%7,sec=ui.cal.sec;
 let cells='';for(let i=0;i<lead;i++)cells+='<div class="cd off"></div>';
 for(let k=1;k<=dim;k++){const d=first+k-1,x=dayInfo(d,sec),fut=d>TD,bg=x.n2?'rgba(239,68,68,.10)':x.n1?'rgba(16,185,129,.13)':'';
  const names=[].concat(x.miss.map(c=>['m',c.t.name]),x.add.map(c=>['a',c.t.name]),x.ext.concat(x.extP).map(e=>['a',e.desc]),x.ok.map(c=>['o',c.t.name]));
  const bd=(cl,n)=>n?'<i class="nb '+cl+'">'+n+'</i>':'';
  cells+='<div class="cd'+(d===TD?' td':'')+(fut?' fut':'')+'" data-a="calday" data-d="'+d+'" style="'+(bg?'background:'+bg:'')+'"><div class="ch"><b>'+k+'</b></div><div class="cbd">'+(fut?bd('p',x.fut.length):bd('g',x.n1)+bd('r',x.n2)+bd('b',x.n3))+'</div>'+
  (fut?x.fut.slice(0,2).map(c=>'<span class="cc p">'+esc(c.t.name)+'</span>').join(''):names.slice(0,2).map(n=>'<span class="cc '+n[0]+'">'+esc(n[1])+'</span>').join('')+(names.length>2?'<span class="cn">+'+(names.length-2)+' more</span>':''))+'</div>'}
 const pendX=P.xtr.filter(e=>e.st==='p').length;
 $('v').innerHTML='<div class="bar2"><button class="btn" data-a="calnav" data-v="-1" aria-label="Previous month">&#8249;</button><b style="min-width:130px;text-align:center;font-size:16px;color:var(--pri)">'+MON[m]+' '+y+'</b><button class="btn" data-a="calnav" data-v="1" aria-label="Next month">&#8250;</button><button class="btn" data-a="calnav" data-v="0">Today</button><span class="flt"><select onchange="ui.cal.sec=this.value;vCal()" aria-label="Section"><option value="">All sections</option>'+P.secs.map(s=>'<option value="'+s.id+'"'+(sec===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></span></div>'+
 '<div class="leg" style="padding:0 2px 8px"><span><i class="nb g">3</i> planned and done</span><span><i class="nb r">1</i> planned, not done</span><span><i class="nb b">2</i> extra work (not in plan)</span><span><i class="nb p">4</i> planned, coming up</span></div>'+
 (pendX?'<div class="ban"><b>'+pendX+' extra-work entr'+(pendX>1?'ies are':'y is')+' waiting for manager approval.</b>'+(canApprove()?' <button class="btn a sm" data-a="xall">Approve all</button>':'')+'</div>':'')+
 '<div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>'<div class="cw">'+w+'</div>').join('')+cells+'</div><div class="mut sm" style="margin-top:6px">Tap a day for the report and to share it.'+(trackSecs('xtr').length?' Engineers can add extra work done from the day report.':'')+'</div>'}
H.calnav=d=>{if(+d.v===0){ui.cal.m=-1}else{ui.cal.m+=+d.v;if(ui.cal.m<0){ui.cal.m=11;ui.cal.y--}if(ui.cal.m>11){ui.cal.m=0;ui.cal.y++}}vCal()};
const lineT=c=>c.wbs+' '+c.t.name+' ('+secOf(c.t.sec).name+(c.t.owner?', '+c.t.owner:'')+')';
function dayText(day,sec){const x=dayInfo(day,sec),L=[];L.push('*'+P.name+'* - Daily report');L.push(fmtD(day)+(sec?' | '+secOf(sec).name:' | All sections'));
 if(day>TD){L.push('');L.push('Planned for this day ('+x.fut.length+'):');x.fut.forEach(c=>L.push(' • '+lineT(c)))}
 else{L.push(IC.ok+' '+x.n1+'   '+IC.miss+' '+x.n2+'   '+IC.add+' '+x.n3);
  if(x.ok.length){L.push('');L.push(IC.ok+' Done as planned:');x.ok.forEach(c=>L.push(' • '+lineT(c)+' - '+Math.round(c.pct)+'%'))}
  if(x.miss.length){L.push('');L.push(IC.miss+' Planned but not done:');x.miss.forEach(c=>L.push(' • '+lineT(c)+' - '+Math.round(c.pct)+'% done'))}
  if(x.add.length||x.ext.length||x.extP.length){L.push('');L.push(IC.add+' Additional work:');x.add.forEach(c=>L.push(' • '+lineT(c)+' (outside planned dates)'));x.ext.concat(x.extP).forEach(e=>L.push(' • '+e.desc+' ('+secOf(e.sec).name+(e.by?', '+e.by:'')+')'+(e.st==='p'?' [awaiting approval]':'')))}
  L.push('');L.push('Manpower on site: '+x.heads);if(x.spend)L.push('Spent: '+money(x.spend))}
 return L.join('\n')}
function calMonthText(y,m,sec){const first=Date.UTC(y,m,1)/DAY,dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();let a=0,b=0,c3=0;const miss=[],L=[];
 for(let k=0;k<dim;k++){const d=first+k;if(d>TD)break;const x=dayInfo(d,sec);a+=x.n1;b+=x.n2;c3+=x.n3;if(x.n2)miss.push(fmtD(d)+': '+x.miss.map(c=>c.wbs+' '+c.t.name).join('; '))}
 L.push('*'+P.name+'* - '+MON[m]+' '+y+' calendar report'+(sec?' | '+secOf(sec).name:''));L.push(IC.ok+' '+a+' task-days done as planned');L.push(IC.miss+' '+b+' task-days planned but not done');L.push(IC.add+' '+c3+' additional work items');
 if(miss.length){L.push('');L.push('Not done as planned:');miss.slice(0,25).forEach(t=>L.push(' • '+t));if(miss.length>25)L.push(' ... and '+(miss.length-25)+' more days')}return L.join('\n')}
H.calday=d=>{const day=+d.d;ui.calDay=day;const x=dayInfo(day,ui.cal.sec),fut=day>TD;
 const row=(c,ic)=>'<div class="cmgr" style="cursor:pointer" data-a="cm" data-id="'+c.t.id+'"><span style="font-size:16px">'+ic+'</span><span style="flex:1"><b>'+esc(c.wbs+' '+c.t.name)+'</b><br><small class="mut">'+secDot(c.t.sec)+' &middot; '+esc(c.t.owner)+'</small></span><span class="chip '+c.status+'">'+Math.round(c.pct)+'%</span></div>';
 const exRow=e=>'<div class="cmgr" style="flex-wrap:wrap"><span style="font-size:16px">'+IC.add+'</span><span style="flex:1;min-width:160px"><b>'+esc(e.desc)+'</b><br><small class="mut">'+secDot(e.sec)+(e.by?' &middot; '+esc(e.by):'')+(e.note?' &middot; '+esc(e.note):'')+(e.n?' &middot; '+e.n+' people':'')+'</small></span><span>'+aprCell(e,'x')+'</span>'+((isPlanner()||(canTrack('xtr',e.sec)&&e.uid===ME().id))&&!LOCKED()?'<button class="btn sm d" data-a="xdel" data-id="'+e.id+'">&times;</button>':'')+'</div>';
 const H3=(t)=>'<h3 style="margin:12px 0 6px;color:var(--pri);font-size:14px">'+t+'</h3>';
 const mans=P.man.filter(e=>e.k==='a'&&pd(e.date)===day&&okE(e)&&!hiddenFor('man',e.sec)&&(!ui.cal.sec||e.sec===ui.cal.sec)),exps=P.bud.filter(e=>e.k==='e'&&pd(e.date)===day&&!hiddenFor('bud',e.sec)&&(!ui.cal.sec||e.sec===ui.cal.sec));
 let b='<div class="bar2" style="margin-bottom:4px"><span class="chip Completed">'+IC.ok+' '+x.n1+'</span><span class="chip Delayed">'+IC.miss+' '+x.n2+'</span><span class="chip On\\ track">'+IC.add+' '+x.n3+'</span>'+(fut?'<span class="chip Not\\ started">Future day</span>':'')+'</div>';
 if(fut)b+=H3('Planned for this day ('+x.fut.length+')')+(x.fut.map(c=>row(c,'&#128197;')).join('')||'<div class="mut sm">Nothing planned.</div>');
 else{b+=H3(IC.ok+' Done as planned ('+x.n1+')')+(x.ok.map(c=>row(c,IC.ok)).join('')||'<div class="mut sm">None.</div>')+H3(IC.miss+' Planned but not done ('+x.n2+')')+(x.miss.map(c=>row(c,IC.miss)).join('')||'<div class="mut sm">None. Everything planned was done.</div>')+
  H3(IC.add+' Additional work ('+x.n3+')')+(x.add.map(c=>row(c,IC.add)).join('')+x.ext.concat(x.extP).map(exRow).join('')||'<div class="mut sm">No additional work recorded.</div>')+
  H3('Manpower on site ('+x.heads+')')+(mans.map(e=>'<div class="cmgr"><span style="flex:1">'+secDot(e.sec)+' &middot; '+esc(e.trade)+'</span><b>'+e.n+'</b></div>').join('')||'<div class="mut sm">No manpower logged.</div>')+
  H3('Expenses ('+moneyS(x.spend)+')')+(exps.map(e=>'<div class="cmgr"><span style="flex:1">'+secDot(e.sec)+' &middot; '+esc(e.desc)+'</span><b>'+money(e.amt)+'</b></div>').join('')||'<div class="mut sm">No expenses recorded.</div>')}
 $('sheet').innerHTML='<div class="sh-h"><h2>Report: '+fmtD(day)+'</h2><button class="x" data-a="closesh">&times;</button></div><div class="sh-b">'+b+'</div><div class="sh-f">'+(!fut&&trackSecs('xtr').length&&!LOCKED()?'<button class="btn a" data-a="xadd" data-d="'+day+'">&#10133; Add extra work</button>':'')+'<button class="btn p" data-a="shday" data-d="'+day+'">Share report</button><span class="sp"></span><button class="btn" data-a="closesh">Close</button></div>';SH=null;$('ovl').classList.add('on')};
H.shday=d=>openShare('Report '+fmtD(+d.d),dayText(+d.d,ui.cal.sec));
H.xadd=d=>xtrForm(+d.d);
function xtrForm(day){const sc=trackSecs('xtr');if(!sc.length){toast('Only engineers can add extra work');return}const e={id:uid(),sec:ui.cal.sec&&sc.indexOf(ui.cal.sec)>=0?ui.cal.sec:sc[0],date:dn(day)};
 openForm('Add extra work done','<div class="fg">'+fl('fx_sec','Section',fsel('fx_sec',secOptsK('xtr',e.sec),e.sec))+fl('fx_d','Date',finp('fx_d','date',e.date,'max="'+dn(TD)+'"'))+fl('fx_desc','What extra work was done?',finp('fx_desc','text','','placeholder="e.g. Extra shell patch welding, emergency cable repair"'),1)+fl('fx_t','Related task (optional)',fsel('fx_t',taskOpts(''),''),1)+fl('fx_n','People involved (optional)',finp('fx_n','number','','min="0" step="1"'))+fl('fx_nt','Note',finp('fx_nt','text',''))+'</div><div class="note" style="margin-top:8px">'+(isPlanner()||isMgr()?'It will be added directly.':'It will be marked <b>awaiting approval</b> until the manager approves it.')+'</div>',()=>{
  const sec=$('fx_sec').value,ds=$('fx_d').value,desc=$('fx_desc').value.trim();if(!desc){toast('Describe the work');return false}if(pd(ds)==null||pd(ds)>TD){toast('Choose a date up to the status date');return false}if(!canTrack('xtr',sec)){toast('Not your section');return false}
  const o={id:e.id,sec,date:ds,desc,task:$('fx_t').value,n:Math.max(0,Math.round(+$('fx_n').value||0)),note:$('fx_nt').value.trim(),by:ME().name||'',uid:ME().id,st:(isPlanner()||isMgr())?'a':'p'};if(o.st==='a')o.apby=ME().name||'';
  mut(()=>P.xtr.push(o));ui.calDay=pd(ds);setTimeout(()=>H.calday({d:pd(ds)}),0);return false})}

<script>
/* ================= share (every tab) ================= */
function openShare(title,text){$('sheet').innerHTML='<div class="sh-h"><h2>Share: '+esc(title)+'</h2><button class="x" data-a="closesh" aria-label="Close">&times;</button></div><div class="sh-b"><div class="mut sm" style="margin-bottom:6px">You can edit the text before sending.</div><textarea id="sh_t" rows="14" style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12.5px">'+esc(text)+'</textarea></div><div class="sh-f">'+(navigator.share?'<button class="btn p" data-a="shnat">Share...</button>':'')+'<button class="btn a" data-a="shwa">WhatsApp</button><button class="btn" data-a="shmail">Email</button><button class="btn" data-a="shcopy">Copy</button><span class="sp"></span><button class="btn" data-a="closesh">Close</button></div>';SH=null;openShare.title=title;$('ovl').classList.add('on')}
const shT=()=>$('sh_t').value;
H.shnat=()=>{navigator.share({title:P.name+' - '+openShare.title,text:shT()}).catch(()=>{})};
H.shwa=()=>window.open('https://wa.me/?text='+encodeURIComponent(shT()),'_blank');
H.shmail=()=>{let t=shT();if(t.length>1700)t=t.slice(0,1700)+'\n... (text shortened, use Copy for the full report)';location.href='mailto:?subject='+encodeURIComponent('['+P.name+'] '+openShare.title)+'&body='+encodeURIComponent(t)};
H.shcopy=()=>{const t=shT();try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>{$('sh_t').select();document.execCommand('copy');toast('Copied')})}catch(e){$('sh_t').select();document.execCommand('copy');toast('Copied')}};

 mut(()=>{const to=P.secs.find(s=>s.id!==d.sid).id;P.secs=P.secs.filter(s=>s.id!==d.sid);P.tasks.forEach(t=>{if(t.sec===d.sid)t.sec=to});['man','bud','rsc'].forEach(k=>P[k].forEach(e=>{if(e.sec===d.sid)e.sec=to}));delete P.hide[d.sid];(P.members||[]).forEach(m=>{m.secs=(m.secs||[]).filter(x=>x!==d.sid)})})};

/* ================= team (planner) ================= */
const ROLE_INFO={planner:'Full access to everything. Assigns roles and sections, hides data, manages the plan.',manager:'Views the whole plan. Adds and edits tasks, plans manpower and approves manpower and extra work for the sections assigned (none assigned = all sections).',engineer:'Plans and edits tasks, plans manpower, budget, resources of own sections. Adds extra work (manager approves).',supervisor:'Sees only Manpower of own section and logs actual manpower only (cannot plan). Entries need manager approval.'};
const normRole=r=>r==='contributor'?'engineer':r==='contractor'?'supervisor':(r||'supervisor');
function vTeam(){
 if(MODE!=='cloud'){$('v').innerHTML='<div class="card"><h3>Team and access</h3><p class="sm">In the signed-in version you share a <b>project code</b>. People join with it, you approve them and choose their <b>role</b> and sections. The planner assigns the role only at approval time.</p><p class="sm">In this demo use <b>View as</b> at the top to see the app as each role.</p><table class="t"><tr><th>Role</th><th>What they can do</th></tr>'+Object.keys(ROLE_INFO).map(r=>'<tr><td><b>'+ROLES[r]+'</b></td><td>'+ROLE_INFO[r]+'</td></tr>').join('')+'</table></div><div class="card" style="margin-top:10px"><h3>Sections</h3><table class="t"><tr><th>Section</th><th>Owner</th><th>Email</th></tr>'+P.secs.map(s=>'<tr><td>'+secDot(s.id)+'</td><td>'+esc(s.owner)+'</td><td>'+esc(s.email)+'</td></tr>').join('')+'</table></div>';return}
 const ms=P.members||[],pend=ms.filter(m=>m.status==='pending'),act=ms.filter(m=>m.status==='active');
 const code=P.code||'';
 const secChecks=(m,off)=>P.secs.map(s=>'<label style="display:inline-flex;gap:4px;align-items:center;margin:0 10px 4px 0;font-size:12.5px"><input type="checkbox" data-mid="'+m.id+'" data-sid="'+s.id+'" '+((m.secs||[]).indexOf(s.id)>=0?'checked':'')+(off?' disabled':'')+' onchange="H.msec(this)"> '+esc(s.name)+'</label>').join('');
 const roleSel=(m,def)=>'<select id="rl_'+m.id+'" data-mid="'+m.id+'" onchange="H.mrole(this)">'+(m.status==='pending'?'<option value=""'+(m._r?'':' selected')+'>Select role...</option>':'')+Object.keys(ROLES).map(r=>'<option value="'+r+'"'+((m.status==='pending'?m._r===r:normRole(m.role||def)===r)?' selected':'')+'>'+ROLES[r]+'</option>').join('')+'</select>';
 $('v').innerHTML='<div class="card" style="margin-bottom:10px"><h3>Invite people</h3><p class="sm">Share this project code. The person signs in, chooses <b>Join with code</b> and enters it. They see no role. You choose the role and sections when you approve them, and their screen follows that role.</p><div class="bar2"><span style="font-size:22px;font-weight:800;letter-spacing:2px;color:var(--pri)">'+esc(code)+'</span><button class="btn" data-a="cpcode">Copy code</button><button class="btn" data-a="wacode">Share on WhatsApp</button><button class="btn" data-a="mailcode">Share by email</button></div></div>'+
 '<div class="card" style="margin-bottom:10px"><h3>Roles</h3><div class="tw"><table class="t"><tr><th>Role</th><th>What they can do</th></tr>'+Object.keys(ROLE_INFO).map(r=>'<tr><td><b>'+ROLES[r]+'</b></td><td>'+ROLE_INFO[r]+'</td></tr>').join('')+'</table></div></div>'+
 (pend.length?'<div class="card" style="margin-bottom:10px;border-color:#f1cf94"><h3>Waiting for your approval ('+pend.length+')</h3>'+pend.map(m=>'<div class="cmgr" style="flex-wrap:wrap"><span style="flex:1;min-width:170px"><b>'+esc(m.name||'(no name)')+'</b><br><small class="mut">'+esc(m.email)+'</small></span>'+roleSel(m,'supervisor')+'<div style="flex:2;min-width:220px">'+secChecks(m,false)+'</div><button class="btn a sm" data-a="mok" data-mid="'+m.id+'">Approve</button><button class="btn d sm" data-a="mrej" data-mid="'+m.id+'">Reject</button></div>').join('')+'</div>':'')+
 '<div class="card"><h3>Team ('+act.length+')</h3>'+act.map(m=>{const r=normRole(m.role),me=m.id===CLOUD.user.uid;return'<div class="cmgr" style="flex-wrap:wrap"><span style="flex:1;min-width:170px"><b>'+esc(m.name||'(no name)')+'</b>'+(me?' <span class="bdg">you</span>':'')+'<br><small class="mut">'+esc(m.email)+'</small></span><select data-mid="'+m.id+'" onchange="H.mrole(this)" '+(me?'disabled':'')+'>'+Object.keys(ROLES).map(x=>'<option value="'+x+'"'+(r===x?' selected':'')+'>'+ROLES[x]+'</option>').join('')+'</select><div style="flex:2;min-width:220px">'+(r==='planner'?'<span class="mut sm">Full access to all sections</span>':(r==='manager'?'<div class="mut sm">Manpower of the ticked sections only. Tick none to see all sections.</div>':'')+secChecks(m,false))+'</div>'+(r==='engineer'||r==='supervisor'||r==='contractor'?'<label style="font-size:12.5px;white-space:nowrap"><input type="checkbox" '+(m.apr?'checked':'')+' data-mid="'+m.id+'" onchange="H.mapr(this)"> can approve</label>':'')+(me?'':'<button class="btn d sm" data-a="mdelm" data-mid="'+m.id+'">Remove</button>')+'</div>'}).join('')+'</div>'}
H.cpcode=()=>{try{navigator.clipboard.writeText(P.code);toast('Code copied')}catch(e){toast(P.code)}};
const inviteText=()=>'Join the project "'+P.name+'" on Project Planner Pro.\n1) Open '+location.href.split('#')[0]+'\n2) Sign in, choose "Join with code"\n3) Enter code: '+P.code;
H.wacode=()=>window.open('https://wa.me/?text='+encodeURIComponent(inviteText()),'_blank');
H.mailcode=()=>{location.href='mailto:?subject='+encodeURIComponent('Join project: '+P.name)+'&body='+encodeURIComponent(inviteText())};
H.msec=el=>{const m=(P.members||[]).find(x=>x.id===el.dataset.mid);if(!m)return;const set=new Set(m.secs||[]);el.checked?set.add(el.dataset.sid):set.delete(el.dataset.sid);m.secs=[...set];if(m.status==='active')cloudSetMember(m.id,{secs:m.secs})};
H.mok=d=>{const m=P.members.find(x=>x.id===d.mid),r=$('rl_'+d.mid)?$('rl_'+d.mid).value:'';if(!m)return;if(!r){toast('Select a role first');return}const secs=r==='planner'?[]:(m.secs||[]);cloudSetMember(m.id,{status:'active',role:r,secs}).then(()=>toast('Approved as '+ROLES[r]))};
H.mrej=d=>{if(confirm('Reject this request?'))cloudDelMember(d.mid)};
H.mdelm=d=>{if(confirm('Remove this person from the project?'))cloudDelMember(d.mid)};
H.mrole=el=>{const m=P.members.find(x=>x.id===el.dataset.mid);if(!m)return;const r=el.value;if(m.status==='pending'){m._r=r;return}cloudSetMember(m.id,{role:r,secs:r==='planner'?[]:(m.secs||[])})};

function tabsFor(){if(isRestr())return[['man','Manpower']];const t=[['plan','Plan & Gantt'],['cal','Calendar'],['dash','Dashboard'],['man','Manpower'],['bud','Budget'],['rsc','Resources'],['mat','Materials']];if(isPlanner()||isMgr())t.push(['mail','Email']);if(isPlanner())t.push(['team','Team']);if(MODE==='cloud'&&CLOUD.isOwner)t.push(['admin','Admin']);t.push(['set','Settings']);return t}
const VIEWS={plan:()=>vPlan(),cal:()=>vCal(),dash:()=>vDash(),man:()=>vMan(),bud:()=>vBud(),rsc:()=>vRsc(),mat:()=>vMat(),mail:()=>vMail(),team:()=>vTeam(),set:()=>vSet()};
function buildTabs(){const t=tabsFor();if(!t.some(x=>x[0]===ui.tab))ui.tab=t[0][0];$('tabs').innerHTML=t.map(x=>'<button data-a="tab" data-t="'+x[0]+'" class="'+(x[0]===ui.tab?'on':'')+'">'+x[1]+'</button>').join('')}
function banners(){let h='';const pi=planInfo(P);if(MODE==='cloud'&&CLOUD.notice)h+='<div class="ban"><b>'+esc(CLOUD.notice)+'</b></div>';
 if(MODE==='local'&&isRestr())h+='<div class="ban"><b>'+ROLES[roleOf()]+' access (demo).</b> Only Manpower is visible. Entries you add are pending until a Manager approves them (switch View as: Manager).</div>';if(MODE==='local')h+='<div class="ban"><b>Demo mode.</b> Data stays only in this browser. Use <b>View as</b> to see the app as the planner or as a contributor of any section.'+(window.OWH_FIREBASE?' <a href="#" data-a="gologin">Sign in to use it with your team</a>':'')+'</div>';
 if(MODE==='cloud'){if(!pi.active)h+='<div class="ban bad"><b>This project plan has ended ('+esc(pi.label)+').</b> The project is read-only. '+(isPlanner()?'Renew with a plan below or contact the app owner. <button class="btn a sm" data-a="plans">See plans and prices</button>':'Ask your planner to renew it.')+(CLOUD.contact?' Contact: '+esc(CLOUD.contact):'')+'</div>';
  else if(pi.left!=null&&pi.left<=7&&isPlanner())h+='<div class="ban">'+esc(pi.label)+'. Contact the app owner to continue after that.'+(CLOUD.contact?' Contact: '+esc(CLOUD.contact):'')+'</div>';
  if(ME().status!=='active'&&ME().status!=='owner')h+='<div class="ban">Your access is not active.</div>';
  else if((isEng()||isRestr())&&!(ME().secs||[]).length)h+='<div class="ban">The planner has not assigned a section to you yet. You cannot edit anything until then.</div>';else if(isRestr())h+='<div class="ban"><b>'+ROLES[roleOf()]+' access.</b> You can log manpower for your section. A manager approves it before it is counted.</div>'}
 $('bn').innerHTML=h}
function fillProj(){const s=$('pj');if(MODE==='cloud'){s.innerHTML='<option>'+esc(P.name)+'</option>';s.disabled=true}else{s.disabled=false;s.innerHTML=Object.values(DB.projects).map(p=>'<option value="'+p.id+'"'+(p.id===P.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'<option value="__new">+ New project</option>'}
 const v=$('vas');if(MODE==='local'){v.style.display='';v.innerHTML='<option value="planner">View as: Planner</option><option value="mgr">View as: Manager</option>'+['sec:Engineer','mg:Manager','sup:Supervisor'].map(g=>{const a=g.split(':');return'<optgroup label="'+a[1]+'s">'+P.secs.map(x=>'<option value="'+a[0]+':'+x.id+'">View as: '+a[1]+' - '+esc(x.name)+'</option>').join('')+'</optgroup>'}).join('');v.value=ui.demoRole}else v.style.display='none';
 $('bundo').style.display=MODE==='cloud'||isRestr()?'none':'';$('bexp').style.display=isRestr()?'none':'';$('bshare').style.display='';$('bacct').style.display=MODE==='cloud'?'':'none'}
function fillPeople(){const set={};P.secs.forEach(s=>s.owner&&(set[s.owner]=1));P.tasks.forEach(t=>t.owner&&(set[t.owner]=1));(P.members||[]).forEach(m=>m.name&&(set[m.name]=1));$('people').innerHTML=Object.keys(set).map(o=>'<option value="'+esc(o)+'">').join('')}
function render(){if(!P)return;buildTabs();fillProj();fillPeople();banners();VIEWS[ui.tab]();if(SH)refreshSheet()}
H.tab=d=>{ui.tab=d.t;render();scrollTo(0,0)};
$('pj').onchange=e=>{if(MODE!=='local')return;if(e.target.value==='__new'){fillProj();H.newp();return}DB.cur=e.target.value;P=DB.projects[DB.cur];UNDO=[];loadPref();persist();compute();render()};
$('vas').onchange=e=>{ui.demoRole=e.target.value;ui.fsec='';compute();render();toast('Viewing as: '+(ME().role==='planner'?'Planner':ROLES[roleOf()]||'user'))};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=H[el.dataset.a];if(f)f(el.dataset,el,e)});
H.gologin=(d,el,e)=>{e.preventDefault();try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}boot()};

function startLocal(){MODE='local';chrome('app');load();compute();loadPref();$('lg').textContent='Project Planner Pro';render()}

<script>
/* ================= CLOUD: sign-in, projects, team sync (Firebase) ================= */
const CLOUD={ready:false,user:null,auth:null,fs:null,pid:null,unsubs:[],D:null,base:{},isOwner:false,contact:'',demoOn:true,projs:{}};
const loadJs=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)});
async function cloudInit(){if(CLOUD.ready)return;const b='https://www.gstatic.com/firebasejs/10.12.2/';

const cerrMsg=e=>{const c=(e&&e.code)||'';return({'auth/invalid-email':'That email address looks wrong.','auth/user-not-found':'No account with this email. Choose "Create account".','auth/wrong-password':'Wrong password.','auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'This email already has an account. Choose "Sign in".','auth/weak-password':'Use a password of at least 6 characters.','auth/popup-closed-by-user':'Sign-in window was closed.','auth/network-request-failed':'No internet connection.','auth/too-many-requests':'Too many attempts. Try again later.','permission-denied':'Not allowed (permission denied).'})[c]||('Something went wrong'+(c?' ('+c+')':'')+'.')};
function chrome(mode){const home=mode!=='app';$('tabs').innerHTML='';$('bn').innerHTML='';$('pj').style.display=home?'none':'';$('vas').style.display='none';$('bundo').style.display='none';$('bexp').style.display=home?'none':'';$('bshare').style.display=home?'none':'';$('bacct').style.display=(CLOUD.user&&(home||MODE==='cloud'))?'':'none';
 if(home){$('lg').textContent='Project Planner Pro';P=null}}

/* ---------- boot ---------- */
function boot(){if(!window.OWH_FIREBASE||/[#&]demo\b/.test(location.hash)){startLocal();return}
 chrome('home');$('v').innerHTML='<div class="land"><div class="logo2">&#9644;</div><h1>Project Planner Pro</h1><p>Loading...</p></div>';
 cloudInit().then(()=>{CLOUD.fs.doc('pp_config/public').get().then(s=>{if(s.exists){const d=s.data();CLOUD.demoOn=d.demo!==false;CLOUD.contact=d.contact||'';CLOUD.notice=d.notice||''}}).catch(()=>{});
  CLOUD.auth.onAuthStateChanged(u=>{if(u){CLOUD.user={uid:u.uid,email:u.email||'',name:nameOf(u),verified:!!u.emailVerified};CLOUD.isOwner=CLOUD.user.email.toLowerCase()===OWNER_EMAIL&&CLOUD.user.verified;if(MODE==='cloud'&&CLOUD.pid)return;showChooser()}else{CLOUD.user=null;CLOUD.isOwner=false;detach();MODE='local';showLanding()}})}).catch(e=>{console.warn(e);startLocal()})}
function detach(){CLOUD.unsubs.forEach(f=>{try{f()}catch(e){}});CLOUD.unsubs=[];trkSubs={};CLOUD.pid=null;CLOUD.D=null;CLOUD.base={}}

/* ---------- landing / sign-in ---------- */
let cmode='in';
function showLanding(){detach();chrome('home');MODE='local';
 const T=(k,l)=>'<button class="chip2'+(cmode===k?' on':'')+'" data-a="cmode" data-v="'+k+'">'+l+'</button>';
 let f='';

 rows.sort((a,b)=>(b.createdMs||0)-(a.createdMs||0));CLOUD.adminRows=rows;adminDraw()}

 const cnt={all:rows.length,trial:0,paid:0,permanent:0,ended:0,suspended:0,soon:0};rows.forEach(r=>{const k=st(r);cnt[k]++;if((k==='trial'||k==='paid')&&r.expiresMs>now&&r.expiresMs<now+7*864e5)cnt.soon++});
 const list=rows.filter(r=>(f==='all'||(f==='soon'?((st(r)==='trial'||st(r)==='paid')&&r.expiresMs>now&&r.expiresMs<now+7*864e5):st(r)===f))&&(!q||((r.name||'')+' '+(r.ownerEmail||'')+' '+(r.code||'')+' '+(r.company||'')).toLowerCase().indexOf(q)>=0));
 const kp=(l,v,c)=>'<div class="card kpi '+(c||'')+'"><small>'+l+'</small><b>'+v+'</b></div>';

 $('v').innerHTML='<div class="'+(inTab?'':'land ')+'adm" style="max-width:1150px;margin:'+(inTab?'0 auto':'4vh auto')+';padding:0 12px;text-align:left"><div class="bar2">'+(inTab?'':'<button class="btn" data-a="mine">&larr; Back</button>')+'<h2 style="margin:0;color:var(--pri)">Admin</h2><span class="mut sm">Plants (projects), subscriptions, demo, offers and prices</span></div>'+
 (CLOUD.adminErr?'<div class="card" style="border-left:4px solid #dc2626;margin-top:10px"><b>Could not read all projects ('+esc(CLOUD.adminErr)+')</b><p class="sm mut" style="margin:4px 0 0">Your Firebase rules do not let the owner read every project yet. Publish the newest Firestore rules (the pp_ part), then press Refresh. Meanwhile you can still create a project below and manage the ones that are listed.</p></div>':'')+'<div class="bar2" style="margin-top:10px"><button class="btn p" data-a="newcloud">+ New project</button><button class="btn" data-a="arefresh">Refresh</button></div>'+'<div class="grid g4" style="margin:10px 0">'+kp('Projects',rows.length)+kp('Paid and permanent',cnt.paid+cnt.permanent,'ok')+kp('On free trial',cnt.trial)+kp('Ending in 7 days',cnt.soon,cnt.soon?'warn':'')+'</div>'+
 '<div class="grid g2"><div class="card"><h3>Demo and public notice</h3><label style="display:block;margin:4px 0"><input type="checkbox" id="od" '+(CLOUD.demoOn?'checked':'')+' onchange="H.odemo()"> Show the demo on the start page</label><div class="bar2" style="margin-top:8px"><input type="text" id="oc" placeholder="Contact shown to users when a plan ends" value="'+esc(CLOUD.contact)+'" style="flex:1;min-width:200px"><button class="btn" data-a="ocontact">Save</button></div><div class="bar2" style="margin-top:8px"><input type="text" id="on" maxlength="200" placeholder="Notice shown to every user, for example: 20% off till Diwali" value="'+esc(CLOUD.notice||'')+'" style="flex:1;min-width:200px"><button class="btn" data-a="onotice">Save notice</button></div></div>'+
 '<div class="card"><h3>Prices and offers</h3><p class="sm mut" style="margin:0 0 8px">Set the Project Planner prices for each plan and currency, run a percentage discount with a name and last date, and add UPI or PayPal details. Changes appear on the marketplace and inside Project Planner at once. PM Tracker has its own Admin.</p><button class="btn p" data-a="priceedit">Prices and discounts</button> <button class="btn" data-a="aexport">Export projects (CSV)</button></div></div>'+
 '<div class="bar2" style="margin-top:12px"><input type="search" id="aq" placeholder="Search project, planner email or code" value="'+esc(ui.aq||'')+'" style="flex:1;min-width:200px">'+fb('all','All')+fb('trial','Trial')+fb('paid','Paid')+fb('permanent','Permanent')+fb('soon','Ending soon')+fb('ended','Ended')+fb('suspended','Suspended')+'</div>'+
 '<div class="card" style="padding:0;margin-top:8px"><div class="tw"><table class="t"><tr><th>Project</th><th>Planner</th><th>Plan</th><th>Ends</th><th>Code</th><th>Created</th><th>Actions</th></tr>'+(list.map(r=>{const pi=planInfo(r),k=st(r);return'<tr><td><b>'+esc(r.name)+'</b><br><small class="mut">'+esc(r.company||'')+'</small></td><td>'+esc(r.ownerEmail||'')+'</td><td><span class="bdg '+(pi.active?'g':'r')+'">'+esc(pi.label)+'</span></td><td>'+(r.plan==='permanent'?'Never':r.expiresMs?fmtD(Math.floor(r.expiresMs/DAY)):'')+'</td><td>'+esc(r.code||'')+'</td><td>'+(r.createdMs?fmtD(Math.floor(r.createdMs/DAY)):'')+'</td><td style="white-space:nowrap"><button class="btn sm" data-a="oplan" data-pid="'+r.id+'" data-v="m30">+30 days</button> <button class="btn sm" data-a="oplan" data-pid="'+r.id+'" data-v="m90">+90 days</button> <button class="btn sm" data-a="oplan" data-pid="'+r.id+'" data-v="m365">+1 year</button> <button class="btn sm" data-a="oplan" data-pid="'+r.id+'" data-v="perm">Permanent</button> <button class="btn sm" data-a="oplan" data-pid="'+r.id+'" data-v="trial">Trial 30 d</button> <button class="btn sm d" data-a="oplan" data-pid="'+r.id+'" data-v="susp">Suspend</button> <button class="btn sm p" data-a="openp" data-pid="'+r.id+'">Open</button> <button class="btn sm d" data-a="odelp" data-pid="'+r.id+'">Delete</button></td></tr>'}).join('')||'<tr><td colspan="7" class="empty">No projects match.</td></tr>')+'</table></div></div></div>';
