function clean(s){s=(s||'').replace(/\s+/g,' ').replace(/[\s.\-,:;]+$/,'').trim();if(s&&s===s.toUpperCase()&&/[A-Z]/.test(s))s=s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());return s.slice(0,40)}

function parseTx(raw,meta){meta=meta||{};const t=String(raw||'').replace(/\s+/g,' ').trim();if(!t||t.length<15)return null;

function parseDue(text,meta){meta=meta||{};const t=String(text||'').replace(/\s+/g,' ');

let NB=null;function buildNB(){const cnt={},tot={},voc=new Set();S.tx.forEach(x=>{if(!x.user||!x.cat)return;const tk=toks(x.merchant);cnt[x.cat]=(cnt[x.cat]||0)+1;tot[x.cat]=tot[x.cat]||{};tk.forEach(w=>{tot[x.cat][w]=(tot[x.cat][w]||0)+1;voc.add(w)})});NB={cnt,tot,voc:voc.size,n:Object.values(cnt).reduce((a,b)=>a+b,0)}}
