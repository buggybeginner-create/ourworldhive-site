plugins { id 'com.android.application' }
android {
    namespace 'com.ourworldhive.diary'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ourworldhive.diary'
        minSdk 24
        targetSdk 36
        /* every build gets a new, higher number (a re-run of the same build too), so Play never says "version code already used" */
        versionCode(1000 + ((System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int) * 10 + ((System.getenv('GITHUB_RUN_ATTEMPT') ?: '1') as int))
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        /* test builds for your own phone */
        debug { storeFile file('../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        /* Play Store builds: the upload key file is locked with a password kept only in GitHub Secrets (DIARY_KEY_PASS) */
        upload { storeFile file('../upload.keystore'); storePassword System.getenv('DIARY_KEY_PASS') ?: ''; keyAlias 'upload'; keyPassword System.getenv('DIARY_KEY_PASS') ?: ''; storeType 'pkcs12' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { signingConfig signingConfigs.upload; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
    /* shared code for all Ourworldhive apps (Google Play Billing) */
    sourceSets { main { java.srcDirs += ['../../android-shared/java'] } }
}
dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
}
