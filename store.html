<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hive Store | Ourworldhive</title>
<meta name="description" content="Skins, caps, bats, taunts and chat lines for Ourworldhive games. Pay with UPI, use everywhere.">
<style>
:root{--bg:#0b0f1e;--card:#141a30;--line:#2a3354;--ink:#eef1ff;--mut:#98a3cc;--gold:#ffc83d;--gem:#38d6ff;--ok:#38d98a;--bad:#ff6b6b;--acc:#7c6cff}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
header a.bk{color:var(--mut);text-decoration:none;font-size:14px}
h1{font-size:22px;margin:0;flex:1}
.bal{display:flex;gap:8px}.bal b{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:15px}
.acct{font-size:13px;color:var(--mut);margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;color:#fff;background:#2c365e}
button:disabled{opacity:.5;cursor:default}
.pri{background:var(--acc)}.gold{background:var(--gold);color:#2b1d00;font-weight:700}.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.tabs button{white-space:nowrap;background:var(--card);border:1px solid var(--line)}.tabs button.on{background:var(--acc);border-color:var(--acc)}
.stage{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px;align-items:center}
.stage canvas{width:150px;height:190px;flex:none;background:linear-gradient(#1b2850,#0e1630);border-radius:12px}
.sinfo{flex:1;min-width:0}.sinfo h2{margin:0 0 4px;font-size:18px}.sinfo p{margin:0 0 8px;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.it{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer;min-width:0}
.it.sel{border-color:var(--acc)}.it .sw{height:46px;border-radius:10px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-size:28px}
.it b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-top:4px;background:#222a4a}.tag.own{background:#124d33;color:#8ff0c0}.tag.eq{background:var(--acc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pk{background:#0f1530;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer}.pk.sel{border-color:var(--gold)}.pk .big{font-size:22px;font-weight:800}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b1026;color:var(--ink)}
.msg{min-height:20px;font-size:13px;margin:8px 0 0}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.ord{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.note{font-size:12.5px;color:var(--mut)}
#tz{position:fixed;left:0;right:0;top:20%;text-align:center;font-weight:900;font-size:34px;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;transform:scale(.7);text-shadow:0 3px 14px #000}
#tz.show{opacity:1;transform:scale(1)}
@media(max-width:420px){.stage{flex-direction:column;align-items:stretch}.stage canvas{width:100%;height:200px}}
</style></head><body><div class="wrap">
<header><a class="bk" href="games.html">&larr; Games</a><h1>🛒 Hive Store</h1><div class="bal"><b>🪙 <span id="bc">0</span></b><b>💎 <span id="bg">0</span></b></div></header>
<p class="acct"><span id="who">Connecting...</span><button class="sm" id="gbtn" hidden>Save my wallet with Google</button></p>
<div class="stage"><canvas id="cv" width="300" height="380"></canvas><div class="sinfo"><h2 id="sn">Pick something</h2><p id="sd">Tap any item to see it on the player. Buy it to keep it.</p><div id="sact"></div><p class="msg" id="smsg"></p></div></div>
<div class="tabs" id="tabs"></div>
<div id="body"></div>
<p class="note">Everything you buy works in all Ourworldhive games that support it. Coins and gems are for fun items only and cannot be turned back into money.</p>
<div id="tz"></div>
</div>
<script src="firebase-config.js"></script>
<script src="store-items.js"></script>
<script>
'use strict';
var OWNER='er.krushnananda@gmail.com',FBV='10.12.2',ST=OWHSTORE,W=ST.load(),db=null,auth=null,uid=null,cfg={upi:'',name:''},tab='kit',prev={},selId=null,pack=null,orders=[],wref=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ls(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function say(id,t,k){var e=$(id);e.textContent=t||'';e.className='msg'+(k?' '+k:'')}
function rgb(c,d){return c?'rgb('+c[0]+','+c[1]+','+c[2]+')':(d||'#2a6df0')}
var TABS=[['kit','Kits'],['cap','Caps'],['bat','Bats'],['taunt','Taunts'],['chat','Chat lines'],['buy','Buy coins / gems']];
/* ---------- firebase ---------- */
async function boot(){
  try{
    var b='https://www.gstatic.com/firebasejs/'+FBV+'/';
    if(!window.firebase)await ls(b+'firebase-app-compat.js');if(!firebase.auth)await ls(b+'firebase-auth-compat.js');if(!firebase.firestore)await ls(b+'firebase-firestore-compat.js');
    if(!firebase.apps.length)firebase.initializeApp(window.OWH_FIREBASE);
    auth=firebase.auth();db=firebase.firestore();
    if(!auth.currentUser)await new Promise(function(ok){var u=auth.onAuthStateChanged(function(x){u();ok(x)})});
    if(!auth.currentUser)await auth.signInAnonymously();
    attach();
  }catch(e){$('who').textContent='Offline. You can look at items, but buying needs internet.';console.warn(e)}
}
function attach(){
  var u=auth.currentUser;uid=u.uid;var mail=(u.email||'').toLowerCase(),own=mail===OWNER;
  $('who').textContent=own?'Owner mode: every item is unlocked for you ('+mail+')':(u.isAnonymous?'Guest wallet on this device':'Signed in as '+(u.email||'Google user'));
  $('gbtn').hidden=!u.isAnonymous;
  W.owner=own;ST.save(W);
  if(wref)try{wref()}catch(e){}
  var ref=db.collection('wallets').doc(uid);
  wref=ref.onSnapshot(function(s){
    if(!s.exists){ref.set({coins:0,gems:0,owned:[],eq:{},t:Date.now()}).catch(function(){});return}
    var d=s.data();W={coins:+d.coins||0,gems:+d.gems||0,owned:d.owned||[],eq:d.eq||{},owner:own};ST.save(W);paint()
  },function(e){say('smsg','Could not read your wallet. The Firestore rules for wallets are not published yet.','err')});
  db.collection('config').doc('store').get().then(function(s){if(s.exists)cfg=Object.assign(cfg,s.data());if(tab==='buy')paint()}).catch(function(){});
  db.collection('store_orders').where('uid','==',uid).limit(20).onSnapshot(function(q){orders=q.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return b.t-a.t});if(tab==='buy')paint()},function(){});
}
$('gbtn').onclick=async function(){
  try{await auth.currentUser.linkWithPopup(new firebase.auth.GoogleAuthProvider());attach()}
  catch(e){
    if(e&&e.code==='auth/credential-already-in-use'&&e.credential){try{await auth.signInWithCredential(e.credential);attach()}catch(x){say('smsg','Sign-in failed: '+(x.code||x.message),'err')}}
    else say('smsg','Sign-in failed: '+((e&&e.code)||e),'err')}
};
/* ---------- drawing the preview player ---------- */
var tAnim=0;
function eqNow(){var o={};['kit','cap','bat'].forEach(function(t){o[t]=prev[t]||(W.eq&&W.eq[t]&&ST.has(W,W.eq[t])?W.eq[t]:null)});return o}
function drawPlayer(){
  var cv=$('cv'),c=cv.getContext('2d'),w=cv.width,h=cv.height,e=eqNow();
  c.clearRect(0,0,w,h);
  var kit=ST.by(e.kit||'kit_team'),cap=ST.by(e.cap||'cap_band'),bat=ST.by(e.bat||'bat_std');
  var jc=rgb(kit&&kit.col,'#2a6df0'),bob=Math.sin(Date.now()/400)*3;
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(150,352,70,12,0,0,7);c.fill();
  c.lineCap='round';c.lineJoin='round';
  /* legs */
  c.strokeStyle='#15182a';c.lineWidth=13;c.beginPath();c.moveTo(138,215+bob);c.lineTo(122,285);c.lineTo(112,345);c.moveTo(162,215+bob);c.lineTo(178,285);c.lineTo(190,345);c.stroke();
  c.strokeStyle='#f2f2ee';c.lineWidth=17;c.beginPath();c.moveTo(124,275);c.lineTo(114,335);c.moveTo(176,275);c.lineTo(188,335);c.stroke();
  /* bat */
  var bc=rgb(bat&&bat.col,'#dcb17a'),bs=bat&&bat.sticker?rgb(bat.sticker):null;
  c.save();c.translate(206,236+bob);c.rotate(.22);c.fillStyle='#222';c.fillRect(-4,-30,8,36);c.fillStyle=bc;c.beginPath();c.moveTo(-11,6);c.lineTo(11,6);c.lineTo(13,112);c.quadraticCurveTo(0,120,-13,112);c.closePath();c.fill();if(bs){c.fillStyle=bs;c.fillRect(-9,40,18,26)}c.restore();
  /* torso */
  c.strokeStyle=jc;c.lineWidth=46;c.beginPath();c.moveTo(150,125+bob);c.lineTo(150,210+bob);c.stroke();
  c.strokeStyle='#15182a';c.lineWidth=11;c.beginPath();c.moveTo(125,128+bob);c.lineTo(100,190);c.lineTo(112,235);c.moveTo(175,128+bob);c.lineTo(200,190);c.lineTo(206,236+bob);c.stroke();
  c.fillStyle='#ffd23f';c.beginPath();c.arc(150,172+bob,13,0,7);c.fill();c.fillStyle='#111';c.font='bold 14px sans-serif';c.textAlign='center';c.fillText('7',150,177+bob);
  /* head */
  var hx=150,hy=82+bob;c.fillStyle='#f6e0c4';c.beginPath();c.arc(hx,hy,32,0,7);c.fill();
  c.fillStyle='#1a1a20';c.beginPath();c.arc(hx-11,hy-2,3.2,0,7);c.arc(hx+11,hy-2,3.2,0,7);c.fill();c.fillRect(hx-16,hy+12,32,5);
  /* cap */
  var cc=rgb(cap&&cap.col,jc),st=cap&&cap.style;
  if(st==='band'||!st){c.fillStyle=cc;c.fillRect(hx-32,hy-22,64,9)}
  else if(st==='cap'){c.fillStyle=cc;c.beginPath();c.arc(hx,hy-8,32,Math.PI,0);c.fill();c.fillRect(hx-4,hy-10,44,8)}
  else if(st==='beanie'){c.fillStyle=cc;c.beginPath();c.arc(hx,hy-6,33,Math.PI,0);c.fill();c.fillStyle='#fff';c.fillRect(hx-33,hy-12,66,9);c.beginPath();c.arc(hx,hy-40,8,0,7);c.fill()}
  else if(st==='cowboy'){c.fillStyle=cc;c.beginPath();c.ellipse(hx,hy-14,56,10,0,0,7);c.fill();c.beginPath();c.arc(hx,hy-16,26,Math.PI,0);c.fill()}
  else if(st==='crown'){c.fillStyle=cc;c.beginPath();c.moveTo(hx-28,hy-22);c.lineTo(hx-28,hy-52);c.lineTo(hx-14,hy-36);c.lineTo(hx,hy-56);c.lineTo(hx+14,hy-36);c.lineTo(hx+28,hy-52);c.lineTo(hx+28,hy-22);c.closePath();c.fill()}
}
function loop(){drawPlayer();requestAnimationFrame(loop)}
function showTaunt(it){var z=$('tz');z.style.color=it.col;z.innerHTML=it.e+' '+esc(it.txt);z.className='show';clearTimeout(tAnim);tAnim=setTimeout(function(){z.className=''},2200)}
/* ---------- list ---------- */
function priceTxt(it){return it.free?'Free':(it.cur==='gems'?'💎 ':'🪙 ')+it.p}
function paint(){
  $('bc').textContent=W.coins;$('bg').textContent=W.gems;
  $('tabs').innerHTML=TABS.map(function(t){return'<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>'}).join('');
  [].forEach.call($('tabs').children,function(b){b.onclick=function(){tab=b.dataset.t;selId=null;say('smsg','');paint()}});
  if(tab==='buy'){paintBuy();info(null);return}
  var list=ST.ITEMS.filter(function(i){return i.t===tab});
  $('body').innerHTML='<div class="grid">'+list.map(function(it){
    var own=ST.has(W,it.id),eq=W.eq&&W.eq[it.t]===it.id||(it.free&&!(W.eq&&W.eq[it.t]));
    var sw=it.t==='kit'?'<div class="sw" style="background:'+rgb(it.col,'#2a6df0')+'"></div>':it.t==='cap'?'<div class="sw" style="background:#1d2547">'+(it.style==='crown'?'👑':it.style==='cowboy'?'🤠':it.style==='beanie'?'🧢':it.style==='cap'?'🧢':'🥷')+'</div>':it.t==='bat'?'<div class="sw" style="background:'+rgb(it.col,'#dcb17a')+'">🏏</div>':it.t==='taunt'?'<div class="sw" style="background:#1d2547">'+it.e+'</div>':'<div class="sw" style="background:#1d2547;font-size:14px;padding:4px">'+esc(it.txt)+'</div>';
    return'<div class="it'+(selId===it.id?' sel':'')+'" data-id="'+it.id+'">'+sw+'<b>'+esc(it.n)+'</b><small>'+priceTxt(it)+'</small><br>'+(eq&&(it.t==='kit'||it.t==='cap'||it.t==='bat')?'<span class="tag eq">Equipped</span>':own?'<span class="tag own">'+(W.owner&&!it.free?'Owner':'Owned')+'</span>':'')+'</div>'}).join('')+'</div>';
  [].forEach.call($('body').querySelectorAll('.it'),function(el){el.onclick=function(){pick(el.dataset.id)}});
  info(selId?ST.by(selId):null);
}
function pick(id){var it=ST.by(id);selId=id;if(it.t==='kit'||it.t==='cap'||it.t==='bat')prev[it.t]=id;if(it.t==='taunt')showTaunt(it);paint()}
function info(it){
  var sn=$('sn'),sd=$('sd'),a=$('sact');a.innerHTML='';
  if(!it){sn.textContent=tab==='buy'?'Top up':'Pick something';sd.textContent=tab==='buy'?'Choose a pack, pay with any UPI app, then enter the UTR so we can add it.':'Tap any item to see it on the player. Buy it to keep it.';return}
  sn.textContent=it.n;var own=ST.has(W,it.id);
  sd.textContent=own?(W.owner&&!it.free?'Unlocked for the owner.':'You own this.'):'Price: '+priceTxt(it)+'. You are previewing it right now.';
  if(own){
    if(it.t==='kit'||it.t==='cap'||it.t==='bat'){var b=document.createElement('button');b.className='pri';b.textContent='Equip';b.onclick=function(){equip(it)};a.appendChild(b)}
    else if(it.t==='taunt'){var b2=document.createElement('button');b2.className='pri';b2.textContent='Preview taunt';b2.onclick=function(){showTaunt(it)};a.appendChild(b2)}
    else sd.textContent+=' Use it from the chat button inside the game.';
  }else{var b3=document.createElement('button');b3.className='gold';b3.textContent='Buy for '+priceTxt(it);b3.onclick=function(){buy(it)};a.appendChild(b3)}
}
async function equip(it){
  W.eq=W.eq||{};W.eq[it.t]=it.free?null:it.id;prev={};ST.save(W);paint();
  if(db&&uid){try{await db.collection('wallets').doc(uid).set({eq:W.eq},{merge:true});say('smsg','Equipped. It will show in your next match.','ok')}catch(e){say('smsg','Saved on this device. Could not save online.','err')}}
  else say('smsg','Equipped on this device.','ok');
}
async function buy(it){
  if(!db||!uid){say('smsg','You need internet to buy.','err');return}
  var key=it.cur;if(W[key]<it.p){say('smsg','Not enough '+key+'. Open "Buy coins / gems" to top up.','err');return}
  say('smsg','Buying...');
  try{
    var ref=db.collection('wallets').doc(uid);
    await db.runTransaction(async function(tx){
      var s=await tx.get(ref),d=s.exists?s.data():{coins:0,gems:0,owned:[],eq:{}};
      if((d[key]||0)<it.p)throw new Error('funds');
      if((d.owned||[]).indexOf(it.id)>=0)throw new Error('have');
      var up={};up[key]=(d[key]||0)-it.p;up.owned=(d.owned||[]).concat([it.id]);
      if(!s.exists){up.coins=up.coins===undefined?0:up.coins;up.gems=up.gems===undefined?0:up.gems;up.eq={}}
      tx.set(ref,up,{merge:true})});
    say('smsg','Bought! '+it.n+' is yours.','ok');
  }catch(e){say('smsg',e.message==='funds'?'Not enough '+key+'.':e.message==='have'?'You already own this.':'Could not buy: '+(e.code||e.message),'err')}
}
/* ---------- top up ---------- */
function paintBuy(){
  var ready=!!cfg.upi;
  $('body').innerHTML='<div class="panel"><b>1. Choose a pack</b><div class="packs" style="margin-top:8px">'+ST.PACKS.map(function(p){return'<div class="pk'+(pack===p.id?' sel':'')+'" data-p="'+p.id+'"><div class="big">'+(p.cur==='gems'?'💎':'🪙')+' '+p.amt+'</div><div>&#8377;'+p.rs+'</div></div>'}).join('')+'</div></div>'+
   '<div class="panel" id="pay">'+(pack?payHtml(ST.PACKS.filter(function(p){return p.id===pack})[0],ready):'<span class="note">Choose a pack above to see how to pay.</span>')+'</div>'+
   '<div class="panel"><b>Your top-ups</b>'+(orders.length?orders.map(function(o){return'<div class="ord"><span>'+(o.cur==='gems'?'💎':'🪙')+' '+o.amt+' &middot; &#8377;'+o.rs+' &middot; UTR '+esc(o.utr)+'</span><b style="color:'+(o.status==='approved'?'var(--ok)':o.status==='rejected'?'var(--bad)':'var(--gold)')+'">'+esc(o.status)+'</b></div>'}).join(''):'<div class="note" style="margin-top:6px">Nothing yet.</div>')+'</div>';
  [].forEach.call($('body').querySelectorAll('.pk'),function(el){el.onclick=function(){pack=el.dataset.p;paintBuy()}});
  var sb=$('pSend');if(sb)sb.onclick=sendOrder;var cp=$('pCopy');if(cp)cp.onclick=function(){try{navigator.clipboard.writeText(cfg.upi);say('pMsg','UPI ID copied.','ok')}catch(e){say('pMsg','Select and copy the UPI ID.','')}};
}
function payHtml(p,ready){
  if(!ready)return'<b>Payments are opening soon.</b><p class="note">The owner has not added a UPI ID yet.</p>';
  var ref='OWH'+(uid||'x').slice(0,6).toUpperCase(),link='upi://pay?pa='+encodeURIComponent(cfg.upi)+'&pn='+encodeURIComponent(cfg.name||'Ourworldhive')+'&am='+p.rs+'&cu=INR&tn='+encodeURIComponent(ref);
  return'<b>2. Pay &#8377;'+p.rs+' by UPI</b><p class="note">UPI ID: <b id="upiid">'+esc(cfg.upi)+'</b> '+(cfg.name?'('+esc(cfg.name)+')':'')+' <button class="sm" id="pCopy">Copy</button></p><p><a href="'+link+'"><button class="gold">Open my UPI app (phone)</button></a></p><p class="note">On a computer, pay with your phone to the UPI ID above. Write <b>'+ref+'</b> in the note if you can.</p>'+
   '<b>3. Enter the UTR</b><p class="note">After paying, your UPI app shows a 12 digit UTR / transaction ID.</p><input id="pUtr" inputmode="numeric" maxlength="12" placeholder="12 digit UTR number"><p style="margin:10px 0 0"><button class="pri" id="pSend">I have paid</button></p><p class="msg" id="pMsg"></p><p class="note">The owner checks the payment and adds your '+(p.cur==='gems'?'gems':'coins')+', usually within a few hours. This page updates by itself.</p>';
}
async function sendOrder(){
  var p=ST.PACKS.filter(function(x){return x.id===pack})[0],utr=($('pUtr').value||'').replace(/\D/g,'');
  if(!p)return;if(utr.length!==12){say('pMsg','The UTR must be 12 digits.','err');return}
  if(!db||!uid){say('pMsg','You need internet.','err');return}
  if(orders.some(function(o){return o.utr===utr})){say('pMsg','You already sent this UTR.','err');return}
  say('pMsg','Sending...');
  try{await db.collection('store_orders').add({uid:uid,pack:p.id,cur:p.cur,amt:p.amt,rs:p.rs,utr:utr,status:'pending',t:Date.now()});say('pMsg','Sent. Waiting for the owner to confirm.','ok');$('pUtr').value=''}
  catch(e){say('pMsg','Could not send: '+(e.code||e.message)+(/permission/i.test(e.code||e.message||'')?' (Firestore rules for store_orders are not published yet.)':''),'err')}
}
paint();loop();boot();
</script></body></html>
