name: Smart SMS Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-smartsms/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android-smartsms/**', '.github/workflows/android-build.yml']

permissions:
  contents: write

concurrency:
  group: smart-sms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-smartsms
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile the app
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Smart-SMS-debug.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-debug-apk
          path: Smart-SMS-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-test-reports
          path: android-smartsms/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Put the APK on the Releases page
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smart-sms-apk
          name: Smart SMS test APK (latest)
          body: |
            Build ${{ github.run_number }} of Smart SMS (Phase 1, debug build).
            Smart-SMS-debug.apk: install on your phone. Each new build installs over the old one.
            The messages inside the app are sample DEMO data, not real SMS.
          files: Smart-SMS-debug.apk
          make_latest: false
