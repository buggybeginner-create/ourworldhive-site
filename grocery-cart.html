const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'');
function keys(it){return [it.n,...(it.al||[])].map(norm).filter(Boolean)}
function score(it,q){const nq=norm(q);if(!nq)return 0;let best=0;const toks=String(q).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);let ki=0;for(const k of keys(it)){let s=0;ki++;if(k===nq)s=100;else if(k===nq.replace(/(es|s)$/,''))s=95;else if(k.startsWith(nq))s=80;else if(nq.startsWith(k)&&k.length>=4)s=70;else if(k.includes(nq))s=60;if(ki===1&&s>=60)s+=3;best=Math.max(best,s)}if(best<50&&toks.length>1){const all=keys(it).join(' ');if(toks.every(t=>all.includes(t)))best=50}return best}
function find(q){let b=null,bs=0;for(const it of ALL){const s=score(it,q);if(s>bs||(s===bs&&s>0&&b&&it.n.length<b.n.length)){bs=s;b=it}}return bs>=50?b:null}

function parseSeg(s){s=s.trim();if(!s)return null;let price=null;s=s.replace(/(?:@|₹|rs\.?\s*)\s*(\d+(?:\.\d+)?)/i,(m,a)=>{price=+a;return' '});let q=null,u=null;const ur=Object.keys(UM).join('|');let m=s.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*('+ur+')\\b','i'));if(m){q=+m[1];u=UM[m[2].toLowerCase()];s=s.replace(m[0],' ')}else{m=s.match(/(?:^|\s)(\d+(?:\.\d+)?)(?=\s|$)/);if(m){q=+m[1];s=s.replace(m[0],' ')}}s=s.replace(/\b(of|ka|ki|ke|aur)\b/gi,' ').replace(/\s+/g,' ').trim();if(!s)return null;return{name:s,q,u,price}}

function spark(pts,w,h){const ps=pts.map(p=>+p.p);const mn=Math.min(...ps),mx=Math.max(...ps);const X=i=>2+(w-4)*(pts.length===1?.5:i/(pts.length-1));const Y=v=>mx===mn?h/2:2+(h-4)*(1-(v-mn)/(mx-mn));const up=ps[ps.length-1]>ps[0];return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${up?'var(--bad)':'var(--good)'}" stroke-width="2" stroke-linejoin="round" points="${ps.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/></svg>`}

function chart(pts){const W=320,H=140,pl=40,pr=10,pt=12,pb=24;const ps=pts.map(p=>+p.p);let mn=Math.min(...ps),mx=Math.max(...ps);let lo=mn,hi=mx;if(lo===hi){lo=mn*.9;hi=mx*1.1||1}const X=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1));const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(+p.p).toFixed(1)).join(' ');

const it=BYID[id];if(it&&it.custom){const c=S.custom.find(x=>x.id===id);Object.assign(c,f)}else S.over[id]=Object.assign(S.over[id]||{},f);rebuild();save();close();render();toast('Saved');return id}
function sheetHist(hid){const h=S.hist.find(x=>x.id===hid);if(!h)return;const it=getIt(h.it);const d=new Date(h.d);const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
open(`<div class="sh">${thumb(it,52)}<div><h2>${esc(it.n)}</h2><p>Edit this purchase</p></div></div><form id="hf" data-h="${esc(hid)}"><div class="two"><div class="fr"><label>Date bought</label><input type="date" name="d" value="${iso}" required></div><div class="fr"><label>Quantity</label><input name="q" type="number" step="any" min="0" value="${h.q}"></div></div><div class="two"><div class="fr"><label>Unit</label><select name="u">${UNITS.map(u=>`<option${u===h.u?' selected':''}>${u}</option>`).join('')}</select></div><div class="fr"><label>Price per unit (₹)</label><input name="p" type="number" step="any" min="0" inputmode="decimal" value="${num(h.p)==null?'':h.p}"></div></div><div class="acts"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-act="closem">Cancel</button><button class="btn bad" type="button" data-act="hdel">Delete</button></div></form>`)}
function sheetMore(){open(`<div class="sh"><span class="th" style="width:52px;height:52px;font-size:28px;background:var(--soft)">🛒</span><div><h2>Grocery Cart</h2><p>Data is saved on this phone or browser.</p></div></div><div class="card blk"><h4>Backup</h4><p style="margin-bottom:10px">Download your cart, history and item edits as a file, or load a saved file. Cloud sync across devices is coming later.</p><div class="acts"><button class="btn" data-act="export">Download backup</button><button class="btn ghost" data-act="import">Load backup</button></div><input type="file" id="imp" accept="application/json" hidden></div><div class="card blk"><h4>Reset</h4><p style="margin-bottom:10px">Remove all cart items and purchase history. Your edited items stay.</p><button class="btn bad" data-act="wipe">Clear cart and history</button></div><div class="copy">© ${new Date().getFullYear()} DUKEKRRISH. All rights reserved.</div><div class="acts" style="margin-top:10px"><button class="btn ghost" data-act="closem">Close</button></div>`);
const im=$('#imp');if(im)im.onchange=()=>{const f=im.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.hist))throw 0;S=Object.assign(S,{cart:o.cart||[],hist:o.hist||[],over:o.over||{},custom:o.custom||[]});rebuild();save();close();render();toast('Backup loaded')}catch(e){toast('That file is not a valid backup')}};r.readAsText(f)}}
/* events */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-t],[data-cf],[data-tf]');if(!t)return;
if(t.dataset.t){S.tab=t.dataset.t;save();render();window.scrollTo(0,0);return}
if(t.dataset.cf){S.cf=t.dataset.cf;save();render();return}
if(t.dataset.tf){S.tf=t.dataset.tf;save();render();return}
const a=t.dataset.act;const row=e.target.closest('[data-l]');const l=row&&S.cart.find(x=>x.id===row.dataset.l);
if(a==='closeov'){if(e.target.classList.contains('ov'))close();return}
if(a==='closem'){close();return}
if(a==='qadd'){const i=$('#qa');if(i&&i.value.trim()){quickAdd(i.value);i.value=''}render();return}
if(a==='qsug'){quickAdd(t.dataset.q);const i=$('#qa');if(i)i.value='';render();return}
if(a==='qm'&&l){l.q=Math.max(0,Math.round(((+l.q||0)-(l.u==='g'||l.u==='ml'?100:1))*1000)/1000);if(l.done&&l.h){const h=S.hist.find(x=>x.id===l.h);if(h)h.q=l.q}save();render();return}
if(a==='qp'&&l){l.q=Math.round(((+l.q||0)+(l.u==='g'||l.u==='ml'?100:1))*1000)/1000;if(l.done&&l.h){const h=S.hist.find(x=>x.id===l.h);if(h)h.q=l.q}save();render();return}
if(a==='rm'&&l){S.cart=S.cart.filter(x=>x!==l);save();render();return}
if(a==='info'&&l){sheetItem(l.it);return}
if(a==='info2'){sheetItem(t.dataset.it);return}
if(a==='add'){const it=BYID[t.dataset.it];if(it){const l2=addToCart(it);toast('Added '+it.n+' (×'+l2.q+')');render()}return}
if(a==='sadd'){const it=BYID[t.dataset.it];if(it){addToCart(it);close();toast('Added '+it.n);render()}return}
if(a==='sedit'){sheetEdit(t.dataset.it);return}
if(a==='new'){sheetEdit('');return}
if(a==='noimg'){const id=$('#ef').dataset.id;const it=BYID[id];if(it&&it.custom){delete S.custom.find(x=>x.id===id).img}else{S.over[id]=Object.assign(S.over[id]||{},{img:''})}rebuild();save();close();render();toast('Picture removed');return}
if(a==='reset'){const id=$('#ef').dataset.id;delete S.over[id];rebuild();save();close();render();toast('Reset');return}
if(a==='delit'){const id=$('#ef').dataset.id;const it=BYID[id];if(it&&it.custom)S.custom=S.custom.filter(x=>x.id!==id);else S.over[id]=Object.assign(S.over[id]||{},{del:1});S.cart=S.cart.filter(x=>x.it!==id||x.done);rebuild();save();close();render();toast('Removed');return}
if(a==='hedit'){sheetHist(t.dataset.h);return}
if(a==='hdel'){const hid=$('#hf').dataset.h;S.hist=S.hist.filter(x=>x.id!==hid);for(const c of S.cart)if(c.h===hid){c.h=null}save();close();render();toast('Deleted');return}
if(a==='clear'){S.cart=S.cart.filter(x=>!x.done);save();render();toast('Cleared bought items');return}
if(a==='share'){const pend=S.cart.filter(x=>!x.done);const txt='🛒 Grocery list\n'+(pend.length?pend.map(x=>'☐ '+getIt(x.it).n+' – '+x.q+' '+x.u).join('\n'):'(all bought)');if(navigator.share){navigator.share({text:txt}).catch(()=>{})}else window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');return}
if(a==='export'){const b=new Blob([JSON.stringify({v:1,cart:S.cart,hist:S.hist,over:S.over,custom:S.custom})],{type:'application/json'});const u=URL.createObjectURL(b);const x=document.createElement('a');x.href=u;x.download='grocery-cart-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return}
if(a==='import'){$('#imp').click();return}
if(a==='wipe'){if(t.dataset.sure){S.cart=[];S.hist=[];save();close();render();toast('Cleared')}else{t.dataset.sure=1;t.textContent='Tap again to confirm';}return}
});
document.addEventListener('change',e=>{const t=e.target;const f=t.dataset&&t.dataset.f;if(!f)return;const row=t.closest('[data-l]');const l=row&&S.cart.find(x=>x.id===row.dataset.l);if(!l)return;
if(f==='q'){l.q=num(t.value)==null?1:num(t.value)}else if(f==='u'){l.u=t.value}else if(f==='p'){l.p=num(t.value)==null?'':num(t.value)}
if(l.done&&l.h){const h=S.hist.find(x=>x.id===l.h);if(h){h.q=+l.q||1;h.u=l.u;h.p=l.p}}save();render()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='tick'){const row=t.closest('[data-l]');const l=S.cart.find(x=>x.id===row.dataset.l);if(!l)return;setDone(l,t.checked);save();render();if(l.done)toast(num(l.p)==null?'Saved with today\'s date (no price)':'Saved with today\'s date and price')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='ef'){submitEdit(f)}else if(f.id==='hf'){const h=S.hist.find(x=>x.id===f.dataset.h);if(!h)return;const d=new Date(h.d);const nd=String(new FormData(f).get('d'));const cur=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(nd&&nd!==cur)h.d=new Date(nd+'T12:00:00').toISOString();h.q=num(new FormData(f).get('q'))||1;h.u=new FormData(f).get('u');const p=num(new FormData(f).get('p'));h.p=p==null?'':p;save();close();render();toast('Saved')}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='sq'){S.q=t.value;const pos=t.selectionStart;vItems();const n=$('#sq');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
else if(t.id==='hq'){S.hq=t.value;const pos=t.selectionStart;vHist();const n=$('#hq');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
else if(t.id==='qa'){const segs=t.value.split(/[,\n;+]/);const last=parseSeg(segs[segs.length-1]||'');const box=$('#sug');if(!last||last.name.length<1){box.hidden=true;return}const res=search(last.name,8);const inc={};for(const l of S.cart)if(!l.done)inc[l.it]=l.q;if(!res.length){box.hidden=true;return}const pre=segs.slice(0,-1).join(', ');box.innerHTML=res.map(it=>`<button data-act="qsug" data-q="${esc((pre?pre+', ':'')+it.n+(last.q?' '+last.q+(last.u||''):''))}">${thumb(it,32)}<span><b>${esc(it.n)}</b> <small style="color:var(--ink2)">${esc(it.cat)}</small></span>${inc[it.id]!=null?`<span class="chg dn" style="margin-left:auto">in cart ×${inc[it.id]}</span>`:`<span style="margin-left:auto;color:var(--brand);font-weight:800;white-space:nowrap">＋ Add</span>`}</button>`).join('');box.hidden=false}});
document.addEventListener('keydown',e=>{if(e.target.id==='qa'&&e.key==='Enter'){e.preventDefault();if(e.target.value.trim()){quickAdd(e.target.value);e.target.value=''}render();const q=$('#qa');if(q)q.focus()}if(e.key==='Escape')close()});
document.addEventListener('click',e=>{if(!e.target.closest('.qa')){const b=$('#sug');if(b)b.hidden=true}});
$('#bMore').onclick=sheetMore;
render();
})();
</script></body></html>
