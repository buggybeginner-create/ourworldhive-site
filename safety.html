<script>

const pd=s=>{const p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]||1)};

const fmt=s=>{if(!s)return'';const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};

/* ================= phone-only storage for the demo (same calls as Firestore) ================= */
const LocalFS=(function(){const KEY='sf_demo_v1';let mem=null,subs=[];
 const load=()=>{if(mem)return mem;try{mem=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){mem={}}return mem};

 const parts=p=>p.split('/'),cp=v=>JSON.parse(JSON.stringify(v)),emit=()=>subs.slice().forEach(f=>f());
 const dsnap=p=>{const d=load()[p];return{exists:d!==undefined,id:parts(p).pop(),data:()=>d===undefined?undefined:cp(d)}};
 const cdocs=p=>{const pre=p+'/',n=parts(p).length+1;return Object.keys(load()).filter(k=>k.indexOf(pre)===0&&parts(k).length===n).map(dsnap)};

function parseCsv(t){t=t.replace(/^﻿/,'');const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);return rows}
function structCsv(tpl){const rows=[STH];if(tpl){rows.push(['Plant 1','Mechanical','A K Sharma','ak.sharma@example.com','Crusher','R K Singh','rk.singh@example.com','E1001','E2001']);rows.push(['Plant 1','Mechanical','A K Sharma','ak.sharma@example.com','Kiln','S Das','s.das@example.com','E1001','']);rows.push(['Plant 1','Electrical','P Roy','p.roy@example.com','HT panel','M Khan','m.khan@example.com','',''])}
 else S.units.forEach(u=>{const ds=S.depts.filter(d=>d.unitId===u.id);if(!ds.length)rows.push([u.name,'','','','','','']);ds.forEach(d=>{const ss=S.secs.filter(x=>x.deptId===d.id),h=d.head||{};if(!ss.length)rows.push([u.name,d.name,h.n||'',h.e||'','','','',h.i||'','']);ss.forEach(x=>{const p=x.incharge||{};rows.push([u.name,d.name,h.n||'',h.e||'',x.name,p.n||'',p.e||'',h.i||'',p.i||''])})})});
 return toCsv(rows)}

function structPlan(rows){const hd=rows[0].map(x=>x.trim().toLowerCase()),ix=n=>hd.indexOf(n.toLowerCase());const I=STH.map(ix);if(I.slice(0,5).some(i=>i<0))return{err:'Columns not found. Use the template: '+STH.join(', ')+'.'};
 const g=(r,k)=>I[k]<0?'':String(r[I[k]]||'').trim(),ops=[],bad=[],nu=n=>nrm(n);const uMap={},dMap={},sMap={};
 S.units.forEach(u=>uMap[nu(u.name)]={id:u.id,name:u.name});S.depts.forEach(d=>dMap[d.unitId+'|'+nu(d.name)]={id:d.id,unitId:d.unitId,ex:1});S.secs.forEach(x=>sMap[x.deptId+'|'+nu(x.name)]={id:x.id,ex:1});
 let nd=0,ns=0,ud=0,us=0,nun=0;
 rows.slice(1).forEach((r,i)=>{const un=g(r,0),dn=g(r,1),sn=g(r,4),line=i+2;if(!un&&!dn&&!sn)return;
  const U=uMap[nu(un)];if(!U){bad.push('Row '+line+': unit "'+un+'" not found. Add the unit first.');return}
  if(!modFor(U.id)){bad.push('Row '+line+': you cannot change unit "'+un+'".');return}

  const hn=g(r,2),he=g(r,3),sin=g(r,5),sie=g(r,6),hi=g(r,7),si=g(r,8);if(he&&!emailOk(lc(he))){bad.push('Row '+line+': head e-mail "'+he+'" is not valid.');return}if(sie&&!emailOk(lc(sie))){bad.push('Row '+line+': incharge e-mail "'+sie+'" is not valid.');return}

  else if((hn||he)&&!D.done){D.done=1;ops.push({p:'depts/'+D.id,v:{head:person(hn,he,hi)},m:1});ud++}
  if(sn){const sk=D.id+'|'+nu(sn);let X=sMap[sk];if(!X){X=sMap[sk]={id:uid('s'),ex:0};ops.push({p:'secs/'+X.id,v:{deptId:D.id,unitId:U.id,name:sn,incharge:person(sin,sie,si)}});ns++}

 return{ops,bad,nd,ns,ud,us}}

 async cemail(){const e=$('ce').value.trim(),p=$('cp').value;if(!emailOk(e))return $('er').textContent='Enter a valid email.';if(p.length<6)return $('er').textContent='Use a password with at least 6 characters.';try{if(cmode==='up'){const nm=($('cnm').value||'').trim();const r=await CL.auth.createUserWithEmailAndPassword(e,p);if(nm)await r.user.updateProfile({displayName:nm})}else await CL.auth.signInWithEmailAndPassword(e,p)}catch(x){cerr(x)}},

 clogout(){try{localStorage.removeItem('sf_last')}catch(e){}CL.auth.signOut()},logout(){A.clogout()},crefresh(){cloudChooser()},switchco(){try{localStorage.removeItem('sf_last')}catch(e){}cloudChooser('')},

 cjoin(){openSheet(`<h2>Join a company</h2><div class="f"><label><span>Company code (ask your safety moderator)</span><input id="jc" maxlength="10" style="text-transform:uppercase" value="${esc(pendingJoin)}"></label><label><span>Your name</span><input id="jn" maxlength="60" value="${esc(S.user.name||'')}"></label><label><span>Emp ID (optional)</span><input id="ji" maxlength="20"></label><div class="err" id="er"></div><button class="btn" data-a="cjoinok">Send request</button><button class="btn w" data-a="cs">Cancel</button></div>`)},
 async cjoinok(){const c=$('jc').value.trim().toUpperCase(),n=$('jn').value.trim();if(c.length<4)return $('er').textContent='Enter the company code.';if(!n)return $('er').textContent='Enter your name.';
  try{const s=await DB.doc('sf_companies/'+c).get();if(!s.exists)return $('er').textContent='No company with this code.';const u=S.user;const m=await DB.doc('sf_companies/'+c+'/members/'+u.uid).get();if(!m.exists)await DB.doc('sf_companies/'+c+'/members/'+u.uid).set({email:lc(u.email),name:n,empId:($('ji')?$('ji').value.trim().slice(0,20):''),role:'user',status:'pending',unitIds:[],created:TODAY()});await DB.doc('sf_users/'+u.uid).set({email:lc(u.email),name:n,cids:{[c]:true}},{merge:true});closeSheet();pendingJoin='';try{localStorage.removeItem('sf_last')}catch(e){}cloudChooser('Request sent. The company admin or moderator will approve you.')}catch(e){$('er').textContent=CE[e&&e.code]||'Could not send the request.'}},
 cnew(){ui.nlogo='';openSheet(`<h2>Enroll your company</h2><div class="f"><label><span>Company name *</span><input id="nc" maxlength="60"></label><label><span>First unit (plant) name *</span><input id="nu" maxlength="60" placeholder="for example Plant 1"></label><label><span>Your name *</span><input id="nn" maxlength="60" value="${esc(S.user.name||'')}"></label><label><span>Emp ID (optional)</span><input id="ni" maxlength="20"></label><label><span>Company logo (optional)</span><input type="file" id="nlg" accept="image/*" data-ch="nlogo"></label><img id="nlp" class="lgp" alt="" hidden><div class="note">You become the company admin. You can add more units, departments, sections, moderators and safety officers after this.</div><div class="err" id="er"></div><button class="btn" data-a="cnewok">Enroll company</button><button class="btn w" data-a="cs">Cancel</button></div>`)},
 async cnewok(){const nm=$('nc').value.trim(),un=$('nu').value.trim(),me=$('nn').value.trim();if(!nm||!un||!me)return $('er').textContent='Fill all three boxes.';
  try{const u=S.user,c=genCode(),b=DB.batch(),e=lc(u.email);b.set(DB.doc('sf_companies/'+c),{name:nm,ownerUid:u.uid,ownerEmail:e,escDays:3,mailOn:true,created:TODAY(),logo:ui.nlogo||''});ui.nlogo='';b.set(DB.doc('sf_companies/'+c+'/units/u1'),{name:un,code:un.slice(0,3).toUpperCase(),head:person('',''),officer:person('','')});b.set(DB.doc('sf_companies/'+c+'/members/'+u.uid),{email:e,name:me,empId:($('ni')?$('ni').value.trim().slice(0,20):''),role:'admin',status:'active',unitIds:[],created:TODAY()});b.set(DB.doc('sf_users/'+u.uid),{email:e,name:me,cids:{[c]:true}},{merge:true});await b.commit();closeSheet();S.user.name=me;toast('Company enrolled. Your company code is '+c,6000);openCompany(c)}catch(x){$('er').textContent=CE[x&&x.code]||'Could not enroll. Try again.'}}});

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click()}});
