<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, noai, noimageai"><meta name="copyright" content="DUKEKRRISH. All rights reserved."><title>Updating the app</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#eef3f3;color:#0f2a2a;margin:0;padding:24px;text-align:center}.c{max-width:420px;margin:12vh auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 10px #0002}h1{font-size:20px}p{color:#4b6363;line-height:1.5}a{display:inline-block;margin-top:12px;background:#0f766e;color:#fff;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:700}.cr{font-size:12px;color:#6b7f7f;margin-top:18px}</style></head><body><div class="c"><h1 id="t">Updating to the latest version…</h1><p id="m">Clearing the saved copy of the app on this phone. Your data is safe in the cloud.</p><a id="go" href="pm.html" hidden>Open the app</a><div class="cr">&copy; DUKEKRRISH. All rights reserved.</div></div>
<script>
(function(){var q=new URLSearchParams(location.search),to=(q.get('go')||'pm.html').replace(/[^a-z0-9._-]/gi,'');if(!/\.html$/.test(to))to='pm.html';var a=document.getElementById('go');a.href=to;
var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}))}catch(e){}
try{if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(c){return caches.delete(c)}))}))}catch(e){}
Promise.all(p).catch(function(){}).then(function(){document.getElementById('t').textContent='Done. Opening the latest version…';a.hidden=false;setTimeout(function(){location.replace(to+'?u='+Date.now())},900)})})();
</script></body></html>
