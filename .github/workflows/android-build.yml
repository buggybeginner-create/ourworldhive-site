name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub Ubuntu runner already has the Android SDK (ANDROID_HOME);
      # Gradle downloads the exact platform version the project needs.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SmartSMS-debug.apk

      - name: Upload the APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartSMS-debug-apk
          path: SmartSMS-debug.apk
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Put the APK on the Releases page (easy phone download)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Smart SMS debug APK (latest)
          body: |
            Build ${{ github.run_number }} from commit ${{ github.sha }}.
            Download SmartSMS-debug.apk on your phone and open it to install.
            It installs over the previous build; your data is kept.
          files: SmartSMS-debug.apk
          prerelease: true
          make_latest: false
