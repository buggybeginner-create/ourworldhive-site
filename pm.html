<script>
'use strict';
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>window.__PM_TODAY||ymd(new Date());
const pd=s=>{const p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{if(!s)return'';const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const FU={d:'day',w:'week',m:'month',y:'year'};
const freqText=f=>{if(!f||!f.u)return'One time';const n=f.n||1,u=f.u;if(n===1)return{d:'Daily',w:'Weekly',m:'Monthly',y:'Yearly'}[u];if(u==='m'&&n===3)return'Quarterly';if(u==='m'&&n===6)return'Half-yearly';return'Every '+n+' '+FU[u]+'s'};
function nextDue(from,f){const n=f.n||1;return f.u==='d'?addD(from,n):f.u==='w'?addD(from,7*n):f.u==='m'?addM(from,n):addM(from,12*n)}
const uid=p=>p+Math.random().toString(36).slice(2,9);
const norm=c=>{c=String(c||'').trim();if(c.indexOf('@')>=0)return c.toLowerCase();const d=c.replace(/\D/g,'');return d.length>=8?d.slice(-10):''};
const validContact=c=>{const n=norm(c);return n&&(n.indexOf('@')>0?/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(n):n.length>=8)};
let _tt;function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),ms||2400)}
function openSheet(h){$('sin').innerHTML=h;$('sheet').hidden=false;if($('rcal'))rangeInit()}function closeSheet(){$('sheet').hidden=true;$('sin').innerHTML=''}
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}
const csvCell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCsv=rows=>'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCsv(t){t=String(t).replace(/^\uFEFF/,'');const l1=t.split(/\r?\n/)[0]||'',D=(l1.split(';').length>l1.split(',').length)?';':',';const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===D){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
/* ================= storage (demo mode: this browser only) ================= */
const KEY='owh_pm_v1';const OWNER_EMAIL='er.krushnananda@gmail.com';let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.plants)return j}catch(e){}return{v:1,plants:{},session:null}}
let VAREAL=null;
function save(){if(window.OWHVA&&OWHVA.on)return;DUP=null;SDK=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save: the browser storage is full.')}}
const PL=()=>S.plants[S.session.plant];
const ME=()=>PL().members.find(m=>m.id===S.session.member);
const isAdm=r=>r==='admin'||r==='manager';const isMgr=()=>isAdm(ME().role);
const isGid=id=>typeof id==='string'&&id.slice(0,2)==='g_';
const grpOf=id=>(PL().groups||[]).find(x=>x.id===id);
const mineOf=(t,mid)=>{const a=t.assignee;if(!a)return false;if(a===mid)return true;if(isGid(a)){const g=grpOf(a);return !!g&&(g.members||[]).indexOf(mid)>=0}return false};
const grpOpts=t=>{const L=PL().groups||[];return L.length?'<optgroup label="Groups">'+L.map(g=>`<option value="${g.id}" ${t&&t.assignee===g.id?'selected':''}>${esc(g.name)} (group)</option>`).join('')+'</optgroup>':''};
const nrm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function nameLike(a,b){a=nrm(a);b=nrm(b);if(!a||!b)return false;if(a===b)return true;const A=a.split(' '),B=b.split(' '),sh=A.length<=B.length?A:B,lg=A.length<=B.length?B:A;return sh.every(w=>lg.includes(w))&&(sh.length>1||sh[0].length>=4)}
function findMember(name){const L=(PL().members||[]).filter(m=>m.status==='active'&&nameLike(m.name,name));return L.length===1?L[0]:null}
function crewList(l){const c=l.crew&&l.crew.length?l.crew:(l.doneBy?[{m:l.doneBy}]:[]),seen={};return c.map(e=>{if(e.m){const m=(PL().members||[]).find(x=>x.id===e.m);return{id:e.m,name:m?tc(m.name):'Unassigned'}}const m=findMember(e.n);return m?{id:m.id,name:tc(m.name)}:{name:tc(e.n)}}).filter(e=>{const k=e.id||nrm(e.name);if(!k||seen[k])return false;seen[k]=1;return true})}
const crewText=l=>{const L=crewList(l);return L.length?L.map(e=>e.name).join(', '):mName(l.doneBy)};
function respParts(v){return String(v||'').split('|').map(x=>x.trim()).filter(Boolean)}
function respText(l){const seen={};return respParts(l.resp).map(p=>{if(isGid(p)||(PL().members||[]).some(m=>m.id===p))return mName(p);const m=findMember(p);return m?m.name:p}).filter(n=>{const k=nrm(n);if(!k||seen[k])return false;seen[k]=1;return true}).join(', ')}
const tc=s=>String(s==null?'':s).toLowerCase().replace(/(^|[\s.'\u2019(-])([a-z])/g,(m,a,b)=>a+b.toUpperCase()),cap1=s=>String(s==null?'':s).replace(/^([^A-Za-z]*)([a-z])/,(m,a,b)=>a+b.toUpperCase());
const tg=t=>/^SD-\d+$/i.test(t.tag||'')?'':(t.tag||'');
const tagP=t=>(t.cat==='SD'&&/^SD-\d+$/i.test(t.tag||''))?'':esc(t.tag)+' \u2022 ';
const mName=id=>{if(isGid(id)){const g=grpOf(id);return g?'Group: '+g.name:'Unassigned'}const m=PL().members.find(x=>x.id===id);return m?tc(m.name):'Unassigned'};
const secName=id=>{const s=PL().sections.find(x=>x.id===id);return s?cap1(s.name):'No section'};
const typeName=id=>{const s=PL().types.find(x=>x.id===id);return s?cap1(s.name):'No type'};
function ensure(list,name){name=String(name||'').trim();if(!name)return'';let x=list.find(s=>s.name.toLowerCase()===name.toLowerCase());if(!x){x={id:uid('x'),name};list.push(x)}return x.id}
function newPlant(code,name,mgrName,contact){const m={id:uid('m'),name:mgrName,contact:norm(contact),role:'admin',status:'active',joined:TODAY()},own=norm(contact)===OWNER_EMAIL;S.plants[code]={code,name,created:TODAY(),alertDays:7,basis:'done',plan:own?'permanent':'trial',expiresMs:own?0:Date.now()+30*864e5,sections:[],types:[],forms:[],dd:[],firstMgr:m.id,members:[m],tasks:[],logs:[]};return m}
function planInfo(P){const now=window.__PM_NOW||Date.now();if(P.plan==='permanent')return{active:true,label:'Permanent access',left:null};if(P.plan==='suspended')return{active:false,label:'Suspended',left:0};const left=Math.ceil(((P.expiresMs||0)-now)/864e5),act=left>0;return{active:act,label:(P.plan==='trial'?'Free trial':'Subscription')+(act?': '+left+' day'+(left===1?'':'s')+' left':': expired'),left}}
function LOCKED(){const P=S.session&&S.plants[S.session.plant];return !!P&&!planInfo(P).active}
function genCode(){let c;do{c='PM'+Math.random().toString(36).slice(2,6).toUpperCase()}while(S.plants[c]);return c}
/* ================= tasks, status, stats ================= */
function status(t){if(t.closed)return{k:'done',l:'Done',c:'green'};const A=PL().alertDays;
 if(t.cat==='SD'&&(t.sdStart||t.sdEnd)&&!(t.lastDone&&(!t.sdStart||t.lastDone>=t.sdStart))){const td=TODAY(),s0=t.sdStart||t.sdEnd,e0=t.sdEnd||t.sdStart;if(td>e0)return{k:'over',l:'Overdue '+diffDays(td,e0)+'d',c:'red'};if(td>=s0)return{k:'today',l:s0===e0?'Due today':'Today, till '+fmt(e0),c:'amber'};const n=diffDays(s0,td);return n<=A?{k:'soon',l:'Starts in '+n+'d',c:'yellow'}:{k:'ok',l:fmt(s0),c:'green'}}
 const d=diffDays(t.due,TODAY());if(d<0)return{k:'over',l:'Overdue '+(-d)+'d',c:'red'};if(d===0)return{k:'today',l:'Due today',c:'amber'};if(d<=A)return{k:'soon',l:'Due in '+d+'d',c:'yellow'};return{k:'ok',l:fmt(t.due),c:'green'}}
function canUndo(t){return isMgr()||!t.assignee||mineOf(t,S.session.member)}
function canDo(t){return !t.closed&&(isMgr()||!t.assignee||mineOf(t,S.session.member))}
function completeTask(t,doneDate,remark,answers,from){const P=PL(),ms=window.__PM_NOW||Date.now();
 if(t.cat!=='SD'){const ex=P.logs.filter(x=>x.task===t.id&&x.done===doneDate).sort((a,b)=>(b.ms||0)-(a.ms||0))[0];
  if(ex){/* same task, same date: update that entry, do not add another or move the due date again */
   if(remark)ex.remark=remark;if(answers){ex.answers=answers;ex.issues=answers.filter(a=>a.bad).length}
   if(window.__cw){const c=window.__cw;window.__cw=null;if(c.crew&&c.crew.length)ex.crew=c.crew;if(c.mp)ex.mp=c.mp;if(c.resp)ex.resp=c.resp}
   if(from&&from<doneDate)ex.from=from;ex.ms=ms;ex.doneBy=S.session.member;t.lastDone=doneDate;window.__upd=1;save();return}}
 const l={id:uid('l'),task:t.id,tag:t.tag,name:t.name,sec:t.sec,type:t.type,kind:t.kind,cat:t.cat||'R',assignee:t.assignee,doneBy:S.session.member,due:t.due,done:doneDate,remark:remark||'',ms};if(from&&from<doneDate)l.from=from;t.pct=0;if(window.__cw){const c=window.__cw;window.__cw=null;if(c.crew&&c.crew.length)l.crew=c.crew;if(c.mp)l.mp=c.mp;if(c.resp)l.resp=c.resp}
 if(answers){l.answers=answers;l.issues=answers.filter(a=>a.bad).length}P.logs.push(l);t.lastDone=doneDate;
 if(!t.freq||!t.freq.n){t.closed=true;save();return}
 let nx=P.basis==='due'?nextDue(t.due,t.freq):nextDue(doneDate,t.freq);let g=0;while(nx<=doneDate&&g++<400)nx=nextDue(nx,t.freq);t.due=nx;save()}
function fmtTs(ms){if(!ms)return'';const d=new Date(ms);return fmt(ymd(d))+', '+pad(d.getHours())+':'+pad(d.getMinutes())}
function doneState(l){const n=diffDays(l.done,logDue(l));return n<=0?{ok:true,t:'on time',n:0}:{ok:false,t:'late by '+n+' day'+(n===1?'':'s'),n}}
function openTasks(){return PL().tasks.filter(t=>t.active!==false&&!t.closed)}
function routineTasks(){return openTasks().filter(t=>t.cat!=='SD')}
function sdTasks(){return PL().tasks.filter(t=>t.active!==false&&t.cat==='SD')}
function catOf(x){return x.cat==='SD'?'SD':x.kind==='Calibration'?'CAL':'PM'}
const srcOk=(x,s)=>{if(!s||s==='all')return true;const k=catOf(x);return s==='r'?k!=='SD':s==='sd'?k==='SD':s==='cal'?k==='CAL':s==='pm'?k==='PM':true}
function firstMgrId(){const P=PL();return CLOUDON()?P.ownerUid:(P.firstMgr||(P.members.find(m=>isAdm(m.role))||{}).id)}
function isFirstMgr(){return firstMgrId()===S.session.member}
const sdWin=t=>{const s0=t.sdStart||t.sdEnd||t.due,e0=t.sdEnd||t.sdStart||t.due;return[s0,e0]};
function logDue(l){if(l.cat!=='SD')return l.due;const t=PL().tasks.find(x=>x.id===l.task);return t?sdWin(t)[1]:l.due}
function occ(from,to,src){src=src||'all';const P=PL(),td=TODAY(),o=[];const mk=(x,st,tk)=>({sec:x.sec,type:x.type,assignee:x.assignee,kind:x.kind,cat:x.cat,st,hs:(tk||x).hs||'',hb:(tk||x).hb||'',sd:(tk||x).sd||'',e:(tk||x).sdEnd||(tk||x).due||'',dep:(tk||x).dep||'',depOk:!!(tk||x).depOk,mat:(tk||x).mat||''});
 SDK=null;const tm={};P.tasks.forEach(t=>{tm[t.id]=t});
 P.logs.forEach(l=>{if(l.cat==='SD'&&tm[l.task]&&(tm[l.task].nc||isCont(tm[l.task])))return;const d=l.cat==='SD'?l.done:l.due,due=l.cat==='SD'&&tm[l.task]?sdWin(tm[l.task])[1]:l.due;if(srcOk(l,src)&&d>=from&&d<=to)o.push(mk(l,l.done<=due?'ok':'late',l.cat==='SD'?tm[l.task]:null))});
 openTasks().forEach(t=>{if(!srcOk(t,src))return;if((t.cat==='SD')&&(t.nc||isCont(t)||kDone(t)))return;if(t.cat==='SD'){const w=sdWin(t),s0=w[0],e0=w[1];if((e0>=from&&e0<=to)||(s0<=td&&e0>=td&&from<=td&&to>=td))o.push(mk(t,s0<=td?'pend':'up'));return}if(t.due>=from&&t.due<=to)o.push(mk(t,t.due<=td?'pend':'up'))});return o}
function todayOcc(src){src=src||'all';const P=PL(),td=TODAY(),o=[];const mk=(x,st,tk)=>({sec:x.sec,type:x.type,assignee:x.assignee,kind:x.kind,cat:x.cat,st,hs:(tk||x).hs||'',hb:(tk||x).hb||'',sd:(tk||x).sd||'',e:(tk||x).sdEnd||(tk||x).due||'',dep:(tk||x).dep||'',depOk:!!(tk||x).depOk,mat:(tk||x).mat||''});
 SDK=null;const tm0={};P.tasks.forEach(t=>{tm0[t.id]=t});P.logs.forEach(l=>{if(l.cat==='SD'&&tm0[l.task]&&(tm0[l.task].nc||isCont(tm0[l.task])))return;if(srcOk(l,src)&&l.done===td)o.push(mk(l,l.done<=logDue(l)?'ok':'late',l.cat==='SD'?tm0[l.task]:null))});openTasks().forEach(t=>{if(!srcOk(t,src))return;if(t.cat==='SD'&&(t.nc||isCont(t)||kDone(t)))return;if(t.cat==='SD'){if(sdWin(t)[0]<=td)o.push(mk(t,'pend'));return}if(t.due<=td)o.push(mk(t,'pend'))});return o}
function custR(){const td=TODAY();let a=ui.cfrom||addD(td,-29),b=ui.cto||td;if(a>b){const x=a;a=b;b=x}return[a,b]}

const isDup=t=>(DUP||dupBuild()).m[t.id]!=null;
function dupScope(cat,sd){const D=DUP||dupBuild(),out=[];Object.keys(D.g).forEach(k=>{const L=D.g[k].filter(t=>(!cat||catOf(t)===cat)&&(!sd||t.sd===sd));if(L.length>1)out.push(L)});return out}
