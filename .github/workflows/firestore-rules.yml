# Firestore rules for project ourworldhive.
#  - Every change of firestore.rules on main is published to Firebase automatically.
#  - Before publishing, the live rules are read from Firebase. If they were changed by hand in the Firebase console
#    (so they differ from the previous firestore.rules in git), nothing is published and the job stops: no silent overwrite.
#  - Every run also saves the live rules to the branch "live-rules" (file live.rules), so the live version can always be read.
#  - Run it by hand (Actions > Publish Firestore rules > Run workflow) with mode "read" to only read the live rules,
#    or mode "force" to publish even when the console copy was changed by hand.
# Signs in to Google without any key: GitHub proves who it is (Workload Identity Federation) and acts as the service account
# rules-publisher@ourworldhive.iam.gserviceaccount.com, which only has the "Firebase Rules Admin" role.
# A push that changes .github/rules-read.txt only reads the live rules (handy to check them without the Actions page).
# Firebase checks the rules before publishing: if there is a mistake, nothing is published and the live rules stay as they are.
name: Publish Firestore rules
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'read = only read the live rules; publish = normal; force = publish even if changed in the console', default: 'read', type: choice, options: [read, publish, force] }
  push:
    branches: [main]
    paths: ['firestore.rules', '.github/rules-read.txt']
permissions:
  contents: write
  id-token: write
concurrency: { group: firestore-rules, cancel-in-progress: false }
jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      KEY: on
      MODE: ${{ github.event.inputs.mode || 'publish' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Read-only run when only rules-read.txt changed
        if: github.event_name == 'push'
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qx 'firestore.rules'; then echo "firestore.rules changed"; else echo "MODE=read" >> $GITHUB_ENV; fi
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/376058642406/locations/global/workloadIdentityPools/github/providers/ourworldhive-site
          service_account: rules-publisher@ourworldhive.iam.gserviceaccount.com
          token_format: access_token
      - name: Read the live rules from Firebase
        env:
          TOK: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "TOK=$TOK" >> $GITHUB_ENV
          REL=$(curl -sf -H "Authorization: Bearer $TOK" https://firebaserules.googleapis.com/v1/projects/ourworldhive/releases/cloud.firestore)
          RS=$(echo "$REL" | python3 -c 'import json,sys;print(json.load(sys.stdin)["rulesetName"])')
          curl -sf -H "Authorization: Bearer $TOK" "https://firebaserules.googleapis.com/v1/$RS" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["source"]["files"][0]["content"],end="")' > "$RUNNER_TEMP/live.rules"
          echo "Live ruleset: $RS ($(wc -l < "$RUNNER_TEMP/live.rules") lines)"
      - name: Save the live rules to the live-rules branch
        run: |
          cp "$RUNNER_TEMP/live.rules" /tmp/live.rules
          git config user.name "rules-bot"; git config user.email "rules-bot@users.noreply.github.com"
          git fetch origin live-rules || true
          git checkout -B live-rules
          git rm -rq --cached . >/dev/null 2>&1 || true
          cp /tmp/live.rules live.rules && git add -f live.rules
          git commit -qm "live Firestore rules $(date -u +%F' '%H:%M)" || true
          git push -qf origin live-rules
          git checkout -q -f "$GITHUB_SHA"
      - name: Check that nobody changed the rules by hand in the console
        if: env.MODE == 'publish'
        run: |
          norm(){ tr -d '\r' | sed -e 's/[[:space:]]*$//' -e '/^$/d'; }
          if git cat-file -e HEAD~1:firestore.rules 2>/dev/null; then git show HEAD~1:firestore.rules | norm > /tmp/prev; else : > /tmp/prev; fi
          norm < /tmp/live.rules > /tmp/live
          norm < firestore.rules > /tmp/now
          if cmp -s /tmp/live /tmp/now; then echo "Live rules already match firestore.rules. Nothing to publish."; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          if ! cmp -s /tmp/live /tmp/prev; then echo "STOP: the live rules were changed outside GitHub (Firebase console). Nothing published."; diff /tmp/prev /tmp/live | head -40 || true; exit 1; fi
      - name: Publish the rules
        if: env.MODE != 'read' && env.SKIP != '1'
        run: |
          python3 -c 'import json;print(json.dumps({"source":{"files":[{"name":"firestore.rules","content":open("firestore.rules").read()}]}}))' > /tmp/body.json
          # Firebase compiles the rules here; any mistake is printed and nothing is published
          curl -s -o /tmp/rs.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' --data @/tmp/body.json https://firebaserules.googleapis.com/v1/projects/ourworldhive/rulesets > /tmp/code
          if [ "$(cat /tmp/code)" != "200" ]; then echo "The rules have a mistake. Nothing was published:"; cat /tmp/rs.json; exit 1; fi
          RS=$(python3 -c 'import json;print(json.load(open("/tmp/rs.json"))["name"])')
          curl -sf -X PATCH -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d "{\"release\":{\"name\":\"projects/ourworldhive/releases/cloud.firestore\",\"rulesetName\":\"$RS\"}}" https://firebaserules.googleapis.com/v1/projects/ourworldhive/releases/cloud.firestore > /dev/null
          echo "Published $RS"
