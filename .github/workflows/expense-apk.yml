name: Expense Tracker APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-expense/**', '.github/workflows/expense-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build the APK
        working-directory: android-expense
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the file
        run: cp android-expense/app/build/outputs/apk/debug/app-debug.apk Expense-Tracker.apk
      - uses: actions/upload-artifact@v4
        with: { name: Expense-Tracker-apk, path: Expense-Tracker.apk }
      - name: Put it on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: expense-apk
          name: Expense Tracker APK (latest)
          body: Download Expense-Tracker.apk on your Android phone and open it to install. Build ${{ github.run_number }}.
          files: Expense-Tracker.apk
          make_latest: false
