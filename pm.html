<style>

.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:0 14px;min-height:42px;font-weight:700}.btn.s{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}.btn.g{background:#fff;color:var(--p);border:1px solid var(--p)}.btn.r{background:var(--red)}.btn.w{background:#e7eeee;color:var(--ink)}.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--mut)}.chip.on{background:var(--p);color:#fff;border-color:var(--p);font-weight:700}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;min-height:40px}input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);outline-offset:0}

.login{flex:1;min-height:0;overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:12px;max-width:460px;margin:0 auto;width:100%}
.login h1{margin:6px 0 0;font-size:28px}.login p{margin:0;color:var(--mut)}.note{font-size:12.5px;color:var(--mut);line-height:1.45}.ribbon{background:#fff7e0;border:1px solid #f1d98a;border-radius:10px;padding:7px 10px;font-size:12.5px;color:#7a5b00}
.err{color:var(--red);font-size:13.5px;min-height:18px}.ok{color:var(--grn)}.empty{color:var(--mut);text-align:center;padding:18px 8px}.sp{flex:1}
.sc{display:flex;flex-direction:column;gap:8px}
.warnbar{flex:none;background:#fde2e2;color:#8a1c1c;font-size:12.5px;padding:6px 14px;line-height:1.35}
.bd.s{background:#0f766e}.card.hl{border-color:var(--p2);box-shadow:0 0 0 2px #14b8a633}
.pb{height:8px;border-radius:5px;background:#e3ecec;overflow:hidden}.pb i{display:block;height:100%;background:var(--p2)}

.bd.k{background:#0891b2}

.seg{display:flex;gap:6px}.sg{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;font-weight:700;color:var(--mut)}.sg.on{color:#fff}.sg.on[data-v=OK]{background:var(--grn);border-color:var(--grn)}.sg.on[data-v=NOK]{background:var(--red);border-color:var(--red)}.sg.on[data-v=NA]{background:#64748b;border-color:#64748b}
.ck{display:flex;gap:10px;align-items:center;margin:0;font-size:14.5px;color:var(--ink)}.ck input{width:24px;height:24px;min-height:0;flex:none;margin:0}
.irow{display:grid;grid-template-columns:20px 1fr 96px 38px;gap:6px;align-items:center}.irow .inn{color:var(--mut);font-size:12.5px;text-align:center}.irow select{padding:8px 4px;font-size:13px}
.ci2{border:1px solid var(--line);border-radius:10px;padding:7px 9px}.ci2.bad{border-color:var(--red);background:#fff1f1}

video#cam{width:100%;max-height:48dvh;border-radius:12px;background:#000}
[hidden]{display:none!important}
.hero .hl{font-weight:800;color:var(--p);letter-spacing:.2px}.hero h1{margin:6px 0 6px;font-size:27px;line-height:1.15}.hero p{margin:0 0 12px}.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feat div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:12.5px;line-height:1.4;color:var(--mut)}.feat b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}.pricebar{margin-top:10px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:14px;padding:11px 13px;font-weight:700;line-height:1.35}
.cb{position:relative}.cb input{padding-right:40px}.cbx{position:absolute;right:4px;top:3px;width:36px;height:34px;border:0;background:none;font-size:16px;color:var(--mut)}.cbl{position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px #0003;max-height:215px;overflow:auto;margin-top:3px}.cbl button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;font-size:15px;color:var(--ink);border-bottom:1px solid #eef3f3}.cbl button:last-child{border:0}.cbl button.add{color:var(--p);font-weight:700}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px}@media (prefers-reduced-motion:reduce){.sin{animation:none}}
</style></head><body><div id="app" style="display:contents"></div><div class="sheet" id="sheet" hidden><div class="sin" id="sin"></div></div><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>window.__PM_TODAY||ymd(new Date());
const pd=s=>{const p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{if(!s)return'';const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const FU={d:'day',w:'week',m:'month',y:'year'};
const freqText=f=>{const n=f.n||1,u=f.u;if(n===1)return{d:'Daily',w:'Weekly',m:'Monthly',y:'Yearly'}[u];if(u==='m'&&n===3)return'Quarterly';if(u==='m'&&n===6)return'Half-yearly';return'Every '+n+' '+FU[u]+'s'};
function nextDue(from,f){const n=f.n||1;return f.u==='d'?addD(from,n):f.u==='w'?addD(from,7*n):f.u==='m'?addM(from,n):addM(from,12*n)}
const uid=p=>p+Math.random().toString(36).slice(2,9);
const norm=c=>{c=String(c||'').trim();if(c.indexOf('@')>=0)return c.toLowerCase();const d=c.replace(/\D/g,'');return d.length>=8?d.slice(-10):''};
const validContact=c=>{const n=norm(c);return n&&(n.indexOf('@')>0?/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(n):n.length>=8)};
let _tt;function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),ms||2400)}
function openSheet(h){$('sin').innerHTML=h;$('sheet').hidden=false}function closeSheet(){$('sheet').hidden=true;$('sin').innerHTML=''}
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}
const csvCell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCsv=rows=>'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCsv(t){t=String(t).replace(/^\uFEFF/,'');const l1=t.split(/\r?\n/)[0]||'',D=(l1.split(';').length>l1.split(',').length)?';':',';const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===D){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
/* ================= storage (demo mode: this browser only) ================= */
const KEY='owh_pm_v1';const OWNER_EMAIL='er.krushnananda@gmail.com';let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.plants)return j}catch(e){}return{v:1,plants:{},session:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save: the browser storage is full.')}}
const PL=()=>S.plants[S.session.plant];
const ME=()=>PL().members.find(m=>m.id===S.session.member);
const isMgr=()=>ME().role==='manager';
const mName=id=>{const m=PL().members.find(x=>x.id===id);return m?m.name:'Unassigned'};
const secName=id=>{const s=PL().sections.find(x=>x.id===id);return s?s.name:'No section'};
const typeName=id=>{const s=PL().types.find(x=>x.id===id);return s?s.name:'No type'};
function ensure(list,name){name=String(name||'').trim();if(!name)return'';let x=list.find(s=>s.name.toLowerCase()===name.toLowerCase());if(!x){x={id:uid('x'),name};list.push(x)}return x.id}
function newPlant(code,name,mgrName,contact){const m={id:uid('m'),name:mgrName,contact:norm(contact),role:'manager',status:'active',joined:TODAY()},own=norm(contact)===OWNER_EMAIL;S.plants[code]={code,name,created:TODAY(),alertDays:7,basis:'done',plan:own?'permanent':'trial',expiresMs:own?0:Date.now()+30*864e5,sections:[],types:[],forms:[],dd:[],firstMgr:m.id,members:[m],tasks:[],logs:[]};return m}
function planInfo(P){const now=window.__PM_NOW||Date.now();if(P.plan==='permanent')return{active:true,label:'Permanent access',left:null};if(P.plan==='suspended')return{active:false,label:'Suspended',left:0};const left=Math.ceil(((P.expiresMs||0)-now)/864e5),act=left>0;return{active:act,label:(P.plan==='trial'?'Free trial':'Subscription')+(act?': '+left+' day'+(left===1?'':'s')+' left':': expired'),left}}
function LOCKED(){const P=S.session&&S.plants[S.session.plant];return !!P&&!planInfo(P).active}
function genCode(){let c;do{c='PM'+Math.random().toString(36).slice(2,6).toUpperCase()}while(S.plants[c]);return c}
/* ================= tasks, status, stats ================= */
function status(t){if(t.closed)return{k:'done',l:'Done',c:'green'};const d=diffDays(t.due,TODAY()),A=PL().alertDays;if(d<0)return{k:'over',l:'Overdue '+(-d)+'d',c:'red'};if(d===0)return{k:'today',l:'Due today',c:'amber'};if(d<=A)return{k:'soon',l:'Due in '+d+'d',c:'yellow'};return{k:'ok',l:fmt(t.due),c:'green'}}
function canDo(t){return !t.closed&&(isMgr()||!t.assignee||t.assignee===S.session.member)}
function completeTask(t,doneDate,remark,answers){const P=PL(),ms=window.__PM_NOW||Date.now(),l={id:uid('l'),task:t.id,tag:t.tag,name:t.name,sec:t.sec,type:t.type,kind:t.kind,cat:t.cat||'R',assignee:t.assignee,doneBy:S.session.member,due:t.due,done:doneDate,remark:remark||'',ms};
 if(answers){l.answers=answers;l.issues=answers.filter(a=>a.bad).length}P.logs.push(l);t.lastDone=doneDate;
 if(!t.freq||!t.freq.n){t.closed=true;save();return}
 let nx=P.basis==='due'?nextDue(t.due,t.freq):nextDue(doneDate,t.freq);let g=0;while(nx<=doneDate&&g++<400)nx=nextDue(nx,t.freq);t.due=nx;save()}
function fmtTs(ms){if(!ms)return'';const d=new Date(ms);return fmt(ymd(d))+', '+pad(d.getHours())+':'+pad(d.getMinutes())}
function doneState(l){const n=diffDays(l.done,l.due);return n<=0?{ok:true,t:'on time',n:0}:{ok:false,t:'late by '+n+' day'+(n===1?'':'s'),n}}
function openTasks(){return PL().tasks.filter(t=>t.active!==false&&!t.closed)}
function routineTasks(){return openTasks().filter(t=>t.cat!=='SD')}
function sdTasks(){return PL().tasks.filter(t=>t.active!==false&&t.cat==='SD')}
function catOf(x){return x.cat==='SD'?'SD':x.kind==='Calibration'?'CAL':'PM'}
const srcOk=(x,s)=>{if(!s||s==='all')return true;const k=catOf(x);return s==='r'?k!=='SD':s==='sd'?k==='SD':s==='cal'?k==='CAL':s==='pm'?k==='PM':true}
function firstMgrId(){const P=PL();return CLOUDON()?P.ownerUid:(P.firstMgr||(P.members.find(m=>m.role==='manager')||{}).id)}
function isFirstMgr(){return firstMgrId()===S.session.member}
function occ(from,to,src){src=src||'all';const P=PL(),td=TODAY(),o=[];const mk=(x,st)=>({sec:x.sec,type:x.type,assignee:x.assignee,kind:x.kind,cat:x.cat,st});
 P.logs.forEach(l=>{if(srcOk(l,src)&&l.due>=from&&l.due<=to)o.push(mk(l,l.done<=l.due?'ok':'late'))});
 openTasks().forEach(t=>{if(srcOk(t,src)&&t.due>=from&&t.due<=to)o.push(mk(t,t.due<=td?'pend':'up'))});return o}
function todayOcc(src){src=src||'all';const P=PL(),td=TODAY(),o=[];const mk=(x,st)=>({sec:x.sec,type:x.type,assignee:x.assignee,kind:x.kind,cat:x.cat,st});
 P.logs.forEach(l=>{if(srcOk(l,src)&&l.done===td)o.push(mk(l,l.done<=l.due?'ok':'late'))});openTasks().forEach(t=>{if(srcOk(t,src)&&t.due<=td)o.push(mk(t,'pend'))});return o}
function periodRange(p){const td=TODAY();if(p==='today')return null;if(p==='7')return[addD(td,-6),td];if(p==='month')return[td.slice(0,8)+'01',td];if(p==='30')return[addD(td,-29),td];return['0000-01-01',td]}
function getOcc(p,src){const r=periodRange(p);return r?occ(r[0],r[1],src):todayOcc(src)}
function tally(o){const t={target:0,done:0,ok:0,late:0,pend:0,up:0};o.forEach(x=>{if(x.st==='up'){t.up++;return}t.target++;if(x.st==='ok'){t.ok++;t.done++}else if(x.st==='late'){t.late++;t.done++}else t.pend++});t.pct=t.target?Math.round(t.ok*100/t.target):100;return t}
function groupBy(o,fn,nameFn){const g={};o.forEach(x=>{const k=fn(x)||'-';(g[k]=g[k]||[]).push(x)});return Object.keys(g).map(k=>Object.assign({name:nameFn(k)},tally(g[k]))).filter(r=>r.target>0).sort((a,b)=>a.pct-b.pct||b.target-a.target)}
function alertsFor(){const me=ME();return openTasks().filter(t=>{const s=status(t);return(s.k==='over'||s.k==='today'||s.k==='soon')&&(isMgr()||t.assignee===me.id)}).sort((a,b)=>a.due<b.due?-1:1)}

/* Small QR code generator (byte mode, error correction M, versions 1 to 10). */
const QR=(function(){
 const ECC=[10,16,26,18,24,16,18,22,22,26],BLK=[1,1,1,2,2,4,4,4,5,5];
 function rawModules(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
 const EXP=new Array(512),LOG=new Array(256);(function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255]})();
 const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
 function gen(d){let r=[1];for(let i=0;i<d;i++){const n=new Array(r.length+1).fill(0);for(let j=0;j<r.length;j++){n[j]^=r[j];n[j+1]^=mul(r[j],EXP[i])}r=n}return r}
 function rs(data,div){const rem=new Array(div.length-1).fill(0);data.forEach(b=>{const f=b^rem.shift();rem.push(0);if(f)for(let i=0;i<rem.length;i++)rem[i]^=mul(div[i+1],f)});return rem}
 function utf8(s){return Array.from(unescape(encodeURIComponent(s)),c=>c.charCodeAt(0))}
 function make(text){
  const bytes=utf8(text);let ver=1;for(;ver<=10;ver++){const cap=Math.floor(rawModules(ver)/8)-ECC[ver-1]*BLK[ver-1];if(4+(ver<=9?8:16)+bytes.length*8<=cap*8)break}
  if(ver>10)throw new Error('Text is too long for the QR code');
  const size=ver*4+17,cap=Math.floor(rawModules(ver)/8)-ECC[ver-1]*BLK[ver-1],bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
  put(4,4);put(bytes.length,ver<=9?8:16);bytes.forEach(b=>put(b,8));put(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);for(let p=0xEC;bits.length<cap*8;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
  const nb=BLK[ver-1],el=ECC[ver-1],raw=Math.floor(rawModules(ver)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb),div=gen(el),blocks=[];let k=0;
  for(let i=0;i<nb;i++){const dat=data.slice(k,k+sl-el+(i<ns?0:1));k+=dat.length;const ecc=rs(dat,div);if(i<ns)dat.push(0);blocks.push(dat.concat(ecc))}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)all.push(b[i])});
  const M=Array.from({length:size},()=>new Array(size).fill(false)),F=Array.from({length:size},()=>new Array(size).fill(false));
  const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
  for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)setF(x,y,d!==2&&d!==4)}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  const al=[];if(ver>1){const n=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(n*2-2))*2;al.push(6);for(let p=size-7;al.length<n;p-=step)al.splice(1,0,p)}
  al.forEach((cx,i)=>al.forEach((cy,j)=>{if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
  const fmt=(mask)=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;

   for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=G[y][x];if(c===G[y][x+1]&&c===G[y+1][x]&&c===G[y+1][x+1])p+=3}
   let dark=0;G.forEach(r=>r.forEach(v=>{if(v)dark++}));p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p}
  let best=null,bm=0,bp=1e9;for(let m=0;m<8;m++){const G=M.map((r,y)=>r.map((v,x)=>F[y][x]?v:v!==masks[m](x,y)));
   const save=M.map(r=>r.slice());for(let y=0;y<size;y++)for(let x=0;x<size;x++)M[y][x]=G[y][x];fmt(m);const H=M.map(r=>r.slice());for(let y=0;y<size;y++)for(let x=0;x<size;x++)M[y][x]=save[y][x];const pp=penalty(H);if(pp<bp){bp=pp;best=H;bm=m}}
  return{size,get:(x,y)=>best[y][x],mask:bm,version:ver}}

function taskRow(t,withBtn){const s=status(t),k=t.kind==='Calibration'?'c':t.kind==='PM'?'p':t.cat==='SD'?'s':t.kind==='Checklist'?'k':'';return`<div class="row ${s.c}" data-a="tdet" data-id="${t.id}" role="button" tabindex="0"><div class="m"><b>${esc(t.tag)} \u2022 ${esc(t.name)}</b><small><span class="bd ${k}">${t.cat==='SD'?'SD':t.kind==='Checklist'?'CHK':t.kind==='Calibration'?'CAL':t.kind==='PM'?'PM':esc(t.kind.slice(0,4).toUpperCase())}</span>${esc(secName(t.sec))} \u00B7 ${esc(mName(t.assignee))}</small></div><div class="s ${s.c}">${esc(s.l)}</div>${withBtn&&canDo(t)?`<button class="btn s" data-a="done" data-id="${t.id}" aria-label="Mark done">\u2713</button>`:''}</div>`}
/* ---- Today ---- */
function vToday(){const o=todayOcc('all'),t=tally(o),mo=tally(getOcc('month','all')),list=alertsFor();
 $('view').innerHTML=`<div class="tiles"><div class="tile blu"><b>${t.target}</b><small>Target today</small></div><div class="tile grn"><b>${t.done}</b><small>Done today</small></div><div class="tile ${t.pend?'red':'grn'}"><b>${t.pend}</b><small>Pending (due or overdue)</small></div><div class="tile ${mo.pct<80?'amb':'grn'}"><b>${mo.pct}%</b><small>Compliance this month</small></div></div>
 <div class="h"><span>${isMgr()?'Needs attention':'My tasks'}</span><small>${list.length} open</small></div><div class="list" id="tl"></div><div id="tp"></div>`;drawToday()}

 <div class="chips">${[['all','All'],['over','Overdue'],['soon','Due soon'],['ok','OK']].map(c=>`<button class="chip ${f.st===c[0]?'on':''}" data-a="fst" data-v="${c[0]}">${c[1]}</button>`).join('')}<button class="chip ${f.mine?'on':''}" data-a="fmine">Mine</button></div>
 <div class="g3"><select id="fs" aria-label="Section"><option value="">All sections</option>${P.sections.map(s=>`<option value="${s.id}" ${f.sec===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select id="ft" aria-label="Type"><option value="">All types</option><option value="-" ${f.type==='-'?'selected':''}>No type</option>${P.types.map(s=>`<option value="${s.id}" ${f.type===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select id="fc" aria-label="Work category"><option value="">All work</option>${[['CAL','Calibration'],['PM','PM'],['SD','Shutdown']].map(c=>`<option value="${c[0]}" ${f.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
 <div class="list" id="tl"></div><div id="tp"></div>`;
 $('fq').oninput=e=>{ui.f.q=e.target.value;ui.pg.tasks=0;drawTasks()};$('fs').onchange=e=>{ui.f.sec=e.target.value;ui.pg.tasks=0;drawTasks()};$('ft').onchange=e=>{ui.f.type=e.target.value;ui.pg.tasks=0;drawTasks()};$('fc').onchange=e=>{ui.f.cat=e.target.value;ui.pg.tasks=0;drawTasks()};drawTasks()}
function filtered(){const f=ui.f,q=f.q.trim().toLowerCase();return openTasks().filter(t=>{const s=status(t);if(f.cat&&catOf(t)!==f.cat)return false;if(q&&(t.tag+' '+t.name).toLowerCase().indexOf(q)<0)return false;if(f.sec&&t.sec!==f.sec)return false;if(f.type==='-'){if(t.type)return false}else if(f.type&&t.type!==f.type)return false;if(f.mine&&t.assignee!==S.session.member)return false;if(f.st==='over'&&!(s.k==='over'||s.k==='today'))return false;if(f.st==='soon'&&s.k!=='soon')return false;if(f.st==='ok'&&s.k!=='ok')return false;return true}).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:a.tag<b.tag?-1:1)}
function drawTasks(){const list=filtered(),per=rowsFit(60,395),pg=pager('tasks',list.length,per);$('tl').innerHTML=list.slice(pg.from,pg.to).map(t=>taskRow(t,true)).join('')||`<div class="empty card">${openTasks().length?'No task matches these filters.':isMgr()?'No tasks yet. Tap + Add, or import an Excel sheet in Manage.':'No tasks yet.'}</div>`;$('tp').innerHTML=pg.html}

 $('view').innerHTML=`<div class="chips">${[['today','Today'],['7','7 days'],['month','This month'],['30','30 days'],['all','All time']].map(c=>`<button class="chip ${per===c[0]?'on':''}" data-a="sp" data-v="${c[0]}">${c[1]}</button>`).join('')}<button class="chip" style="border-color:var(--p);color:var(--p);font-weight:700" data-a="share">\u2B06 Share</button></div>
 <div class="card" style="display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:2px;padding:8px 4px"><div><b style="font-size:20px">${t.target}</b><br><small class="note">Target</small></div><div><b style="font-size:20px;color:var(--grn)">${t.ok}</b><br><small class="note">On time</small></div><div><b style="font-size:20px;color:var(--amb)">${t.late}</b><br><small class="note">Late</small></div><div><b style="font-size:20px;color:var(--red)">${t.pend}</b><br><small class="note">Pending</small></div><div><b style="font-size:20px;color:var(--p)">${t.pct}%</b><br><small class="note">Compliance</small></div></div>
 <div class="chips">${[['sec','Section'],['per','Person'],['type','Type']].map(c=>`<button class="chip ${ui.sg===c[0]?'on':''}" data-a="sg" data-v="${c[0]}">${c[1]}</button>`).join('')}<span class="sp"></span>${[['all','All'],['cal','Calibration'],['pm','PM'],['sd','Shutdown']].map(c=>`<button class="chip ${ui.src===c[0]?'on':''}" data-a="ssrc" data-v="${c[0]}">${c[1]}</button>`).join('')}</div><div class="card" style="padding:6px 8px"><div id="tl"></div><div id="tp"></div></div>
 <div class="note">${per==='today'?'Target today = tasks due today or earlier that are still open, plus tasks finished today. ':''}Compliance = tasks finished on or before their due date, divided by the target. Upcoming tasks are not counted.</div>`;drawStats()}
function statRows(){const o=getOcc(ui.sp,ui.src),P=PL(),g=ui.sg==='sec'?groupBy(o,x=>x.sec,k=>secName(k)):ui.sg==='per'?groupBy(o,x=>x.assignee,k=>mName(k)):groupBy(o,x=>x.type,k=>typeName(k));return g}
function drawStats(){const g=statRows(),per=rowsFit(40,500),pg=pager('stats',g.length,per);
 $('tl').innerHTML=g.length?`<table class="tbl"><thead><tr><th>${ui.sg==='sec'?'Section':ui.sg==='per'?'Person':'Type'}</th><th>Target</th><th>Done</th><th>Late</th><th>Pend</th><th>%</th></tr></thead><tbody>${g.slice(pg.from,pg.to).map(r=>`<tr><td>${esc(r.name)}</td><td>${r.target}</td><td>${r.done}</td><td>${r.late}</td><td>${r.pend}</td><td><b style="color:${r.pct>=90?'var(--grn)':r.pct>=70?'var(--amb)':'var(--red)'}">${r.pct}%</b></td></tr><tr><td colspan="6" style="padding:0 0 4px;border:0"><div class="bar"><i class="${r.pct>=90?'':r.pct>=70?'m':'l'}" style="width:${r.pct}%"></i></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No tasks in this period.</div>';$('tp').innerHTML=pg.html}

 else if(k==='sec'||k==='typ'){const L=k==='sec'?P.sections:P.types,w=k==='sec'?'section':'instrument type';b.innerHTML=`<div style="display:flex;gap:8px"><input id="nl" maxlength="40" placeholder="New ${w} name" aria-label="New ${w}"><button class="btn" data-a="ladd">Add</button></div>`+(L.map(x=>`<div class="card" style="display:flex;align-items:center;gap:8px"><div style="flex:1"><b>${esc(x.name)}</b><div class="note">${openTasks().filter(t=>(k==='sec'?t.sec:t.type)===x.id).length} tasks</div></div><button class="btn s w" data-a="lren" data-id="${x.id}">Rename</button><button class="btn s r" data-a="ldel" data-id="${x.id}" aria-label="Delete">\u00D7</button></div>`).join('')||`<div class="empty card">No ${w}s yet. They are also created automatically when you import a sheet.</div>`)}
 else if(k==='imp'){b.innerHTML=`<div class="card"><b>Create tasks from an Excel or CSV sheet</b><div class="note" style="margin:4px 0 8px">Columns: Tag, Name, Section, Type, Kind (must be Calibration or PM), Frequency (for example Monthly, 3 months, 90 days), Next due date, Assignee (name, email or mobile), Notes. Sections and types you write are created for you. A row whose Tag and Kind already exist updates that task.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g s" data-a="tpl">Download template</button><label class="btn s" style="display:inline-flex;align-items:center;margin:0;color:#fff;font-size:13.5px">Choose file<input id="impf" type="file" accept=".csv,.xlsx,.xls,text/csv" hidden></label></div></div><div id="ip"></div>`;$('impf').onchange=e=>importFile(e.target.files[0])}
 else if(k==='chk'){drawForms(b)}
 else if(k==='qr'){const n=instruments().length;b.innerHTML=`<div class="card"><b>QR labels for your instruments</b><div class="note" style="margin:4px 0 8px">Every instrument (tag) has its own permanent QR code. It never changes, so you can print it once and stick it on the instrument. When a user scans it with the phone camera or with the Scan button in this app, that instrument opens with its calibration and PM tasks.<br><b>${n}</b> instrument${n===1?'':'s'} in your list.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn s" data-a="qrall" ${n?'':'disabled'}>Print all labels</button></div></div>`}
 else if(k==='exp'){b.innerHTML=`<div class="card"><b>Export (opens in Excel)</b><div class="note" style="margin:4px 0 8px">Download your data as CSV files.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g s" data-a="ex" data-v="tasks">All tasks</button><button class="btn g s" data-a="ex" data-v="logs">History</button><button class="btn g s" data-a="ex" data-v="stats">Statistics (${ui.sp==='today'?'today':ui.sp==='7'?'7 days':ui.sp==='month'?'this month':ui.sp==='30'?'30 days':'all time'})</button></div></div>

function histLine(l){const st=doneState(l),when=fmtTs(l.ms)||fmt(l.done),pre=l.answers?`<div class="note" data-a="lview" data-id="${l.id}" role="button" tabindex="0" style="cursor:pointer;text-decoration:underline dotted">`:'<div class="note">';return pre+esc(when)+' \u2022 '+esc(mName(l.doneBy))+' \u2022 '+(st.ok?'<span class="ok">on time</span>':'<span style="color:var(--amb)">'+esc(st.t)+'</span>')+(l.issues?' \u2022 <span style="color:var(--red)">'+l.issues+' issue'+(l.issues===1?'':'s')+'</span>':'')+(l.remark?' \u2022 '+esc(l.remark):'')+'</div>'}
function tdet(id){const t=PL().tasks.find(x=>x.id===id);if(!t)return;const s=status(t),h=PL().logs.filter(l=>l.task===id).sort((a,b)=>(b.ms||0)-(a.ms||0)||(a.done<b.done?1:-1)).slice(0,5);
 openSheet(`<h2>${esc(t.tag)} \u2022 ${esc(t.name)}</h2><div class="note" style="font-size:14px;line-height:1.7"><b>${esc(t.kind)}</b> \u00B7 ${esc(freqText(t.freq))}<br>Section: ${esc(secName(t.sec))} \u00B7 Type: ${esc(typeName(t.type))}<br>Assigned to: ${esc(mName(t.assignee))}${formLine(t)}<br>Next due: <b style="color:var(--${s.c==='green'?'grn':s.c==='red'?'red':s.c==='amber'?'amb':'yel'})">${fmt(t.due)} (${esc(s.l)})</b>${t.notes?'<br>Notes: '+esc(t.notes):''}</div>
 <div class="h" style="margin-top:8px"><span>Recent history</span></div>${h.length?h.map(l=>histLine(l)).join(''):'<div class="note">Not done yet.</div>'}
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${canDo(t)?`<button class="btn" data-a="done" data-id="${t.id}">${formFor(t)&&formFor(t).items.length?'Fill checklist and mark done':'Mark done'}</button>`:''}${t.cat==='SD'?'':`<button class="btn g" data-a="qr" data-tag="${esc(t.tag)}">QR</button>`}${isMgr()?`<button class="btn g" data-a="tedit" data-id="${t.id}">Edit</button><button class="btn r" data-a="tdel" data-id="${t.id}">Delete</button>`:''}<button class="btn w" data-a="cs">Close</button></div>`)}
function doneSheet(id){const t=PL().tasks.find(x=>x.id===id);if(!t)return;openSheet(`<h2>Mark done</h2><div class="note" style="margin-bottom:8px">${esc(t.tag)} \u2022 ${esc(t.name)}<br>Due: ${fmt(t.due)}</div><div class="f"><label><span>Date done</span><input id="dd" type="date" value="${TODAY()}" max="${TODAY()}"></label><label><span>Remark (optional)</span><input id="dr" maxlength="120" placeholder="for example calibrated, within limits"></label><button class="btn" data-a="doneok" data-id="${t.id}">Confirm</button><button class="btn w" data-a="cs">Cancel</button></div>`)}
function taskForm(id){const P=PL(),t=id?P.tasks.find(x=>x.id===id):null,f=t?t.freq:{n:1,u:'m'},pre=[['d1','Daily',1,'d'],['w1','Weekly',1,'w'],['m1','Monthly',1,'m'],['m3','Quarterly',3,'m'],['m6','Half-yearly',6,'m'],['y1','Yearly',1,'y']],cur=(pre.find(p=>p[2]===f.n&&p[3]===f.u)||['x'])[0];
 openSheet(`<h2>${t?'Edit task':'Add task'}</h2><div class="f"><div class="g2"><label><span>Tag / ID *</span><input id="tg" maxlength="30" value="${esc(t?t.tag:'')}"></label><label><span>Kind</span><select id="kd">${['Calibration','PM','Other'].map(k=>`<option ${t&&t.kind===k?'selected':''}>${k}</option>`).join('')}</select></label></div>
 <label><span>Name *</span><input id="nm" maxlength="60" value="${esc(t?t.name:'')}"></label>
 <div class="g2"><label><span>Section</span><input id="sc" list="dsec" maxlength="40" value="${esc(t?secName(t.sec):'')}" placeholder="pick or type"><datalist id="dsec">${P.sections.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist></label><label><span>Instrument type</span><input id="ty" list="dty" maxlength="40" value="${esc(t?typeName(t.type):'')}" placeholder="pick or type"><datalist id="dty">${P.types.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist></label></div>
 <div class="g3"><label style="grid-column:span 3"><span>Frequency</span><select id="fr">${pre.map(p=>`<option value="${p[0]}" ${cur===p[0]?'selected':''}>${p[1]}</option>`).join('')}<option value="x" ${cur==='x'?'selected':''}>Custom</option></select></label><label id="cw" ${cur==='x'?'':'hidden'}><span>Every</span><input id="cn" type="number" min="1" max="999" value="${f.n}" inputmode="numeric"></label><label id="cu" ${cur==='x'?'':'hidden'} style="grid-column:span 2"><span>Unit</span><select id="cx">${[['d','days'],['w','weeks'],['m','months'],['y','years']].map(u=>`<option value="${u[0]}" ${f.u===u[0]?'selected':''}>${u[1]}</option>`).join('')}</select></label></div>
 <div class="g2"><label><span>Next due date *</span><input id="dd" type="date" value="${t?t.due:TODAY()}"></label><label><span>Assigned to</span><select id="as"><option value="">Unassigned</option>${P.members.filter(m=>m.status==='active').map(m=>`<option value="${m.id}" ${t&&t.assignee===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label></div>
 <label><span>Notes</span><input id="nt" maxlength="120" value="${esc(t?t.notes:'')}"></label><div class="err" id="er"></div><button class="btn" data-a="tsave" data-id="${t?t.id:''}">${t?'Save changes':'Add task'}</button><button class="btn w" data-a="cs">Cancel</button></div>`);
