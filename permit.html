 const parts=p=>p.split('/'),cp=v=>JSON.parse(JSON.stringify(v)),emit=()=>subs.slice().forEach(f=>f());

 const watch=fn=>{subs.push(fn);setTimeout(fn,0);return()=>{subs=subs.filter(x=>x!==fn)}};
 const colr=p=>({path:p,orderBy(){return colr(p)},limit(){return colr(p)},onSnapshot:cb=>watch(()=>{const docs=cdocs(p);cb({docs,size:docs.length,forEach:f=>docs.forEach(f)})}),get:()=>Promise.resolve((()=>{const docs=cdocs(p);return{docs,size:docs.length,forEach:f=>docs.forEach(f)}})())});
 return{doc:p=>({path:p,set:(v,o)=>{setD(p,v,o);persist();emit();return Promise.resolve()},update:v=>{try{updD(p,v);persist();emit();return Promise.resolve()}catch(e){return Promise.reject(e)}},delete:()=>{delete load()[p];persist();emit();return Promise.resolve()},get:()=>Promise.resolve(dsnap(p)),onSnapshot:(cb)=>watch(()=>cb(dsnap(p)))}),
  collection:colr,
  batch:()=>{const ops=[];return{set:(r,v,o)=>{ops.push(()=>setD(r.path,v,o))},update:(r,v)=>{ops.push(()=>updD(r.path,v))},delete:r=>{ops.push(()=>{delete load()[r.path]})},commit:()=>{try{ops.forEach(f=>f());persist();emit();return Promise.resolve()}catch(e){return Promise.reject(e)}}}},

 ${p.gas?gasBlock(p.gas&&typeof p.gas==='object'?p.gas:null):''}
 <label class="ck"><input type="checkbox" id="ve"><span>Electrical checks done (de-energised, proved dead where needed)</span></label><label class="ck"><input type="checkbox" id="vm"><span>Mechanical checks done (valves, blinds, rotating parts secured)</span></label><label class="ck"><input type="checkbox" id="vt"><span>TBT (Tool Box Talk) confirmed with engaged persons${p.tbt?'':' (requester said NO)'}</span></label>

 if(!isoReady(p))return er('Isolation clearance is still pending or refused.');

 if(!$('ve').checked||!$('vm').checked)return er('Tick the electrical and mechanical checks.');if(!$('vt').checked)return er('Confirm the TBT.');
 await upd(p,{st:'verified',gas,tbt:1,vr:{by:S.user.uid,n:ME().name,at:NOW(),el:1,me:1,tbt:1,note:val('vn')}},'Verified',val('vn'))};

 const ino=isoNo(p,k);
 const qd=F.q.map(q=>`<dt>${q[1]}</dt><dd>${esc((i.q||{})[q[0]]||(q[0]==='pt'?i.t:'')||'-')}</dd>`).join('');
 const dd=i.det?F.d.map(q=>`<dt>${q[1]}</dt><dd>${q[2]==='chk'?(i.det[q[0]]?'<span class="ok">YES</span>':'NO'):esc(i.det[q[0]]||'-')}</dd>`).join(''):'';

 else if(phase==='ret'&&i.st==='done'&&!i.ret)form=`<div class="h">Remove isolation</div><label class="ck"><input type="checkbox" id="irc"><span>Work is over. Lock and tag removed, equipment normalised, safe to restore.</span></label><div class="err" id="ier"></div><button class="btn g" data-a="isoret" data-id="${esc(p.id)}" data-k="${k}">REMOVE ISOLATION</button>`;

 const fnd=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const m=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,m!==2&&m!==4)}};fnd(3,3);fnd(N-4,3);fnd(3,N-4);

 Rf(0,0,W,66,'#b45309');Rf(0,66,W,5,'#111827');T('ENERGY ISOLATION CERTIFICATE',M,27,16,1,'#ffffff');T('Lockout - Tagout record  |  '+plantName(),M,43,9.5,0,'#fde68a');T('Permit '+p.no,M,58,10,1,'#ffffff');const st='Isolations: '+rows.filter(x=>p.iso[x[0]].st==='done').length+' of '+rows.length+' done';T(st,W-M-pw(st,10,1),58,10,1,'#ffffff');K.y=80;
 head('Permit details');kv4('Permit no',p.no,'Permit type',(TYPES[p.type]||{}).n);kv4('Equipment',p.equip,'Area',p.area);kv1('Activity',p.act);kv4('Permit holder',whoIs(p.by,p.byName),'Work supervisor',p.sup);kv4('Valid from',fmtT(tms(p.start)),'Valid till',fmtT(tms(p.end)));kv4('Permit status',slabel(p),'Persons at work',p.pc+' ('+String(p.persons||'').split('\n').join(', ')+')');
 rows.forEach((x,n)=>{const i=p.iso[x[0]],k=x[0],det=i.det||{};
  head('Isolation '+(n+1)+': '+isoNo(p,k)+'   '+x[1]);
  kv4('Isolation no',isoNo(p,k),'Authority',isoDept(p,k)+' authorised person');
  kv4('Energy type',ENERGY[k],'Status',i.st==='done'?'ISOLATION DONE':i.st==='na'?'NOT REQUIRED':i.st==='refused'?'REFUSED':'AWAITING');
  kv1('Requested by',whoIs(p.by,p.byName)+' on '+fmtT(p.ts));kv1('Requester details',reqTxt(k,i));
  if(i.st==='done'){kv4('Lock no',det.lk,'Key no / kept with',det.kn);kv1('Isolation point',det.pt||i.t);kv1('Isolator checks',detTxt(k,i));kv4('Isolated by',whoIs(i.byId,i.by),'Date and time',fmtT(i.at))}
  else if(i.st){kv1('Remarks',(i.rs||'-')+(i.by?'  ('+whoIs(i.byId,i.by)+' '+fmtT(i.at)+')':''))}
  kv4('Isolation removed',i.ret?'YES':(i.st==='done'?'PENDING':'-'),'Removed by and time',i.ret?(whoIs(null,i.retBy)+' '+fmtT(i.ret)):'-');
  tbl(['Signature','Name','Sign','Date and time'],[130,150,127,120],[['Isolator (authorised)',i.by||'',' ',i.at?fmtT(i.at):''],['Permit holder',p.byName,' ',' '],['Removal (authorised)',i.retBy||'',' ',i.ret?fmtT(i.ret):'']])});
 head('Verification and approval');const au=[];if(p.vr)au.push(['Verified (Operation)',whoIs(p.vr.by,p.vr.n),fmtT(p.vr.at),p.vr.note]);if(p.ap)au.push(['Approved (Shift Incharge)',whoIs(p.ap.by,p.ap.n),fmtT(p.ap.at),p.ap.note]);if(!au.length)au.push(['Pending','-','-','-']);tbl(['Stage','Name (department, ID)','Date and time','Remarks'],[120,150,100,157],au);
 note('Lockout-tagout practice: each energy source is isolated, locked and tagged, stored energy is released, and absence of energy is verified before work starts (for example OSHA 1910.147, ISO 45001 practice). Only the person who applied a lock or tag, or an authorised person under site procedure, removes it. The site procedure and legal rules decide.');
 return{name:fileName(p,'ISOLATION'),bytes:K.finish(footer(K,p,'ENERGY ISOLATION CERTIFICATE'))}}
function makeTagPdf(p,keys){const W=298,H=420,M=14,th={hd:'#dc2626',lab:'#fee2e2',th:'#fecaca',ln:'#dc2626'},K=newPdf(W,H,M,th),{T,TC,Rf,Rs,Ci,rowC,lab,vv}=K;
 keys.forEach((k,n)=>{const i=p.iso[k],det=i.det||{};if(n)K.np();
  Rf(0,0,W,74,'#dc2626');Ci(W/2-26,17,7,'#ffffff');qrDraw(K,qrUrl(p),W-M-62,6,62);TC('DANGER',W/2-26,57,30,1,'#ffffff');Rf(0,74,W,24,'#111827');TC('DO NOT OPERATE - LOCKED OUT',W/2,90,11,1,'#ffffff');
  TC(isoNo(p,k),W/2,118,12,1,'#111827');TC('Permit '+p.no,W/2,131,8.5,0,'#475569');
  K.y=138;const ws=[84,W-2*M-84];
  [['Equipment / tag',p.equip||p.area],['Isolation point',det.pt||i.t],['Energy type',ENERGY[k]],['LOCK NO',det.lk],['KEY NO / KEPT WITH',det.kn],['Isolated by',whoIs(i.byId,i.by)],['Date and time',fmtT(i.at)],['Permit holder',whoIs(p.by,p.byName)],['Permit valid till',fmtT(tms(p.end))]].forEach(r=>rowC([lab(r[0]),vv(r[1],null,/LOCK|KEY/.test(r[0]))],ws));
  Rs(M,H-70,W-2*M,52,'#dc2626',1.3);T('REMOVAL (authorised person only)',M+6,H-58,8,1,'#dc2626');T('Removed by: ______________________   Sign: ____________',M+6,H-42,7.5,0,'#111827');T('Date / time: ______________________',M+6,H-28,7.5,0,'#111827');
  TC('(c) DUKEKRRISH. All rights reserved.  E-Permit',W/2,H-6,6.5,0,'#64748b')});
 return{name:fileName(p,'LOTO-TAGS'),bytes:K.finish()}}
A.pdf=d=>{const p=getP(d.id);try{const f=makePdf(p);dl(f.name,'application/pdf',f.bytes);toast('PDF saved: '+f.name,4000)}catch(e){console.error(e);toast('Could not make the PDF.')}};
A.pdfiso=d=>{const p=getP(d.id);if(!isoReq(p).length)return toast('This permit has no isolation.');try{const f=makeIsoPdf(p);dl(f.name,'application/pdf',f.bytes);toast('PDF saved: '+f.name,4000)}catch(e){console.error(e);toast('Could not make the PDF.')}};
A.pdftag=d=>{const p=getP(d.id),keys=d.k?[d.k]:isoReq(p).map(x=>x[0]).filter(k=>p.iso[k].st==='done');if(!keys.length)return toast('No isolation is done yet, so there is no tag to print.',3500);try{const f=makeTagPdf(p,keys);dl(f.name,'application/pdf',f.bytes);toast('Tag PDF saved: '+f.name,4000)}catch(e){console.error(e);toast('Could not make the PDF.')}};
boot();
</script></body></html>
