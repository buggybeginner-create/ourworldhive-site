name: Nifty Pulse Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-niftypulse/**', '.github/workflows/niftypulse-app.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIARY_KEY_PASS: ${{ secrets.DIARY_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build the APK (for your phone and the website download)
        working-directory: android-niftypulse
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build-log.txt; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Build the Play Store bundle (.aab)
        if: env.DIARY_KEY_PASS != ''
        working-directory: android-niftypulse
        run: gradle bundleRelease --no-daemon --stacktrace 2>&1 | tee -a ../build-log.txt; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Name the files
        run: |
          cp android-niftypulse/app/build/outputs/apk/debug/app-debug.apk Nifty-Pulse.apk
          if [ -n "$DIARY_KEY_PASS" ]; then cp android-niftypulse/app/build/outputs/bundle/release/app-release.aab Nifty-Pulse-PlayStore.aab; fi
          ls -la *.apk *.aab 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: Nifty-Pulse-app, path: 'Nifty-Pulse*' }
      - name: Put them on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: niftypulse-app
          name: Nifty Pulse Android app (latest)
          body: |
            Build ${{ github.run_number }}.
            Nifty-Pulse.apk: open it on your Android phone to install (also linked from ourworldhive.com/widgets.html).
            Nifty-Pulse-PlayStore.aab: upload this in Google Play Console when you publish.
          files: Nifty-Pulse*
          make_latest: false
      - name: Save the error log (only when the build fails)
        if: failure()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rq --cached . >/dev/null 2>&1 || true
          tail -c 60000 build-log.txt > niftypulse-build-log.txt || echo "no log" > niftypulse-build-log.txt
          git add -f niftypulse-build-log.txt
          git commit -qm "nifty pulse build log ${{ github.run_number }}"
          git push -f origin ci-logs
