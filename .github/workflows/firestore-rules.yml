# Publishes firestore.rules to Firebase (project ourworldhive) whenever that file changes on main.
# Needs the repository secret FIREBASE_RULES_KEY (a service account key with the "Firebase Rules Admin" role).
# Firebase checks the rules before publishing: if there is a mistake, nothing is published and the live rules stay as they are.
name: Publish Firestore rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firebase.json', '.github/workflows/firestore-rules.yml']
permissions:
  contents: read
concurrency: { group: firestore-rules, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.FIREBASE_RULES_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop if the key is not set yet
        if: env.KEY == ''
        run: echo "FIREBASE_RULES_KEY secret is not set, so nothing was published." && exit 0
      - uses: actions/setup-node@v4
        if: env.KEY != ''
        with: { node-version: '20' }
      - name: Publish the rules
        if: env.KEY != ''
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project ourworldhive --non-interactive
          rm -f "$RUNNER_TEMP/key.json"
