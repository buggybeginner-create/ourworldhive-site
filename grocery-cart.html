function quickAdd(text){const parts=splitSegs(text);let added=[],made=[];for(const seg of parts){const p=parseSeg(seg);if(!p)continue;let it=find(p.name);if(!it){const nm=p.name.replace(/\b\w/g,c=>c.toUpperCase());it={id:'u_'+uid(),n:nm,e:'🛒',u:p.u||'pc',cat:'Other',al:[],custom:1,cal:null,fat:null,ben:'',use:''};S.custom.push({id:it.id,n:it.n,e:it.e,u:it.u,cat:'Other',cal:null,fat:null,ben:'',use:''});rebuild();made.push(nm)}addToCart(it,p.q,p.u,p.price);added.push(it.n)}if(!added.length)return;save();toast('Added: '+added.join(', ')+(made.length?' (new: '+made.join(', ')+')':''))}

function vHist(){$('#hs').textContent=S.hist.length+' purchases';const now=new Date();const ms=S.hist.filter(h=>{const d=new Date(h.d);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});const spend=a=>a.reduce((s,h)=>s+(num(h.p)!=null?h.q*num(h.p):0),0);const q=(S.hq||'').trim().toLowerCase();let list=S.hist.slice().sort((a,b)=>a.d<b.d?1:-1);if(q)list=list.filter(h=>getIt(h.it).n.toLowerCase().includes(q));

if(!list.length)h+=`<div class="card empty"><b>No purchases yet</b>When you tick an item in your cart it is saved here with the date and price.</div>`;
else{let cur='',grp=[];const flush=()=>{if(!grp.length)return;h+=`<div class="dh"><b>${cur}</b><span>${spend(grp)?'₹'+fmt(spend(grp)):''}</span></div>`+grp.map(hHtml).join('');grp=[]};for(const e of list){const d=new Date(e.d).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});if(d!==cur){flush();cur=d}grp.push(e)}flush()}

function spark(pts,w,h){const ps=pts.map(p=>+p.p);const mn=Math.min(...ps),mx=Math.max(...ps);const X=i=>2+(w-4)*(pts.length===1?.5:i/(pts.length-1));const Y=v=>mx===mn?h/2:2+(h-4)*(1-(v-mn)/(mx-mn));const up=ps[ps.length-1]>ps[0];return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${up?'var(--bad)':'var(--good)'}" stroke-width="2" stroke-linejoin="round" points="${ps.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/></svg>`}
function vTrend(){$('#hs').textContent='price changes';const rows=[];for(const it of ALL){const a=ph(it.id);if(a.length<2)continue;const l=num(a[a.length-1].p),p=num(a[a.length-2].p);const pc=p?((l-p)/p)*100:0;rows.push({it,a,l,p,pc})}rows.sort((x,y)=>Math.abs(y.pc)-Math.abs(x.pc));const f=S.tf;const list=rows.filter(r=>f==='all'||(f==='up'&&r.pc>0.005)||(f==='dn'&&r.pc<-0.005));
app.innerHTML=`<div class="chips">${[['all','All'],['up','▲ Price up'],['dn','▼ Price down']].map(x=>`<button class="chip${f===x[0]?' on':''}" data-tf="${x[0]}">${x[1]}</button>`).join('')}</div>`+(list.length?list.map(r=>`<button class="card tr" data-act="info2" data-it="${esc(r.it.id)}">${thumb(r.it,42)}<span class="mid"><b>${esc(nmM(r.it))}</b><div class="sub">${nmS(r.it)?esc(nmS(r.it))+' · ':''}₹${fmt(r.p)} → ₹${fmt(r.l)} · ${r.a.length} prices</div></span>${spark(r.a.slice(-8),70,26)}<span class="chg ${r.pc>0?'up':'dn'}">${r.pc>0?'▲':'▼'} ${fmt(Math.abs(r.pc))}%</span></button>`).join(''):`<div class="card empty"><b>No trends yet</b>Add a price when you buy an item. After the same item is bought with a price two or more times, its price change shows here. Tap any item to see its full chart.</div>`)+foot}
/* chart */
function chart(pts){const W=320,H=140,pl=40,pr=10,pt=12,pb=24;const ps=pts.map(p=>+p.p);let mn=Math.min(...ps),mx=Math.max(...ps);let lo=mn,hi=mx;if(lo===hi){lo=mn*.9;hi=mx*1.1||1}const X=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1));const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(+p.p).toFixed(1)).join(' ');
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Price trend"><line x1="${pl}" x2="${W-pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)"/><line x1="${pl}" x2="${W-pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/><text x="${pl-5}" y="${Y(hi)+3}" text-anchor="end">₹${fmt(hi)}</text><text x="${pl-5}" y="${Y(lo)+3}" text-anchor="end">₹${fmt(lo)}</text><path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(+p.p).toFixed(1)}" r="3.6" fill="var(--brand)"/>`).join('')}<text x="${pl}" y="${H-6}">${fd(pts[0].d)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${pts.length>1?fd(pts[pts.length-1].d):''}</text></svg>`}

if(a==='qadd'){const i=$('#qa');if(i&&i.value.trim()){quickAdd(i.value);i.value=''}render();return}
if(a==='qsug'){quickAdd(t.dataset.q);const i=$('#qa');if(i)i.value='';render();return}
if(a==='qm'&&l){l.q=Math.max(0,Math.round(((+l.q||0)-(l.u==='g'||l.u==='ml'?100:1))*1000)/1000);if(l.done&&l.h){const h=S.hist.find(x=>x.id===l.h);if(h)h.q=l.q}save();render();return}
if(a==='qp'&&l){l.q=Math.round(((+l.q||0)+(l.u==='g'||l.u==='ml'?100:1))*1000)/1000;if(l.done&&l.h){const h=S.hist.find(x=>x.id===l.h);if(h)h.q=l.q}save();render();return}
if(a==='rm'&&l){S.cart=S.cart.filter(x=>x!==l);save();render();return}
if(a==='info'&&l){sheetItem(l.it);return}
if(a==='info2'){sheetItem(t.dataset.it);return}
if(a==='add'){const it=BYID[t.dataset.it];if(it){const l2=addToCart(it);toast('Added '+it.n+' (×'+l2.q+')');render()}return}
if(a==='sadd'){const it=BYID[t.dataset.it];if(it){addToCart(it);close();toast('Added '+it.n);render()}return}
if(a==='sedit'){sheetEdit(t.dataset.it);return}
if(a==='new'){sheetEdit('');return}
if(a==='noimg'){const id=$('#ef').dataset.id;const it=BYID[id];if(it&&it.custom){delete S.custom.find(x=>x.id===id).img}else{S.over[id]=Object.assign(S.over[id]||{},{img:''})}rebuild();save();close();render();toast('Picture removed');return}
if(a==='reset'){const id=$('#ef').dataset.id;delete S.over[id];rebuild();save();close();render();toast('Reset');return}
if(a==='delit'){const id=$('#ef').dataset.id;const it=BYID[id];if(it&&it.custom)S.custom=S.custom.filter(x=>x.id!==id);else S.over[id]=Object.assign(S.over[id]||{},{del:1});S.cart=S.cart.filter(x=>x.it!==id||x.done);rebuild();save();close();render();toast('Removed');return}
if(a==='hedit'){sheetHist(t.dataset.h);return}
if(a==='hdel'){const hid=$('#hf').dataset.h;S.hist=S.hist.filter(x=>x.id!==hid);for(const c of S.cart)if(c.h===hid){c.h=null}save();close();render();toast('Deleted');return}
if(a==='clear'){S.cart=S.cart.filter(x=>!x.done);save();render();toast('Cleared bought items');return}
if(a==='share'){shareSt={l:S.lang,m:'pend'};sheetShare();return}
if(a==='sl'){shareSt.l=t.dataset.v;sheetShare();return}
if(a==='sm'){shareSt.m=t.dataset.v;sheetShare();return}
if(a==='scopy'){copyShare();return}
if(a==='swa'){window.open('https://wa.me/?text='+encodeURIComponent($('#stx').value),'_blank');return}
if(a==='snat'){navigator.share({text:$('#stx').value}).catch(()=>{});return}
if(a==='sdl'){const b=new Blob([$('#stx').value],{type:'text/plain'});const u=URL.createObjectURL(b);const x=document.createElement('a');x.href=u;x.download='grocery-list-'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return}
if(a==='setlang'){setLang(t.dataset.v);sheetMore();return}
if(a==='gin'){signIn();return}
if(a==='gout'){signOut();return}
if(a==='export'){const b=new Blob([JSON.stringify({v:1,cart:S.cart,hist:S.hist,over:S.over,custom:S.custom})],{type:'application/json'});const u=URL.createObjectURL(b);const x=document.createElement('a');x.href=u;x.download='grocery-cart-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return}
if(a==='import'){$('#imp').click();return}
if(a==='wipe'){if(t.dataset.sure){S.cart=[];S.hist=[];save();close();render();toast('Cleared')}else{t.dataset.sure=1;t.textContent='Tap again to confirm';}return}
});
document.addEventListener('change',e=>{const t=e.target;const f=t.dataset&&t.dataset.f;if(!f)return;const row=t.closest('[data-l]');const l=row&&S.cart.find(x=>x.id===row.dataset.l);if(!l)return;
if(f==='q'){l.q=num(t.value)==null?1:num(t.value)}else if(f==='u'){l.u=t.value}else if(f==='p'){l.p=num(t.value)==null?'':num(t.value)}
if(l.done&&l.h){const h=S.hist.find(x=>x.id===l.h);if(h){h.q=+l.q||1;h.u=l.u;h.p=l.p}}save();render()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='tick'){const row=t.closest('[data-l]');const l=S.cart.find(x=>x.id===row.dataset.l);if(!l)return;setDone(l,t.checked);save();render();if(l.done)toast(num(l.p)==null?'Saved with today\'s date (no price)':'Saved with today\'s date and price')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='ef'){submitEdit(f)}else if(f.id==='hf'){const h=S.hist.find(x=>x.id===f.dataset.h);if(!h)return;const d=new Date(h.d);const nd=String(new FormData(f).get('d'));const cur=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(nd&&nd!==cur)h.d=new Date(nd+'T12:00:00').toISOString();h.q=num(new FormData(f).get('q'))||1;h.u=new FormData(f).get('u');const p=num(new FormData(f).get('p'));h.p=p==null?'':p;save();close();render();toast('Saved')}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='sq'){S.q=t.value;const pos=t.selectionStart;vItems();const n=$('#sq');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
else if(t.id==='hq'){S.hq=t.value;const pos=t.selectionStart;vHist();const n=$('#hq');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
else if(t.id==='qa'){const segs=t.value.split(/[,\n;+]/);const last=parseSeg(segs[segs.length-1]||'');const box=$('#sug');if(!last||last.name.length<1){box.hidden=true;return}const res=search(last.name,8);const inc={};for(const l of S.cart)if(!l.done)inc[l.it]=l.q;if(!res.length){box.hidden=true;return}const pre=segs.slice(0,-1).join(', ');box.innerHTML=res.map(it=>`<button data-act="qsug" data-q="${esc((pre?pre+', ':'')+it.n+(last.q?' '+last.q+(last.u||''):''))}">${thumb(it,32)}<span><b>${esc(nmM(it))}</b> <small style="color:var(--ink2)">${esc(nmS(it)||it.cat)}</small></span>${inc[it.id]!=null?`<span class="chg dn" style="margin-left:auto">in cart ×${inc[it.id]}</span>`:`<span style="margin-left:auto;color:var(--brand);font-weight:800;white-space:nowrap">＋ Add</span>`}</button>`).join('');box.hidden=false}});
document.addEventListener('keydown',e=>{if(e.target.id==='qa'&&e.key==='Enter'){e.preventDefault();if(e.target.value.trim()){quickAdd(e.target.value);e.target.value=''}render();const q=$('#qa');if(q)q.focus()}if(e.key==='Escape')close()});
document.addEventListener('click',e=>{if(!e.target.closest('.qa')){const b=$('#sug');if(b)b.hidden=true}});

/* language */
const LBL={en:'Aa',hing:'Hi',hi:'हि'};
function setLang(l){S.lang=l;save();$('#bLang').textContent=LBL[l];render();toast('Item names: '+{en:'English',hing:'Hinglish',hi:'हिंदी'}[l])}
$('#bLang').textContent=LBL[S.lang]||'Aa';
$('#bLang').onclick=()=>setLang({en:'hing',hing:'hi',hi:'en'}[S.lang]||'hing');
/* share */
function buildShare(){const sv=S.lang;S.lang=shareSt.l;try{const all=shareSt.m==='all';const rows=(all?S.cart:S.cart.filter(x=>!x.done));let tot=0;const lines=rows.map((x,i)=>{const it=getIt(x.it);const a=nmS(it).split(' · ')[0];const p=num(x.p);if(p!=null)tot+=(+x.q||0)*p;return (all?(x.done?'✅ ':'☐ '):'☐ ')+nmM(it)+(a?' ('+a+')':'')+' – '+x.q+' '+x.u+(p!=null?'  @ ₹'+fmt(p)+'/'+x.u+' = ₹'+fmt((+x.q||0)*p):'')});return '🛒 Grocery list – '+fd(Date.now())+'\n'+(lines.length?lines.join('\n'):'(nothing here)')+(tot?'\n\nEstimated total: ₹'+fmt(tot):'')}finally{S.lang=sv}}
function sheetShare(){const chip=(act,v,cur,l)=>`<button class="chip${cur===v?' on':''}" data-act="${act}" data-v="${v}">${l}</button>`;
open(`<div class="sh"><span class="th" style="width:52px;height:52px;font-size:28px;background:var(--soft)">📤</span><div><h2>Share cart</h2><p>Choose what to send, then pick how.</p></div></div><div class="card blk"><h4>Item names</h4><div class="chips" style="margin:0">${chip('sl','en',shareSt.l,'English')}${chip('sl','hing',shareSt.l,'Hinglish')}${chip('sl','hi',shareSt.l,'हिंदी')}</div><h4 style="margin-top:8px">What to include</h4><div class="chips" style="margin:0">${chip('sm','pend',shareSt.m,'Only items to buy')}${chip('sm','all',shareSt.m,'Everything, with prices')}</div></div><div class="fr"><label>Message (you can edit it)</label><textarea class="mono" id="stx"></textarea></div><div class="acts"><button class="btn" data-act="swa">WhatsApp</button><button class="btn ghost" data-act="scopy">Copy text</button>${navigator.share?'<button class="btn ghost" data-act="snat">Other apps</button>':''}<button class="btn ghost" data-act="sdl">Download .txt</button></div><div class="acts" style="margin-top:8px"><button class="btn ghost" data-act="closem">Close</button></div>`);$('#stx').value=buildShare()}
function copyShare(){const ta=$('#stx');const v=ta.value;const done=()=>toast('Copied');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(done).catch(()=>{ta.select();try{document.execCommand('copy');done()}catch(e){toast('Press and hold the text to copy')}})}else{ta.select();try{document.execCommand('copy');done()}catch(e){toast('Press and hold the text to copy')}}}
/* email sync (Firebase, same project as the other Hive apps) */
function setSt(t){SY.st=t;const c=$('#bCloud');if(c){c.textContent=SY.ref?(/Saved to/.test(t)?'☁✓':'☁…'):'☁';c.title=t}const b=$('#syncBox');if(b)b.innerHTML=syncHtml()}
function syncHtml(){const on=!!SY.ref;return `<p style="margin:0 0 8px"><b>${esc(SY.st)}</b>${on?'<br><span style="color:var(--ink2)">'+esc(SY.email)+'</span>':''}</p>`+(on?'<button class="btn bad sm" data-act="gout">Sign out</button>':'<p style="margin:0 0 10px;color:var(--ink2)">Sign in with your Google email and the same cart, history and item edits appear on every phone and laptop.</p><button class="btn" data-act="gin">'+(SY.loading?'Connecting…':'Sign in with Google')+'</button>')}
function loadJs(u){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=()=>rej(new Error('load'));document.head.appendChild(e)})}
async function bootFB(){if(SY.auth)return true;try{if(!window.OWH_FIREBASE)await loadJs('firebase-config.js');if(!window.firebase){const b='https://www.gstatic.com/firebasejs/10.12.2/';await loadJs(b+'firebase-app-compat.js');await loadJs(b+'firebase-auth-compat.js');await loadJs(b+'firebase-firestore-compat.js')}if(!firebase.apps.length)firebase.initializeApp(window.OWH_FIREBASE);SY.auth=firebase.auth();SY.fs=firebase.firestore();SY.auth.onAuthStateChanged(u=>{if(u)startSync(u);else stopSync()});return true}catch(e){setSt('Cannot reach sign-in right now. Check internet.');return false}}
async function signIn(){SY.loading=true;setSt('Connecting…');if(!(await bootFB())){SY.loading=false;return}try{await SY.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());try{localStorage.setItem('owh_gc_sync','1')}catch(e){}}catch(e){setSt(e&&e.code==='auth/popup-closed-by-user'?'Sign-in was cancelled.':'Sign-in failed. Please try again.')}SY.loading=false;if(!SY.ref)setSt(SY.st)}
function signOut(){try{localStorage.removeItem('owh_gc_sync')}catch(e){}if(SY.auth)SY.auth.signOut();stopSync();toast('Signed out. Your data stays on this device.')}
function stopSync(){if(SY.unsub){try{SY.unsub()}catch(e){}}SY.unsub=null;SY.ref=null;SY.email='';SY.uid='';setSt('Saved on this device')}
function mergeIn(r){const ids=new Set(S.hist.map(h=>h.id));for(const h of r.hist||[])if(!ids.has(h.id))S.hist.push(h);const cl=new Set(S.cart.map(c=>c.id));for(const c of r.cart||[])if(!cl.has(c.id))S.cart.push(c);S.over=Object.assign({},r.over||{},S.over);const cu=new Set(S.custom.map(c=>c.id));for(const c of r.custom||[])if(!cu.has(c.id))S.custom.push(c)}
function applyRemote(r){S.cart=r.cart||[];S.hist=r.hist||[];S.over=r.over||{};S.custom=r.custom||[];if(r.lang)S.lang=r.lang;S.ts=r.ts||0;FP=JSON.stringify(payload());rebuild();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}$('#bLang').textContent=LBL[S.lang]||'Aa';render()}
function schedFlush(){if(!SY.ref)return;setSt('Saving…');clearTimeout(SY.timer);SY.timer=setTimeout(flush,700)}
function flush(){if(!SY.ref)return;if(SY.busy){SY.pend=true;return}SY.busy=true;const o=payload();o.ts=S.ts;const j=JSON.stringify(o);SY.ref.set({json:j,ts:S.ts,email:SY.email,upd:Date.now()}).then(()=>setSt('Saved to your email')).catch(e=>setSt(e&&e.code==='permission-denied'?'Blocked: Firestore rules need updating':'Offline, saved on this device')).then(()=>{SY.busy=false;if(SY.pend){SY.pend=false;flush()}})}
function startSync(u){SY.uid=u.uid;SY.email=u.email||'';const first=!S.uid;if(S.uid&&S.uid!==u.uid){S.cart=[];S.hist=[];S.over={};S.custom=[];S.ts=0;rebuild();render()}S.uid=u.uid;SY.ref=SY.fs.collection('grocery_data').doc(u.uid);setSt('Connecting…');
if(SY.unsub){try{SY.unsub()}catch(e){}}
SY.unsub=SY.ref.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;if(snap.exists){let r=null;try{r=JSON.parse(snap.data().json)}catch(e){}if(r&&Array.isArray(r.hist)){if(first&&!SY.merged){SY.merged=1;mergeIn(r);S.ts=Date.now();FP=JSON.stringify(payload());rebuild();save();render();flush()}else if((r.ts||0)>(S.ts||0)){applyRemote(r);setSt('Saved to your email')}else if((S.ts||0)>(r.ts||0))flush();else setSt('Saved to your email')}else setSt('Saved to your email')}else{S.ts=S.ts||Date.now();flush()}},e=>setSt(e&&e.code==='permission-denied'?'Blocked: Firestore rules need updating':'Offline, saved on this device'))}
$('#bCloud').onclick=sheetMore;
try{if(localStorage.getItem('owh_gc_sync')==='1')bootFB()}catch(e){}
FP=JSON.stringify(payload());

$('#bMore').onclick=sheetMore;
render();
})();
</script></body></html>
