name: My Diary Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-diary/**', 'android-shared/**', '.github/workflows/diary-app.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIARY_KEY_PASS: ${{ secrets.DIARY_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build the test APK (for your own phone)
        working-directory: android-diary
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build-log.txt; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Build the Play Store bundle (.aab)
        if: env.DIARY_KEY_PASS != ''
        working-directory: android-diary
        run: gradle bundleRelease --no-daemon --stacktrace
      - name: Name the files
        run: |
          cp android-diary/app/build/outputs/apk/debug/app-debug.apk My-Diary-test.apk
          if [ -n "$DIARY_KEY_PASS" ]; then cp android-diary/app/build/outputs/bundle/release/app-release.aab My-Diary-PlayStore.aab; fi
          ls -la *.apk *.aab 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: My-Diary-app, path: 'My-Diary-*' }
      - name: Put them on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diary-app
          name: My Diary Android app (latest)
          body: |
            Build ${{ github.run_number }}.
            My-Diary-test.apk: install on your own phone to test.
            My-Diary-PlayStore.aab: upload this file in Google Play Console (Production or Testing, Create new release).
          files: My-Diary-*
          make_latest: false
      - name: Save the error log (only when the build fails)
        if: failure()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rq --cached . >/dev/null 2>&1 || true
          tail -c 60000 build-log.txt > diary-build-log.txt || echo "no log" > diary-build-log.txt
          git add -f diary-build-log.txt
          git commit -qm "diary build log ${{ github.run_number }}"
          git push -f origin ci-logs
