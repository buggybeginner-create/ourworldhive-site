name: Expense Tracker APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-expense/**', '.github/workflows/expense-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIARY_KEY_PASS: ${{ secrets.DIARY_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build the APK
        working-directory: android-expense
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Build the Play Store bundle (.aab)
        if: env.DIARY_KEY_PASS != ''
        working-directory: android-expense
        run: gradle bundleRelease --no-daemon --stacktrace
      - name: Name the files
        run: |
          cp android-expense/app/build/outputs/apk/debug/app-debug.apk Expense-Tracker.apk
          if [ -n "$DIARY_KEY_PASS" ]; then cp android-expense/app/build/outputs/bundle/release/app-release.aab Expense-Tracker-PlayStore.aab; fi
      - uses: actions/upload-artifact@v4
        with: { name: Expense-Tracker-app, path: 'Expense-Tracker*' }
      - name: Put it on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: expense-apk
          name: Expense Tracker APK (latest)
          body: |
            Build ${{ github.run_number }}.
            Expense-Tracker.apk: install on your own phone (installs over the old one, nothing is lost).
            Expense-Tracker-PlayStore.aab: upload this file in Google Play Console (Testing or Production, Create new release).
          files: Expense-Tracker*
          make_latest: false
