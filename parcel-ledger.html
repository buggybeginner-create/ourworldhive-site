<script>
(function(){

var STORES={amazon:{n:'Amazon',v:'--amz'},flipkart:{n:'Flipkart',v:'--fk'},myntra:{n:'Myntra',v:'--myn'},meesho:{n:'Meesho',v:'--mee'},firstcry:{n:'FirstCry',v:'--fc'},other:{n:'Other',v:'--oth'}};

var STATUS={ordered:['Ordered',1],shipped:['Shipped',1],out:['Out for delivery',1],delivered:['Delivered'],returned:['Returned'],damaged:['Damaged / wrong'],cancelled:['Cancelled']};

var KEY='parcel-ledger-v2',orders=[],S={budget:{total:0,types:{}},accounts:['Main'],account:'all'},f={store:'all',tab:'all',vm:'month',period:'',open:null,gb:'type'};
function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){orders=j.orders||[];S=Object.assign(S,j.s||{})}else{var o=JSON.parse(localStorage.getItem('parcel-ledger-orders')||'[]');if(o&&o.length)orders=o.map(function(x){x.account=x.account||'Main';x.type=x.type||guess(x.item);x.cmp=x.cmp||[];return x})}}catch(e){}}

function pad(n){return(n<10?'0':'')+n}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function today(){return iso(new Date())}
function parse(s){var p=String(s||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null}function dd(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function fd(s){var d=parse(s);return d?d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'-'}function fl(s){var d=parse(s);return d?d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'-'}
function money(n){n=Number(n)||0;return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:n%1?2:0})}

function uid(){return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function guess(t){for(var k in TYPEKEY)if(TYPEKEY[k].test(t||''))return k;return 'Other'}
function isLive(o){return !!(STATUS[o.status]&&STATUS[o.status][1])}
function refund(o){if(o.status==='returned'||o.status==='damaged'){return o.refund==null||o.refund===''?(o.refunded?o.amount:0):Number(o.refund)||0}return o.status==='cancelled'?o.amount:0}
function net(o){return Math.max(0,(Number(o.amount)||0)-refund(o))}
function pendingRefund(o){return(o.status==='returned'||o.status==='damaged')&&!o.refunded?Math.max(0,(Number(o.amount)||0)-(Number(o.refund)||0)):0}
function mk(s){return String(s||'').slice(0,7)}
function fyOf(s){var d=parse(s);if(!d)return '';var y=d.getFullYear()+(d.getMonth()>=3?0:-1);return String(y)}
function fyLabel(y){return 'FY '+y+'-'+String(+y+1).slice(2)}
function mlabel(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function best(o){var c=(o.cmp||[]).filter(function(x){return x.price>0});if(!c.length)return null;return c.reduce(function(a,b){return b.price<a.price?b:a})}
function over(o){var b=best(o);return b&&o.amount>b.price&&o.status!=='cancelled'?o.amount-b.price:0}
/* ---------- filtering ---------- */
function keyOf(o){return f.vm==='month'?mk(o.orderedOn):f.vm==='fy'?fyOf(o.orderedOn):'all'}

function visible(){return periodOrders().filter(function(o){if(f.store!=='all'&&o.store!==f.store)return false;var t=f.tab;if(t==='live')return isLive(o);if(t==='delivered')return o.status==='delivered';if(t==='issue')return o.status==='returned'||o.status==='damaged';if(t==='cancelled')return o.status==='cancelled';return true}).sort(function(a,b){var la=isLive(a),lb=isLive(b);if(la!==lb)return la?-1:1;if(la)return String(a.eta||'9999').localeCompare(String(b.eta||'9999'));return String(b.orderedOn||'').localeCompare(String(a.orderedOn||''))})}
function periods(){var m={};orders.forEach(function(o){if(o.orderedOn&&inAcc(o))m[keyOf(o)]=1});return Object.keys(m).sort().reverse()}

function etaHtml(o){if(o.status==='delivered')return '<span class="eta done">Delivered '+esc(fd(o.deliveredOn||o.eta))+'</span>';if(o.status==='returned')return '<span class="eta dim">Returned'+(o.refunded?' · refunded':' · refund pending')+'</span>';if(o.status==='damaged')return '<span class="eta late">Damaged / wrong'+(o.refunded?' · resolved':' · claim open')+'</span>';if(o.status==='cancelled')return '<span class="eta dim">Cancelled</span>';if(!o.eta)return '<span class="eta dim">No date yet</span>';var d=dd(today(),o.eta);if(d<0)return '<span class="eta late">'+(-d)+(d===-1?' day late':' days late')+' · was '+esc(fd(o.eta))+'</span>';if(d===0)return '<span class="eta soon">Arriving today</span>';if(d===1)return '<span class="eta soon">Tomorrow · '+esc(fd(o.eta))+'</span>';return '<span class="eta">'+esc(fd(o.eta))+' · in '+d+' days</span>'}

 var h='<article class="order"><button type="button" class="top" data-a="toggle" data-id="'+esc(o.id)+'" aria-expanded="'+open+'"><div style="min-width:0"><div class="name">'+esc(o.item||'Untitled order')+'</div><div class="meta"><span class="dot" style="--dot:var('+st.v+')"></span>'+esc(st.n)+' · '+esc(o.type||'Other')+' · '+esc(fd(o.orderedOn))+(S.accounts.length>1?' · '+esc(o.account||'Main'):'')+'</div></div><div class="price num">'+money(o.amount)+(r?'<small>−'+money(r)+' back</small>':'')+(ov?'<small style="color:var(--warn)">'+money(ov)+' cheaper elsewhere</small>':'')+'</div></button><div class="row">'+etaHtml(o)+pill(o)+'</div>';

var FBP=null;function fbAuth(){if(FBP)return FBP;FBP=(async function(){if(!window.OWH_FIREBASE)throw new Error('cfg');var b='https://www.gstatic.com/firebasejs/10.12.2/';if(!window.firebase){await loadJs(b+'firebase-app-compat.js');await loadJs(b+'firebase-auth-compat.js')}if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(window.OWH_FIREBASE);return firebase.auth()})();FBP.catch(function(){FBP=null});return FBP}
async function gmailToken(acc){var auth=await fbAuth(),p=new firebase.auth.GoogleAuthProvider();p.addScope('https://www.googleapis.com/auth/gmail.readonly');p.setCustomParameters({login_hint:acc,prompt:'select_account'});
 var r=await auth.signInWithPopup(p),tok=r.credential&&r.credential.accessToken,em=String(r.user.email||'').toLowerCase();try{await auth.signOut()}catch(e){}
 if(!tok)throw new Error('notoken');if(em!==acc.toLowerCase()){var er=new Error('wrong');er.got=em;throw er}return tok}
async function gget(tok,path){var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/'+path,{headers:{Authorization:'Bearer '+tok}});if(!r.ok){var er=new Error('http');er.status=r.status;try{er.body=await r.json()}catch(e){}throw er}return r.json()}
function b64u(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');var bin=atob(s);try{return decodeURIComponent(escape(bin))}catch(e){return bin}}
function stripHtml(h){return String(h).replace(/<(style|script)[\s\S]*?<\/\1>/gi,' ').replace(/<br\s*\/?>|<\/(p|div|tr|li|h\d|td)>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#8377;|&rupee;/g,'₹').replace(/&#39;|&apos;/g,"'").replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g,'\n')}
function mailText(m){var t='',h='';(function walk(x){if(!x)return;if(x.mimeType==='text/plain'&&x.body&&x.body.data)t+=b64u(x.body.data)+'\n';else if(x.mimeType==='text/html'&&x.body&&x.body.data)h+=b64u(x.body.data);(x.parts||[]).forEach(walk)})(m.payload);return t.trim().length>40?t:stripHtml(h)}
function hdr(m,n){var h=((m.payload&&m.payload.headers)||[]).filter(function(x){return x.name.toLowerCase()===n})[0];return h?h.value:''}
var GQ='from:(amazon.in OR amazon.com OR flipkart.com OR myntra.com OR meesho.com OR firstcry.com) subject:(order OR ordered OR shipped OR dispatched OR delivered OR "out for delivery" OR refund OR cancelled OR return) newer_than:180d';
async function syncGmail(acc,say){
 if(navigator.onLine===false){say('You are offline. Gmail sync needs internet. Everything else works offline.',1);return}
 say('Opening Google sign in for '+acc+'...');var tok;
 try{tok=await gmailToken(acc)}catch(e){say(e.message==='wrong'?'You signed in as '+e.got+' but this slot is '+acc+'. Try again with the right Gmail.':e.code==='auth/popup-closed-by-user'?'Sign in window was closed.':e.code==='auth/popup-blocked'?'Allow pop-ups for this site and try again.':e.code==='auth/unauthorized-domain'?'This website address is not allowed for Google sign in yet (Firebase, Authorized domains).':e.message==='cfg'?'Sign in is not set up on this page.':'Could not sign in. Check internet and try again.',1);return}
 try{say('Searching order emails...');var l=await gget(tok,'messages?maxResults=100&q='+encodeURIComponent(GQ)),ids=(l.messages||[]).map(function(m){return m.id}).filter(function(i){return !(S.seen||{})[i]});
  if(!ids.length){S.sync=S.sync||{};S.sync[acc]=Date.now();save();say('No new order emails found.');return}
  var out=[],done=0;async function one(id){try{var m=await gget(tok,'messages/'+id+'?format=full'),sub=hdr(m,'subject'),from=hdr(m,'from'),body=mailText(m).slice(0,7000),d=new Date(+m.internalDate||Date.now()),txt='From: '+from+'\nSubject: '+sub+'\n'+body,r=parseEmails(txt,iso(d))[0];S.seen=S.seen||{};S.seen[id]=1;
    if(r&&(r.store!=='other')&&(r.orderId||/order\s+(confirm|placed)|ordered:|shipped|delivered|dispatched/i.test(sub)))out.push({x:r,t:+m.internalDate||0})}catch(e){}done++;if(done%5===0)say('Reading emails '+done+'/'+ids.length+'...')}
  var q=ids.slice();await Promise.all([0,1,2,3,4].map(async function(){while(q.length)await one(q.shift())}));
  out.sort(function(a,b){return a.t-b.t});var rs=applyAll(out.map(function(o){return o.x}),acc,'Gmail');
  var keys=Object.keys(S.seen);if(keys.length>2500){var n={};keys.slice(-2000).forEach(function(k){n[k]=1});S.seen=n}
  S.sync=S.sync||{};S.sync[acc]=Date.now();save();say('Done. '+rs.msg+' Read '+ids.length+' emails.')}
 catch(e){var b=e.body&&e.body.error&&e.body.error.message||'';say(e.status===403?'Gmail says access is not allowed. In Google Cloud, enable Gmail API and add this Gmail as a test user. '+b.slice(0,80):e.status===401?'Google sign in expired. Try again.':'Could not read Gmail right now. Try again.',1)}}
function isMail(a){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a)}
function syncAge(a){var t=(S.sync||{})[a];if(!t)return 'Never synced';var m=Math.round((Date.now()-t)/60000);return 'Synced '+(m<2?'just now':m<90?m+' min ago':m<2880?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago')}
function openSync(pre){var accs=S.accounts.filter(isMail);
 var form=sheet('<h2>Link orders</h2><p class="msg">Every way to bring orders in. Orders are matched by order ID, so nothing is added twice and a later message updates the same order (shipped, out for delivery, delivered).</p>'+
 '<div class="card" style="margin-top:8px"><h3 style="margin:0 0 6px">1. Gmail sync (read only)</h3>'+(accs.length?accs.map(function(a){return '<div class="row" style="margin:6px 0"><span style="min-width:0"><b style="overflow-wrap:anywhere">'+esc(a)+'</b><br><span class="msg">'+esc(syncAge(a))+'</span></span><button class="btn pri sm" type="button" data-a="gsync" data-acc="'+esc(a)+'">Sync now</button></div>'}).join(''):'<p class="msg">Add your Gmail below, then tap Sync now.</p>')+
 '<div class="f2" style="margin-top:8px"><input id="ga" type="email" inputmode="email" placeholder="name@gmail.com"><button class="btn sm" type="button" data-a="gadd">Add Gmail</button></div><p class="msg">You can add many Gmails. Each one signs in separately, only Amazon, Flipkart, Myntra, Meesho and FirstCry order emails are read, and nothing leaves your phone.</p><p class="msg" id="gmsg" aria-live="polite"></p></div>'+
 '<div class="card"><h3 style="margin:0 0 6px">2. SMS, notification or email text</h3><textarea id="smsT" placeholder="Paste a delivery SMS, a notification or an order email. Many messages: leave a blank line between them." style="min-height:90px">'+esc(pre||'')+'</textarea><div class="f2" style="margin-top:8px"><select id="smsA">'+S.accounts.map(function(a){return '<option'+(a===S.account?' selected':'')+'>'+esc(a)+'</option>'}).join('')+'</select><span style="display:flex;gap:6px"><button class="btn sm" type="button" data-a="clip">Paste</button><button class="btn pri sm" type="button" data-a="readmsg">Link it</button></span></div><p class="msg" id="smsM" aria-live="polite"></p></div>'+
 '<div class="card"><h3 style="margin:0 0 6px">3. Share from other apps (Android)</h3><p class="msg" style="margin:0">Install Parcel Ledger on your home screen (Install app button). Then in the SMS app, Gmail or a notification, tap <b>Share</b> and choose <b>Parcel Ledger</b>. The message is read and linked at once, even without internet.</p></div>'+
 '<div class="card"><h3 style="margin:0 0 6px">4. Fully automatic SMS and notifications</h3><p class="msg" style="margin:0">A web page is not allowed to read your SMS inbox or notifications. That needs a small Android app with your permission. It can be built later, and it would feed the same ledger.</p></div>'+
 '<div class="acts"><button class="btn" type="button" data-a="close">Done</button></div>');

function csv(){var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'},rows=[['Store','Item','Type','Account','Amount','Refund','Net','Status','Ordered on','Delivery by','Delivered on','Order ID','Notes']];visible().forEach(function(o){rows.push([STORES[o.store].n,o.item,o.type,o.account,o.amount,refund(o),net(o),STATUS[o.status][0],o.orderedOn,o.eta,o.deliveredOn,o.orderId,o.notes])});dl('orders-'+today()+'.csv',rows.map(function(r){return r.map(q).join(',')}).join('\n'),'text/csv')}

document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.tagName==='FORM')return;var a=b.dataset.a,id=b.dataset.id;
