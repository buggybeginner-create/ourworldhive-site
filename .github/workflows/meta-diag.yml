name: Hive Meta check (manual)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try real shop pages
        shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36'
          echo "=== worker ping"; curl -s -i 'https://hive-meta.er-krushnananda.workers.dev/?ping=1' | head -20
          echo "=== worker bad"; curl -s 'https://hive-meta.er-krushnananda.workers.dev/?u=https://example.com/'; echo
          for U in "https://www.amazon.in/dp/B0CHX1W1XY" "https://www.myntra.com/kurta-sets" ; do
            echo "=== direct $U"; curl -sL -A "$UA" -H 'Accept-Language: en-IN,en;q=0.9' -o page.html -w "code %{http_code} size %{size_download} final %{url_effective}\n" "$U"
            grep -o '<title>[^<]*' page.html | head -2; grep -c '__myx' page.html; grep -o 'a-price-whole[^<]*<' page.html | head -2; grep -o '"landingPageUrl":"[^"]*"' page.html | head -2
          done
          P=$(grep -o '"landingPageUrl":"[^"]*"' page.html | head -1 | sed 's/.*:"//;s/"$//')
          echo "myntra product: $P"
          for U in "https://www.amazon.in/dp/B0CHX1W1XY" "https://www.myntra.com/$P" "https://myntr.it/b9yq2Ui"; do
            echo "=== worker $U"; curl -s "https://hive-meta.er-krushnananda.workers.dev/?u=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$U")" | head -c 700; echo
            echo "=== direct+parse $U"; curl -sL -A "$UA" -H 'Accept-Language: en-IN,en;q=0.9' -o p2.html -w "code %{http_code} size %{size_download}\n" "$U"
            node -e "const fs=require('fs');const s=fs.readFileSync('cloudflare/hive-meta-worker.js','utf8');eval(s.slice(s.indexOf('function metaOf'),s.indexOf('const SHOPS=')));const r=metaOf(fs.readFileSync('p2.html','utf8'),process.argv[1]);console.log(JSON.stringify(r).slice(0,600))" "$U"
            grep -o '<title>[^<]*' p2.html | head -1
          done
