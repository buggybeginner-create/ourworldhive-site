name: Parcel Ledger Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-parcel/**', '.github/workflows/parcel-app.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIARY_KEY_PASS: ${{ secrets.DIARY_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build the APK (for your phone and the website download)
        working-directory: android-parcel
        run: gradle assembleFullDebug --no-daemon --stacktrace 2>&1 | tee ../build-log.txt; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Build the Play Store bundle (.aab)
        if: env.DIARY_KEY_PASS != ''
        working-directory: android-parcel
        run: gradle bundlePlayRelease --no-daemon --stacktrace 2>&1 | tee -a ../build-log.txt; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Name the files
        run: |
          cp android-parcel/app/build/outputs/apk/full/debug/app-full-debug.apk Parcel-Ledger.apk
          if [ -n "$DIARY_KEY_PASS" ]; then cp android-parcel/app/build/outputs/bundle/playRelease/app-play-release.aab Parcel-Ledger-PlayStore.aab; fi
          ls -la *.apk *.aab 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: Parcel-Ledger-app, path: 'Parcel-Ledger*' }
      - name: Put them on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: parcel-app
          name: Parcel Ledger Android app (latest)
          body: |
            Build ${{ github.run_number }}.
            Parcel-Ledger.apk: open it on your Android phone to install (also linked from ourworldhive.com/parcel-ledger.html).
            Parcel-Ledger-PlayStore.aab: upload this in Google Play Console when you publish.
          files: Parcel-Ledger*
          make_latest: false
      - name: Save the error log (only when the build fails)
        if: failure()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rq --cached . >/dev/null 2>&1 || true
          tail -c 60000 build-log.txt > parcel-build-log.txt || echo "no log" > parcel-build-log.txt
          git add -f parcel-build-log.txt
          git commit -qm "parcel build log ${{ github.run_number }}"
          git push -f origin ci-logs
