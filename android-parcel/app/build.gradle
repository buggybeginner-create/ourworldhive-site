plugins { id 'com.android.application' }
android {
    namespace 'com.ourworldhive.parcel'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ourworldhive.parcel'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        /* test builds for your own phone: one fixed key, so every new build installs over the old one */
        debug { storeFile file('../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        /* Play Store builds: the same upload key as My Diary, its password stays only in GitHub Secrets (DIARY_KEY_PASS) */
        upload { storeFile file('../../android-diary/upload.keystore'); storePassword System.getenv('DIARY_KEY_PASS') ?: ''; keyAlias 'upload'; keyPassword System.getenv('DIARY_KEY_PASS') ?: ''; storeType 'pkcs12' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { signingConfig signingConfigs.upload; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
